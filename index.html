<!DOCTYPE html>
<html lang="ru" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Тренажёр</title>
<style>
/* ===== Quiet Precision ===== */
:root{
  --bg:#faf9f6; --surface:#ffffff; --ink:#1b1b1f; --muted:#8a8a94;
  --line:#e9e7e1; --line-strong:#dcdad2;
  --accent:#4f46e5; --accent-soft:rgba(79,70,229,.08);
  --ok:#3f9d5a; --ok-soft:rgba(63,157,90,.10);
  --bad:#c4593f; --bad-soft:rgba(196,89,63,.10);
  --r:18px;
}
[data-theme="night"]{
  --bg:#0e0e12; --surface:#16161c; --ink:#ececf1; --muted:#7d7d8a;
  --line:#23232c; --line-strong:#2e2e3a;
  --accent:#9aa2ff; --accent-soft:rgba(154,162,255,.12);
  --ok:#6cc88a; --ok-soft:rgba(108,200,138,.14);
  --bad:#e08a72; --bad-soft:rgba(224,138,114,.14);
  color-scheme:dark;
}
[data-theme="sepia"]{
  --bg:#f3ead7; --surface:#fbf5e9; --ink:#3f3322; --muted:#9c8a6e;
  --line:#e4d7bd; --line-strong:#d8c8a8;
  --accent:#b06a16; --accent-soft:rgba(176,106,22,.10);
  --ok:#5b8a3a; --ok-soft:rgba(91,138,58,.12);
  --bad:#b4502f; --bad-soft:rgba(180,80,47,.10);
}
[data-theme="forest"]{
  --bg:#eef2ee; --surface:#fbfdfb; --ink:#16241c; --muted:#6b7d72;
  --line:#d9e2da; --line-strong:#c6d3c8;
  --accent:#1f7a47; --accent-soft:rgba(31,122,71,.09);
  --ok:#1f7a47; --ok-soft:rgba(31,122,71,.12);
  --bad:#b4502f; --bad-soft:rgba(180,80,47,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .4s ease,color .4s ease;
}
.wrap{
  width:100%;max-width:640px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px}
.mark{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.mark b{font-weight:600;font-size:15px;letter-spacing:.02em}
.mark span{font-size:12px;color:var(--muted);font-weight:400}
.themes{display:flex;gap:9px}
.sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:1.5px solid var(--line-strong);padding:0;transition:transform .15s ease}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw.t-paper{background:#faf9f6} .sw.t-night{background:#16161c}
.sw.t-sepia{background:#e9d8b4} .sw.t-forest{background:#cfe0d3}
.bars{margin-bottom:30px}
.track{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.track>i{display:block;height:100%;width:0;background:var(--accent);transition:width .55s cubic-bezier(.22,1,.36,1)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 30px;flex:none}
.fade{animation:fade .5s cubic-bezier(.22,1,.36,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- home / library ---- */
.home h1{font-weight:600;font-size:clamp(26px,6vw,32px);letter-spacing:-.02em;margin:2px 0 8px}
.home .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
.tlist{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.tcard{display:flex;align-items:center;gap:14px;padding:18px 18px;border:1px solid var(--line);
  border-radius:14px;cursor:pointer;background:var(--bg);transition:border-color .2s,background .2s,transform .12s}
.tcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.tcard:active{transform:translateY(1px)}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;font-size:15.5px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.tbadge{font-size:10.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:2px 8px;margin-left:8px;letter-spacing:.03em;vertical-align:middle}
.trm{flex:none;width:28px;height:28px;border-radius:8px;border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer;transition:color .2s,background .2s;line-height:1}
.trm:hover{color:var(--bad);background:var(--bad-soft)}
.tgo{flex:none;color:var(--muted);font-size:18px}
.tcard:hover .tgo{color:var(--accent)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;padding:28px 12px;border:1px dashed var(--line-strong);border-radius:14px;margin-bottom:22px}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.01em;
  padding:16px 20px;border-radius:13px;color:#fff;background:var(--accent);
  transition:transform .12s ease,opacity .2s ease,filter .2s ease;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{filter:none;background:var(--accent-soft);border-color:var(--accent)}
.linkfin{display:block;width:100%;text-align:center;margin-top:14px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:color .2s}
.linkfin:hover{color:var(--accent)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6;opacity:.85}
/* ---- question ---- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qnum{font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.qtype{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.qtext{font-size:16px;line-height:1.65;color:var(--ink)}
.qtext .lead{display:block}
.qtext .opt{display:block;margin-top:11px;padding-left:24px;text-indent:-24px}
.qtext .hdr{display:block;margin-top:20px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qtext .ins{display:block;margin-top:16px;font-size:13.5px;color:var(--muted);font-style:italic}
.az{margin-top:30px}
.az .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:11px;letter-spacing:.02em}
.field{width:100%;font-size:21px;font-weight:600;letter-spacing:.1em;text-align:center;font-family:inherit;
  color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:13px;padding:16px 12px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .3s}
.field::placeholder{letter-spacing:.01em;font-weight:400;font-size:13.5px;color:var(--muted);opacity:.55}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.good{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.field.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.az .btn{margin-top:16px}
.verdict{margin-top:22px;display:none}
.verdict.show{display:block;animation:fade .4s ease}
.vrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.verdict.ok .vrow{color:var(--ok)} .verdict.bad .vrow{color:var(--bad)}
.vdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.verdict.ok .vdot{background:var(--ok)} .verdict.bad .vdot{background:var(--bad)}
.cline{margin-top:12px;font-size:14px;color:var(--muted)}
.cline b{color:var(--ink);font-size:17px;letter-spacing:.06em;margin-left:4px}
.etog{margin-top:18px;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;letter-spacing:.01em}
.expl{margin-top:14px;overflow:hidden;max-height:0;transition:max-height .55s ease}
.expl.open{max-height:4000px}
.expl-inner{padding-top:4px;border-top:1px solid var(--line)}
.epoint{font-size:14px;line-height:1.7;color:var(--muted);margin-top:14px}
.epoint:first-child{margin-top:16px}
/* ---- review-all ---- */
.allhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.allhead h1{font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.allsub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.allitem{padding:22px 0;border-top:1px solid var(--line)}
.aans{margin-top:12px;font-size:14px;color:var(--muted)}
.aans b{color:var(--ok);font-size:16px;letter-spacing:.06em;margin-left:4px}
/* ---- result chart ---- */
.ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)}
.ring .seg{transition:stroke-dasharray 1.05s cubic-bezier(.22,1,.36,1)}
.ring .seg-ok{stroke:var(--ok)} .ring .seg-bad{stroke:var(--bad)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font-size:36px;font-weight:600;letter-spacing:-.02em}
.ring .lab b i{font-size:19px;color:var(--muted);font-style:normal}
.ring .lab span{font-size:12px;color:var(--muted);margin-top:2px}
.resbreak{display:flex;gap:12px;margin:16px 0 4px}
.resbox{flex:1;border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:center;background:var(--bg)}
.resbox b{display:block;font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1}
.resbox span{display:block;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.okbox b,.donebox b{color:var(--ok)}
.errbox{border-color:var(--bad);background:var(--bad-soft);cursor:pointer;transition:transform .12s,filter .2s,box-shadow .2s;
  box-shadow:0 0 0 3px var(--bad-soft)}
.errbox b{color:var(--bad)}
.errbox span{color:var(--bad);font-weight:600}
.errbox:hover{filter:brightness(1.05)}
.errbox:active{transform:translateY(1px)}
.resnote{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.gtitle{text-align:center;font-size:18px;font-weight:600;margin:18px 0 4px}
.gsub{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 auto 22px;max-width:38ch}
.rrow{display:flex;gap:12px}
.rrow .btn{flex:1}
.review h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:30px 0 14px}
.rev{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.rev .rn{color:var(--ink);font-weight:500;flex:none}
.rev .rd{color:var(--muted);margin-left:auto;text-align:right;font-size:13px}
.rev .rd .y{color:var(--bad);text-decoration:line-through;margin-right:8px}
.rev .rd .g{color:var(--ok);font-weight:600;letter-spacing:.05em}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;opacity:.6;letter-spacing:.03em}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(150%);
  background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:11px;font-size:13.5px;
  z-index:9;transition:transform .4s cubic-bezier(.22,1,.36,1);max-width:88vw}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:680px){.panel{padding:42px 44px}.qtext{font-size:16.5px}}
@media(max-width:380px){.panel{padding:28px 22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mark" onclick="home()"><b>Тренажёр</b><span>обществознание</span></div>
    <div class="themes" id="themes">
      <button class="sw t-paper"  data-t="paper"  aria-label="Бумага"></button>
      <button class="sw t-night"  data-t="night"  aria-label="Ночь"></button>
      <button class="sw t-sepia"  data-t="sepia"  aria-label="Сепия"></button>
      <button class="sw t-forest" data-t="forest" aria-label="Лес"></button>
    </div>
  </div>

  <div class="bars" id="bars" style="display:none">
    <div class="track"><i id="pbar"></i></div>
    <div class="meta"><span><b id="cur">1</b> / <b id="tot">50</b></span><span>верно <b id="scr">0</b></span></div>
  </div>

  <div id="app" class="panel"></div>
  <div class="foot" id="foot"></div>
</div>

<input type="file" id="file" accept=".csv,text/csv" multiple>
<div class="toast" id="toast"></div>

<script>
let tests=[];
let bank=[], curName="", curBase="", idx=0, score=0, answered=false, results=[], lastWrong=[];
const $=s=>document.querySelector(s);
const app=$('#app');

/* ---- theme ---- */
const THEMES=['paper','night','sepia','forest'];
function setTheme(t){
  if(THEMES.indexOf(t)<0) t='paper';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('tr_theme',t)}catch(e){}
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===t));
}
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));
(function(){let t='paper';try{t=localStorage.getItem('tr_theme')||'paper'}catch(e){}setTheme(t)})();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---- tests storage ---- */
function loadTests(){
  tests=[];
  try{
    const raw=localStorage.getItem('tr_tests');
    if(raw){JSON.parse(raw).forEach(t=>{if(t&&t.questions&&t.questions.length)tests.push({id:t.id,name:t.name,questions:t.questions})})}
  }catch(e){}
}
function saveTests(){
  try{localStorage.setItem('tr_tests', JSON.stringify(tests.filter(t=>!t.builtin)));}
  catch(e){toast('Не удалось сохранить (память браузера переполнена)')}
}

/* ---- helpers ---- */
function norm(s){return (s||'').replace(/\D/g,'')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function plural(n){const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'задание':(a>=2&&a<=4&&(b<10||b>=20)?'задания':'заданий'))}

function qType(t){
  if(/соответстви/i.test(t)) return 'Соответствие';
  if(/выберите верные суждения/i.test(t)) return 'Выбор суждений';
  if(/найдите|какие|что из|перечн/i.test(t)) return 'Несколько ответов';
  return 'Краткий ответ';
}
function fmtQ(t){
  let s=esc(t);
  s=s.replace(/\s*(ХАРАКТЕРИСТИКИ|ИСТОЧНИКИ[^0-9А-ЯЁ]*\([^)]*\)|ИСТОЧНИКИ[^0-9]*|ВИДЫ[^0-9]*|ПРОСТУПКИ|ПРИМЕРЫ|ДЕЙСТВИЯ[^0-9]*|МЕРЫ[^0-9]*|СИТУАЦИИ|ОСНОВАНИЯ[^0-9]*|КАТЕГОРИИ[^0-9]*|ЭЛЕМЕНТЫ[^0-9]*|ОРГАНИЗАЦИОННО[^0-9]*|СУБЪЕКТЫ|УЧАСТНИКИ[^0-9]*|СТОРОНЫ[^0-9]*|ПРАВОМОЧИЯ[^0-9]*)\s*/g,
    m=>'</span><span class="hdr">'+m.trim()+'</span><span class="lead">');
  s=s.replace(/\s*(\d{1,2}\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*([А-Д]\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*(Запишите[^]*)$/,'</span><span class="ins">$1');
  s='<span class="lead">'+s+'</span>';
  s=s.replace(/<span class="[a-z]+">\s*<\/span>/g,'');
  return s;
}
function fmtExpl(t){
  let s=esc(t).replace(/\s+/g,' ').trim();
  const letterMode=(s.match(/[АБВГД][.)]/g)||[]).length>=3;
  if(letterMode){
    s=s.replace(/\s*([АБВГД][.)])\s*/g,'</div><div class="epoint">$1 ');
  }else{
    s=s.replace(/(^|[\s.;:»)\]])(\d{1,2}[.)])\s+/g,'$1</div><div class="epoint">$2 ');
  }
  s='<div class="epoint">'+s+'</div>';
  s=s.replace(/<div class="epoint">\s*<\/div>/g,'');
  return s;
}

/* ---- home / library ---- */
function home(){
  $('#bars').style.display='none';
  $('#foot').textContent='';
  app.className='panel fade';
  const cards=tests.map(t=>`
    <div class="tcard" onclick="openTest('${t.id}')">
      <div class="tinfo">
        <div class="tname">${esc(t.name)}${t.builtin?'<span class="tbadge">встроенный</span>':''}</div>
        <div class="tmeta">${plural(t.questions.length)}</div>
      </div>
      ${t.builtin?'':`<button class="trm" title="Удалить" onclick="event.stopPropagation();removeTest('${t.id}')">✕</button>`}
      <span class="tgo">→</span>
    </div>`).join('');
  app.innerHTML=`
    <div class="home">
      <h1>Тесты</h1>
      <p class="sub">Выбери тест или добавь свой. Имя теста = имя файла.</p>
      ${tests.length?`<div class="tlist">${cards}</div>`:`<div class="empty">Пока нет тестов.<br>Добавь CSV-файл, чтобы начать.</div>`}
      <button class="btn ghost" onclick="document.getElementById('file').click()">+ Добавить тесты (CSV)</button>
      <div class="note">Можно выбрать сразу несколько файлов. Формат CSV: «Номер задания», «Текст вопроса и варианты ответа», «Правильный ответ», «Пояснение».</div>
    </div>`;
}

function openTest(id){
  const t=tests.find(x=>x.id===id); if(!t)return;
  bank=t.questions; curName=t.name; curBase=t.name; begin();
}
function removeTest(id){
  tests=tests.filter(t=>t.id!==id); saveTests(); home();
}
function startMistakes(){
  if(!lastWrong.length){toast('Ошибок нет');return}
  bank=lastWrong.slice(); curName=curBase+' · работа над ошибками'; begin();
}

function begin(){idx=0;score=0;results=[];render()}

function bars(){
  $('#bars').style.display='block';
  $('#tot').textContent=bank.length;
  $('#cur').textContent=Math.min(idx+1,bank.length);
  $('#scr').textContent=score;
  $('#pbar').style.width=(idx/bank.length*100)+'%';
}

function render(){
  if(idx>=bank.length) return finish();
  answered=false;
  const q=bank[idx];
  bars();
  $('#foot').textContent=curName;
  app.className='panel fade';
  app.innerHTML=`
    <div class="qhead">
      <span class="qnum">${esc(q.n||('Задание '+(idx+1)))}</span>
      <span class="qtype">${qType(q.text)}</span>
    </div>
    <div class="qtext">${fmtQ(q.text)}</div>
    <div class="az">
      <label class="lab" for="inp">Твой ответ — только цифры</label>
      <input id="inp" class="field" inputmode="numeric" autocomplete="off" placeholder="Ты точно знаешь правильный ответ">
      <button class="btn" id="check" onclick="check()">Проверить</button>
      <button class="linkfin" onclick="finishEarly()">Завершить тест</button>
    </div>
    <div class="verdict" id="verdict"></div>`;
  const inp=$('#inp'); inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answered?next():check()}});
}

function check(){
  if(answered) return;
  const q=bank[idx], inp=$('#inp'), user=norm(inp.value);
  if(!user){inp.classList.add('wrong');setTimeout(()=>inp.classList.remove('wrong'),360);toast('Введи ответ');return}
  answered=true;
  const ok=user===norm(q.answer);
  if(ok) score++;
  results.push({q,n:q.n,user,answer:norm(q.answer),ok});
  inp.classList.add(ok?'good':'wrong'); inp.readOnly=true;
  $('#scr').textContent=score;
  $('#check').outerHTML=`<button class="btn" onclick="next()">${idx+1<bank.length?'Дальше':'Результат'}</button>`;
  const v=$('#verdict');
  v.className='verdict show '+(ok?'ok':'bad');
  v.innerHTML=`
    <div class="vrow"><span class="vdot">${ok?'✓':'✕'}</span>${ok?'Верно':'Неверно'}</div>
    ${ok?'':`<div class="cline">Правильный ответ:<b>${esc(q.answer)}</b></div>`}
    ${q.explanation?`<button class="etog" onclick="tog(this)">Скрыть разбор</button>
      <div class="expl open"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}`;
  setTimeout(()=>{if(v.scrollIntoView)v.scrollIntoView({behavior:'smooth',block:'nearest'})},120);
}
function tog(b){const e=b.nextElementSibling;e.classList.toggle('open');
  b.textContent=e.classList.contains('open')?'Скрыть разбор':'Показать разбор'}
function next(){idx++;render()}

/* ---- result chart (correct vs wrong + работа над ошибками) ---- */
function resultChart(correct,wrong,total){
  const C=2*Math.PI*66;
  const okLen=total?C*correct/total:0, badLen=total?C*wrong/total:0;
  const p=total?Math.round(correct/total*100):0;
  const undone=total-correct-wrong;
  return `
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle class="bgc" cx="75" cy="75" r="66" fill="none" stroke-width="10"/>
        <circle class="seg seg-ok" id="segok" cx="75" cy="75" r="66" fill="none" stroke-width="10"
          stroke-linecap="butt" stroke-dasharray="0 ${C}"/>
        <circle class="seg seg-bad" id="segbad" cx="75" cy="75" r="66" fill="none" stroke-width="10"
          stroke-linecap="butt" stroke-dasharray="0 ${C}" stroke-dashoffset="${-okLen}"/>
      </svg>
      <div class="lab"><b>${correct}<i>/${total}</i></b><span>${p}% верно</span></div>
    </div>
    <div class="resbreak">
      <div class="resbox okbox"><b>${correct}</b><span>верно</span></div>
      ${wrong>0
        ? `<div class="resbox errbox" onclick="startMistakes()"><b>${wrong}</b><span>работа над ошибками →</span></div>`
        : `<div class="resbox donebox"><b>✓</b><span>ошибок нет</span></div>`}
    </div>
    ${undone>0?`<div class="resnote">Не решено: ${undone} из ${total}</div>`:''}`;
}
function animChart(correct,wrong,total){
  const C=2*Math.PI*66;
  const okLen=total?C*correct/total:0, badLen=total?C*wrong/total:0;
  setTimeout(()=>{
    const so=$('#segok'), sb=$('#segbad');
    if(so) so.setAttribute('stroke-dasharray', okLen+' '+(C-okLen));
    if(sb) sb.setAttribute('stroke-dasharray', badLen+' '+(C-badLen));
  },150);
}

function grade(p){
  if(p>=90) return ['Отлично','Материал ты знаешь уверенно.'];
  if(p>=75) return ['Хорошо','Крепкий результат — почти идеал.'];
  if(p>=50) return ['Неплохо','База есть, слабые темы стоит повторить.'];
  return ['Нужно повторить','Пройди материал ещё раз и попробуй снова.'];
}

/* full completion */
function finish(){
  $('#pbar').style.width='100%'; $('#cur').textContent=bank.length;
  const total=bank.length, correct=score, wrong=results.filter(r=>!r.ok).length;
  lastWrong=results.filter(r=>!r.ok).map(r=>r.q);
  const p=Math.round(correct/total*100), gr=grade(p), g=gr[0], gs=gr[1];
  app.className='panel fade';
  app.innerHTML=`
    ${resultChart(correct,wrong,total)}
    <div class="gtitle">${g}</div>
    <div class="gsub">${esc(curName)} · ${gs}</div>
    <div class="rrow">
      <button class="btn" onclick="openTest2()">Решать заново</button>
      <button class="btn ghost" onclick="home()">К тестам</button>
    </div>
    <button class="linkfin" onclick="finishEarly()">Показать все задания с ответами</button>`;
  animChart(correct,wrong,total);
}
/* restart current base test from scratch */
function openTest2(){ bank = tests.find(t=>t.name===curBase)?tests.find(t=>t.name===curBase).questions:bank; curName=curBase; begin(); }

/* early finish: chart + all questions + answers + explanation toggles */
function finishEarly(){
  $('#bars').style.display='none';
  const total=bank.length, correct=results.filter(r=>r.ok).length, wrong=results.filter(r=>!r.ok).length;
  lastWrong=results.filter(r=>!r.ok).map(r=>r.q);
  app.className='panel fade';
  const items=bank.map((q,i)=>`
    <div class="allitem">
      <div class="qhead">
        <span class="qnum">${esc(q.n||('Задание '+(i+1)))}</span>
        <span class="qtype">${qType(q.text)}</span>
      </div>
      <div class="qtext">${fmtQ(q.text)}</div>
      <div class="aans">Правильный ответ:<b>${esc(q.answer)}</b></div>
      ${q.explanation?`<button class="etog" onclick="tog2(this)">Пояснение</button>
        <div class="expl"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}
    </div>`).join('');
  app.innerHTML=`
    <div class="allhead"><h1>Результат</h1></div>
    <p class="allsub">${esc(curName)}</p>
    ${resultChart(correct,wrong,total)}
    <div class="rrow" style="margin-top:18px">
      <button class="btn" onclick="openTest2()">Решать заново</button>
      <button class="btn ghost" onclick="home()">К тестам</button>
    </div>
    <div class="review"><h3>Все задания с ответами</h3></div>
    ${items}`;
  animChart(correct,wrong,total);
  window.scrollTo({top:0,behavior:'smooth'});
}
function tog2(b){const e=b.nextElementSibling;e.classList.toggle('open');
  b.textContent=e.classList.contains('open')?'Скрыть пояснение':'Пояснение'}

/* ---- add tests from files ---- */
function fileName(name){return name.replace(/\.[^.]+$/,'').trim()||'Без имени'}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
$('#file').addEventListener('change',ev=>{
  const files=[...ev.target.files]; ev.target.value='';
  if(!files.length) return;
  let added=0, pending=files.length;
  const done=()=>{ if(--pending===0){ saveTests(); home();
    toast(added?('Добавлено тестов: '+added):'Не удалось прочитать файлы'); } };
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ try{const qs=parseCSV(r.result);
      if(qs.length){tests.push({id:uid(),name:fileName(f.name),questions:qs}); added++;}}catch(e){} done(); };
    r.onerror=()=>done();
    r.readAsText(f,'utf-8');
  });
});
function parseCSV(text){
  text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}}
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<3)continue;
    const n=(r[0]||'').trim(),tx=(r[1]||'').trim(),an=(r[2]||'').trim();
    if(!tx||!an)continue;
    out.push({n:n||('Задание '+i),text:tx,answer:an,explanation:(r[3]||'').trim()})}
  return out;
}

loadTests();
home();
</script>
