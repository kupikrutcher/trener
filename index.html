<!DOCTYPE html>
<html lang="ru" data-theme="paper">
<head>
<meta charset="UTF-8">
<!-- у экранов свои адреса (/lessons, /schedule…): относительные пути к файлам считаем от корня сайта; зеркало на GitHub Pages живёт в /trener/ -->
<script>if(location.hostname.endsWith('github.io'))document.write('<base href="/trener/">')</script>
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3">
<title>ЕГЭ с Машей Вайб</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design/tokens.css">
<style>
/* цвета, шрифты, отступы и радиусы — design/tokens.css */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  background:var(--bg); color:var(--ink);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .4s ease,color .4s ease;
}
.wrap{
  width:100%;max-width:640px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px}
.mark{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.mark b{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark span{font-size:12px;color:var(--muted);font-weight:400}
.theme-tog{flex:none;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:var(--radius-pill);cursor:pointer;
  background:var(--surface);color:var(--cobalt);transition:transform .15s ease}
.theme-tog:active{transform:scale(.92)}
.theme-tog svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-tog .i-moon path{fill:currentColor;stroke:none}
.theme-tog .i-sun{display:none}
[data-theme="night"] .theme-tog .i-sun{display:block}[data-theme="night"] .theme-tog .i-moon{display:none}
.bars{margin-bottom:30px}
.track{height:4px;border-radius:0;background:var(--line);overflow:hidden}
.track>i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s var(--ease-out)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--ink);font-weight:600}
.qnav{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding:7px 2px 10px;scrollbar-width:thin;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.qnav::-webkit-scrollbar{height:4px}.qnav::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:0}
.qn{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:var(--radius-cell);border:1px solid var(--line-strong);background:var(--surface);
  color:var(--muted);font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.qn:first-child{margin-left:12px}.qn:last-child{margin-right:12px}
.qn:hover{border-color:var(--accent);color:var(--accent)}
.qn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qn.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qn.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);color:var(--ink)}
.qn.ok.cur,.qn.bad.cur,.qn.done.cur{color:inherit}
.qsep{flex:none;align-self:center;font-size:11px;color:var(--muted);letter-spacing:.04em;padding:0 4px 0 8px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 30px;flex:none}
/* ---- home / library ---- */
.home h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,6vw,32px);letter-spacing:-.02em;margin:2px 0 8px}
.home .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
.tlist{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.tcard{display:flex;align-items:center;gap:14px;padding:18px 18px;border:1px solid var(--line);
  border-radius:var(--radius-md);cursor:pointer;background:var(--bg)}
.tcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;font-size:15.5px;letter-spacing:.01em;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sect{border-top:1px solid var(--line)}
.sect:last-of-type{border-bottom:1px solid var(--line);margin-bottom:22px}
.sect>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 2px;cursor:pointer;user-select:none}
.sect>summary::-webkit-details-marker{display:none}
/* уроки ученика по блокам: «Уроки N блока» раскрываются по нажатию */
.lblock{margin-bottom:12px}
.lblock>summary{list-style:none;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:18px 20px;cursor:pointer;user-select:none;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-soft)}
.lblock>summary::-webkit-details-marker{display:none}
.lblock>summary:hover{border-color:var(--cobalt)}
.lblock .lb-t{font:700 17px/1.3 var(--font-display)}
.lblock .lb-m{font-size:13px;color:var(--muted)}
.lblock .sa{margin-left:auto;color:var(--muted);font-size:18px;transition:transform .25s ease}
.lblock[open]>summary .sa{transform:rotate(90deg)}
.lblock>.tlist{margin:12px 0 18px}
.sect>summary .st{font-weight:600;font-size:16px;letter-spacing:-.005em}
.sect>summary .sc{font-size:12px;color:var(--muted);border:1px solid var(--line-strong);border-radius:var(--radius-cell);font-variant-numeric:tabular-nums;padding:1px 8px}
.sect>summary .sa{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .25s ease}
.sect[open]>summary .sa{transform:rotate(90deg)}
.sect>summary:hover .st{color:var(--accent)}
.sect .tlist{margin-bottom:18px}
.tmeta{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.tbadge{font-size:10.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:var(--radius-cell);padding:2px 8px;margin-left:8px;letter-spacing:.03em;vertical-align:middle}
.trm{flex:none;width:28px;height:28px;border-radius:var(--radius-cell);border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer;transition:color .2s,background .2s;line-height:1}
.trm:hover{color:var(--bad);background:var(--bad-soft)}
.tgo{flex:none;color:var(--muted);font-size:18px}
.tcard:hover .tgo{color:var(--accent)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;padding:28px 12px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);margin-bottom:22px}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.01em;
  padding:16px 20px;border-radius:var(--radius-md);color:var(--on-cobalt);background:var(--accent);min-height:52px;font-family:inherit}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{filter:none;background:var(--accent-soft);border-color:var(--accent)}
.linkfin{display:block;width:100%;text-align:center;margin-top:14px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:color .2s}
.linkfin:hover{color:var(--accent)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6;opacity:.85}
/* ---- question ---- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qnum{font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.qtype{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);padding:3px 10px;border-radius:var(--radius-cell);letter-spacing:.02em}
.qtext{font-size:16px;line-height:26px;max-width:64ch;color:var(--ink)}
.qtext .lead{display:block}
.qtext .opt{display:block;margin-top:11px;padding-left:24px;text-indent:-24px}
.qtext .hdr{display:block;margin-top:20px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qtext .ins{display:block;margin-top:16px;font-size:13.5px;color:var(--muted);font-style:italic}
.az{margin-top:30px}
.az .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:11px;letter-spacing:.02em}
.ans-inp{display:block;max-width:280px;font:600 22px/1.2 var(--font-mono);letter-spacing:.14em;padding:14px 16px}
.ans-inp::placeholder{font:500 15px var(--font-sans);letter-spacing:0}
.ans-inp.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ans-inp.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ans-inp.wrong{border-color:var(--bad);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.az .btn{margin-top:16px}
.verdict{margin-top:18px;display:none}
.verdict.show{display:block}
.vbox{display:grid;gap:var(--space-2);padding:14px 16px;border-radius:var(--radius-md);border:1px solid}
.vbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.vbox.bad{background:var(--bad-soft);border-color:var(--bad)}
.vbox .vhead{display:flex;align-items:center;gap:var(--space-2);font-weight:600;font-size:15px}
.vbox.ok .vhead{color:var(--ok)} .vbox.bad .vhead{color:var(--bad)}
.vbox .vline{color:var(--ink);font-size:14px}
.vbox .vline b{font:600 17px/1 var(--font-mono);letter-spacing:.08em;margin-left:var(--space-1)}
.vbox .vline.muted{color:var(--muted)}
.rz{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.vrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.verdict.ok .vrow{color:var(--ok)} .verdict.bad .vrow{color:var(--bad)}
.vdot{width:22px;height:22px;border-radius:var(--radius-pill);display:grid;place-items:center;color:var(--on-cobalt);font-size:13px;flex:none}
.verdict.ok .vdot{background:var(--ok)} .verdict.bad .vdot{background:var(--bad)}
.cline{margin-top:12px;font-size:14px;color:var(--muted)}
.cline b{color:var(--ink);font-size:17px;letter-spacing:.06em;margin-left:4px}
.etog{margin-top:18px;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;letter-spacing:.01em}
.expl{margin-top:14px;overflow:hidden;max-height:0;transition:max-height .55s ease}
.expl.open{max-height:4000px}
.expl-inner{padding-top:4px;border-top:1px solid var(--line)}
.epoint{font-size:14px;line-height:1.7;color:var(--muted);margin-top:14px}
.epoint:first-child{margin-top:16px}
/* ---- review-all ---- */
.allhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.allhead h1{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.allsub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.allitem{padding:22px 0;border-top:1px solid var(--line)}
.aans{margin-top:12px;font-size:14px;color:var(--muted)}
.aans b{color:var(--ok);font:600 16px/1 var(--font-mono);letter-spacing:.08em;margin-left:4px}
.mine{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:12px;font-size:14px;color:var(--muted)}
.mine b{color:var(--ink);font:600 16px/1 var(--font-mono);letter-spacing:.08em}
.mine span{font-weight:700;font-size:13px}
.mine.ok span{color:var(--ok)}.mine.bad span{color:var(--bad)}
/* ---- результат ---- */
.resnote{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.gsub{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 auto 22px;max-width:38ch}
.rrow{display:flex;gap:12px}
.rrow .btn{flex:1}
.review h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:30px 0 14px}
.rev{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.rev .rn{color:var(--ink);font-weight:500;flex:none}
.rev .rd{color:var(--muted);margin-left:auto;text-align:right;font-size:13px}
.rev .rd .y{color:var(--bad);text-decoration:line-through;margin-right:8px}
.rev .rd .g{color:var(--ok);font-weight:600;letter-spacing:.05em}
.p2text{font-size:16px;line-height:1.65;color:var(--ink)}
/* картинка задания — на светлой подложке и в тёмной теме: сама диаграмма чёрно-белая */
.qimg-a{display:block;cursor:zoom-in}
.qimg{display:block;max-width:min(100%,640px);height:auto;margin:14px 0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
.ldescr{font-size:15.5px;line-height:1.65;color:var(--ink);white-space:pre-wrap;margin:4px 0 20px}   /* описание урока: переносы строк как ввёл учитель */
.p2text p{margin:0 0 12px}.p2text p:last-child{margin-bottom:0}
.essay{width:100%;min-height:200px;resize:vertical;font-family:inherit;font-size:15.5px;line-height:1.6;color:var(--ink);
  background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:14px 16px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .3s}
.essay::placeholder{color:var(--muted);opacity:.6}
.essay:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.essay.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft);animation:shake .35s}
.essay[readonly]{opacity:.85}
.saved{margin-top:8px;font-size:12px;color:var(--muted);text-align:right;min-height:16px}
.uans{margin-top:12px;font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-wrap;border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.uans.none{color:var(--muted);font-style:italic;border-left-color:var(--line-strong)}
.uans-lab{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.02em}
/* ---- кабинеты ---- */
.acct{border:1px solid var(--line-strong);background:none;color:var(--ink);font:600 12.5px/1 inherit;font-family:inherit;
  padding:7px 12px;border-radius:var(--radius-md);cursor:pointer;margin-left:auto;margin-right:14px;transition:border-color .2s,color .2s}
.acct:hover{border-color:var(--accent);color:var(--accent)}
.cab-h{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.cab-sub{color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.cab-h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 12px}
.cab-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cab-load{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
.cab-err{color:var(--bad);font-size:13px;min-height:18px;margin:10px 0 4px}
.tin{width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);
  border-radius:var(--radius-md);padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.tin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font:600 13px/1.4 inherit;font-family:inherit;cursor:pointer}
.linkbtn.danger{color:var(--bad)}
.linkbtn.back{color:var(--muted)}
.st-ok,.st-wait{flex:none;font-size:11.5px;font-weight:600;border-radius:var(--radius-cell);padding:3px 9px;letter-spacing:.02em}
.st-ok{color:var(--ok);background:var(--ok-soft)}
.st-wait{color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:6px;margin:18px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.cab .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;margin-bottom:-1px;color:var(--muted);
  font:600 14px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
/* переключатель внутри вкладки: «Ждут проверки» / «Все работы» */
.seg{display:inline-flex;gap:4px;padding:4px;margin-bottom:16px;background:var(--surface-sunk);border-radius:var(--radius-pill);box-shadow:var(--shadow-press)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:var(--radius-pill);font:600 13.5px/1 var(--font-sans);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--cobalt);box-shadow:var(--shadow-soft)}
/* банк заданий: фильтры блок / тема / номер */
.bank-f{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:var(--space-3)}
.bank-sum{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin:var(--space-4) 0 var(--space-3);font-size:14px;color:var(--muted)}
.bank-sum b{color:var(--ink)}
/* банк у учителя: задания с галочкой «Добавить в ДЗ» и панель «Новое ДЗ» */
.bq-list{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)}
.bq{padding:var(--space-4);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.bq.on{border-color:var(--accent)}
.bq-h{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);font-size:13px;color:var(--muted)}
.bq-h .bq-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bq-h .chk{margin:0;font-size:13.5px;color:var(--ink);white-space:nowrap}
.bq-x{font-size:15px;line-height:1.55}
.bq-x .opt,.bq-x .hdr,.bq-x .ins{display:block}
.bq-a{margin-top:var(--space-2);font-size:13px;color:var(--muted)}.bq-a b{font:600 14px var(--font-mono);color:var(--ink)}
.nhw{position:sticky;bottom:var(--space-3);z-index:5;margin-top:var(--space-4);padding:var(--space-4);border:1px solid var(--accent);
  border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-lift);max-height:75vh;overflow:auto}
.nhw-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.nhw-h b{font:700 16px/1.3 var(--font-display)}
.nhw-s{margin:var(--space-2) 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}.nhw-s b{color:var(--ink);font-weight:600}
.nhw-f{display:grid;grid-template-columns:1.4fr 1fr auto;gap:var(--space-2);align-items:end;margin-top:var(--space-3)}
.nhw-f .btn{width:auto}
@media (max-width:640px){.nhw{max-height:42vh}.nhw-f{grid-template-columns:1fr}.nhw-f .btn{width:100%}}
/* выпадающий список в стиле сайта: «вдавленное» поле + выпуклая панель */
.dd{position:relative;min-width:0}
.dd-btn{width:100%;min-height:48px;display:flex;align-items:center;gap:var(--space-2);padding:12px 14px;text-align:left;font:500 14.5px/1.3 var(--font-sans);color:var(--ink);
  background:var(--surface-sunk);box-shadow:var(--shadow-press);border:1px solid transparent;border-radius:var(--radius-md);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.dd-btn:hover{border-color:var(--line-strong)}
.dd-btn:focus-visible,.dd-btn[aria-expanded="true"]{outline:none;border-color:var(--cobalt);box-shadow:var(--shadow-press),0 0 0 3px var(--cobalt-soft)}

.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;opacity:.6;letter-spacing:.03em}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(150%);
  background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:var(--radius-md);box-shadow:var(--shadow-lift);font-size:13.5px;
  z-index:9;transition:transform .45s var(--ease-drawer),opacity .25s ease,visibility .45s;max-width:88vw;
  opacity:0;visibility:hidden;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media(min-width:680px){.panel{padding:42px 44px}.qtext{font-size:16.5px}}
@media(max-width:380px){.panel{padding:28px 22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ---- левая панель ---- */
.side{position:fixed;top:0;left:0;bottom:0;width:264px;z-index:30;display:flex;flex-direction:column;gap:28px;padding:30px 18px;overflow-y:auto;
  background:var(--surface);box-shadow:var(--shadow-lift);border-radius:0 var(--radius-lg) var(--radius-lg) 0;
  transform:translateX(-110%);transition:transform .42s var(--ease-drawer)}
.side.open{transform:none}
.side-dim{position:fixed;inset:0;z-index:29;background:rgba(20,15,60,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.side.open+.side-dim{opacity:1;pointer-events:auto}
.side-mark{font:700 27px/1.12 var(--font-display);letter-spacing:-.02em;padding:2px 10px;cursor:pointer;color:var(--ink)}
.side-nav{display:flex;flex-direction:column;gap:6px}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;border-radius:var(--radius-md);
  font:600 15px/1.2 var(--font-sans);color:var(--ink-muted);cursor:pointer;text-align:left}
.side-nav button[hidden]{display:none}
.side-nav svg,.burger svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side-nav button:hover{color:var(--ink);background:var(--surface-sunk)}
.side-nav button[aria-current]{color:var(--cobalt);background:var(--cobalt-soft);box-shadow:var(--shadow-soft)}
.burger{flex:none;display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;border-radius:var(--radius-pill);
  background:var(--surface);box-shadow:var(--shadow-soft);color:var(--ink);cursor:pointer}
.topbar .mark{display:none}   /* название — наверху левой панели */
@media(min-width:1000px){
  body{padding-left:264px}
  .side{transform:none;transition:none}
  .side-dim,.burger{display:none}
  /* курс занимает всю ширину и высоту справа от панели */
  .wrap{max-width:none;margin:0;padding:18px 28px 28px}
  .topbar{padding:0 0 16px}
  .panel{flex:1;padding:44px 56px}
  /* внутри — удобная ширина чтения: формы и главная по центру, списки шире */
  .az,.qhead,.qtext,.p2text,.verdict{max-width:760px}
  .cab,.home,.rs,.review,.allitem{max-width:1040px}
  .bars{max-width:none}
}
/* кнопка «Выйти» — всегда красная, квадрат со скруглёнными углами */
.logout{color:var(--surface);background:var(--bad);border:1.5px solid var(--bad);border-radius:10px;padding:7px 14px;font:700 13px/1 var(--font-sans);cursor:pointer}
.logout:hover{filter:brightness(1.08)}
/* расписание и файлы */
.sch-day{margin:22px 0 10px;font:700 13px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sch-day.today{color:var(--cobalt)}
.sch-ev{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line-strong);
  box-shadow:var(--shadow-soft);cursor:pointer;margin-bottom:8px}
.sch-ev b{display:block;font-size:15px}.sch-ev span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.sch-ev .sch-k{flex:none;font-size:11.5px;font-weight:700;border-radius:var(--radius-pill);padding:4px 10px;color:var(--cobalt);background:var(--cobalt-soft)}
.sch-ev .sch-k.dz{color:var(--bad);background:var(--bad-soft)}.sch-ev .sch-k.ok{color:var(--ok);background:var(--ok-soft)}
.files-h{margin:22px 0 10px;font:700 15px/1.3 var(--font-display)}
.fitem a.fnm{color:inherit;text-decoration:none}.fitem a.fnm:hover{color:var(--accent);text-decoration:underline}
#fldrop{margin-bottom:4px}

/* ================= общий слой для всех стилей: движение (Emil Kowalski), браузерные поверхности, раскладка главной ================= */
::selection{background:var(--marker);color:var(--on-marker)}
html{scrollbar-color:var(--line-strong) transparent;accent-color:var(--cobalt)}
input,textarea{caret-color:var(--cobalt)}
a{text-underline-offset:.2em;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
h1,h2,h3,.cab-h,.allhead h1{text-wrap:balance}
.qtext,.p2text,.land-sub,.cab-sub,.gsub{text-wrap:pretty}
b,.pstat b,.rs-tile b,.cp-d b,.sumline b{font-variant-numeric:tabular-nums}
.fade{animation:enter var(--dur-enter,.42s) var(--ease-out) both}
@keyframes enter{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
/* нажатие: всё, что нажимается, чуть проседает */
.btn{transition:transform var(--dur-press) var(--ease-out),box-shadow var(--dur-ui) ease,background-color var(--dur-ui) ease,color var(--dur-ui) ease,border-color var(--dur-ui) ease}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn:disabled{opacity:.45;cursor:default;transform:none}
.linkbtn:active,.etog:active{transform:scale(.97)}
.acct:active,.theme-tog:active,.burger:active,.ava:active{transform:scale(.94)}
.logout{transition:transform var(--dur-press) var(--ease-out)}.logout:active{transform:scale(.96)}
.tcard,.dl,.sch-ev,a.fitem{transition:border-color var(--dur-ui) ease,box-shadow var(--dur-ui) ease,background-color var(--dur-ui) ease,transform var(--dur-press) var(--ease-out)}
.tcard:active,.dl:active,.sch-ev:active,a.fitem:active{transform:scale(.99)}
.qn{transition:border-color var(--dur-ui) ease,color var(--dur-ui) ease,background-color var(--dur-ui) ease,box-shadow var(--dur-ui) ease,transform var(--dur-press) var(--ease-out)}
.qn:active{transform:scale(.92)}
.side-nav button{transition:background-color var(--dur-ui) ease,color var(--dur-ui) ease,transform var(--dur-press) var(--ease-out)}
.side-nav button:active{transform:scale(.97)}
.tgo{transition:transform var(--dur-ui) var(--ease-out),color var(--dur-ui) ease}
@media (hover:hover) and (pointer:fine){.tcard:hover .tgo{transform:translateX(3px);color:var(--cobalt)}}

.fade :is(.tlist,.dl-list,.cp-list,.flist,.rs-tiles,.pstats,.stable)>*{animation:rise .36s var(--ease-out) both}

.fade :is(.tlist,.dl-list,.cp-list,.flist,.rs-tiles,.pstats,.stable)>:nth-child(3){animation-delay:80ms}
.fade :is(.tlist,.dl-list,.cp-list,.flist,.rs-tiles,.pstats,.stable)>:nth-child(4){animation-delay:120ms}
.fade :is(.tlist,.dl-list,.cp-list,.flist,.rs-tiles,.pstats,.stable)>:nth-child(5){animation-delay:160ms}
.fade :is(.tlist,.dl-list,.cp-list,.flist,.rs-tiles,.pstats,.stable)>:nth-child(n+6){animation-delay:200ms}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.side-dim{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.side-foot{margin-top:auto;padding:0 10px;font:700 21px/1.15 var(--font-hand);color:var(--ink-muted);transform:rotate(-3deg);transform-origin:left}
/* маркер и рукописные пометки */
.mv-mark{background:linear-gradient(transparent 12%,var(--marker) 12%,var(--marker) 88%,transparent 88%) no-repeat 0 0/100% 100%;
  color:var(--on-marker);padding:0 .12em;margin:0 -.06em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

@keyframes heroIn{from{opacity:0;transform:translateY(16px)}}
.land-tag svg{width:58px;height:40px;margin-left:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:120;stroke-dashoffset:120;animation:drawLine .7s var(--ease-out) .9s forwards}

<div class="toast" id="toast"></div>

<script>
let tests=[];
let review=null; /* {sub}: разбор отправленной работы */
let bank=[], curId="", curName="", curBase="", idx=0, score=0, answered=false, results=[], lastWrong=[];
const $=s=>document.querySelector(s);
const app=$('#app');

$('#qnav').addEventListener('wheel',e=>{const n=e.currentTarget;
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&n.scrollWidth>n.clientWidth){n.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});

/* ---- theme ---- */
const THEMES=['paper','night'];   // сохранённые «sepia»/«forest» превращаются в «paper»
function setTheme(t){
  if(THEMES.indexOf(t)<0) t='paper';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('tr_theme',t)}catch(e){}
  const b=$('#themetog'); if(b){ const l=t==='night'?'Светлая тема':'Тёмная тема'; b.setAttribute('aria-label',l); b.title=l; }
}
(function(){let t='paper';try{t=localStorage.getItem('tr_theme')||'paper'}catch(e){}setTheme(t)})();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---- tests storage ---- */
/* задания всех ДЗ — tests.json (≈3 МБ): грузятся в фоне при открытии сайта, экраны с ДЗ ждут loadTests() */
/* + ДЗ, которые учитель собрал из банка (сервер, hw_list): у них есть folder и custom — id на сервере */
let testsP=null, hwP=null, fileTests=[];
function loadTests(){
  testsP=testsP||fetch('tests.json').then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(list=>{ fileTests=list.map((t,i)=>({id:'b'+i,name:t.name,questions:t.questions})); })
    .catch(()=>{ testsP=null; throw new Error('Не удалось загрузить задания. Проверь интернет.'); });
  hwP=hwP||(typeof api==='function'&&getToken() ? api('hw_list').then(r=>r.tests).catch(()=>{ hwP=null; return []; }) : Promise.resolve([]));
  return Promise.all([testsP,hwP]).then(([,hw])=>{
    tests=[...fileTests, ...hw.map(t=>({id:'c'+t.id,name:t.name,questions:t.questions,folder:t.folder,custom:t.id}))]; });
}

/* ---- helpers ---- */
function norm(s){return (s||'').replace(/\D/g,'')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
/* склонение по числу: ru(5,'день','дня','дней') → 'дней' */
function ru(n,one,few,many){const a=n%10,b=n%100;return a===1&&b!==11?one:(a>=2&&a<=4&&(b<10||b>=20)?few:many)}
function plural(n){return n+' '+ru(n,'задание','задания','заданий')}

function qType(t){
  if(/установите\s+соответствие/i.test(t)) return 'Соответствие';   // не просто «соответстви»: «в соответствии с кодексом» — это выбор суждений
  if(/выберите верные суждения/i.test(t)) return 'Выбор суждений';
  if(/найдите|какие|что из|перечн/i.test(t)) return 'Несколько ответов';
  return 'Краткий ответ';
}
function fmtQ(t,q){
  t=t.replace(/\s*\d+\s*балл(?:а|ов)?\s*$/i,'');
  let s=esc(t);
  s=s.replace(/\s*(ХАРАКТЕРИСТИКИ|ИСТОЧНИКИ[^0-9А-ЯЁ]*\([^)]*\)|ИСТОЧНИКИ[^0-9]*|ВИДЫ[^0-9]*|ПРОСТУПКИ|ПРИМЕРЫ|ДЕЙСТВИЯ[^0-9]*|МЕРЫ[^0-9]*|СИТУАЦИИ|ОСНОВАНИЯ[^0-9]*|КАТЕГОРИИ[^0-9]*|ЭЛЕМЕНТЫ[^0-9]*|ОРГАНИЗАЦИОННО[^0-9]*|СУБЪЕКТЫ|УЧАСТНИКИ[^0-9]*|СТОРОНЫ[^0-9]*|ПРАВОМОЧИЯ[^0-9]*)\s*/g,
    m=>'</span><span class="hdr">'+m.trim()+'</span><span class="lead">');
  s=s.replace(/\s*(\d{1,2}\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*([А-Д]\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*(Запишите[^]*)$/,'</span><span class="ins">$1');
  s='<span class="lead">'+s+'</span>';
  s=s.replace(/<span class="[a-z]+">\s*<\/span>/g,'');
  return q?qImg(s,q):s;
}
function isP2(q){return q&&q.part===2}
function p2Label(q){return 'Задание '+(q.n||'')+' · часть 2'}
function p2Type(q){const b=parseInt(q.pts,10);return 'Развёрнутый ответ'+(b?' · '+b+' '+ru(b,'балл','балла','баллов'):'')}
/* картинка к заданию (диаграмма, график): q.img — путь, q.alt — что на ней для экранного диктора.
   Встаёт на место «[рисунок]» в тексте, а если метки нет — после текста */
function qImg(html,q){
  if(!q.img) return html;
  // по нажатию — в полный размер: на телефоне мелкие подписи диаграммы иначе не разобрать
  const tag=`<a class="qimg-a" href="${esc(q.img)}" target="_blank" rel="noopener" title="Открыть в полный размер"><img class="qimg" src="${esc(q.img)}" alt="${esc(q.alt||'Рисунок к заданию')}" loading="lazy"></a>`;
  return html.includes('[рисунок]') ? html.replace('[рисунок]',tag) : html+tag;
}
function fmtLong(t,q){
  const html=esc(t.replace(/\s*\d+\s*балл(?:а|ов)?\s*$/i,'').trim()).split(/\n\s*\n+/)
    .map(p=>'<p>'+p.trim().replace(/([.?!:;»)])[ \t]*\n\s*(?=[А-ЯЁA-Z0-9«(])/g,'$1<br>').replace(/\s*\n\s*/g,' ')+'</p>').join('');
  return q?qImg(html,q):html;
}
/* развёрнутые ответы ученика — хранятся в браузере для каждого теста */
/* черновик по названию ДЗ, не по номеру в tests.json: удаление или добавление тестов не перепутает черновики */
function ansKey(q){const t=tests.find(x=>x.name===curBase);const i=t?t.questions.indexOf(q):-1;return 'tr_ans_'+curBase+'_'+(i>=0?i:(q.n||''))}
function getAns(q){try{return localStorage.getItem(ansKey(q))||''}catch(e){return ''}}
function setAns(q,v){try{v?localStorage.setItem(ansKey(q),v):localStorage.removeItem(ansKey(q))}catch(e){}}
function countP1(qs){return qs.filter(q=>!isP2(q)).length}
function fmtExpl(t){
  let s=esc(t).replace(/\s+/g,' ').trim();
  const letterMode=(s.match(/[АБВГД][.)]/g)||[]).length>=3;
  if(letterMode){
    s=s.replace(/\s*([АБВГД][.)])\s*/g,'</div><div class="epoint">$1 ');
  }else{
    s=s.replace(/(^|[\s.;:»)\]])(\d{1,2}[.)])\s+/g,'$1</div><div class="epoint">$2 ');
  }
  s='<div class="epoint">'+s+'</div>';
  s=s.replace(/<div class="epoint">\s*<\/div>/g,'');
  return s;
}

/* ---- home / library ---- */
/* разделы главной: встроенные тесты по разделам кодификатора, свои — отдельно */
const SECTIONS=[

function groupTests(){
  const used=new Set(), out=[];
  SECTIONS.forEach(([title,names])=>{
    const list=names.map(n=>tests.find(t=>t.name===n)).filter(Boolean);
    list.forEach(t=>used.add(t.id));
    if(list.length) out.push([title,list]);
  });
  tests.filter(t=>t.custom).forEach(t=>{ used.add(t.id);
    let g=out.find(([title])=>title===t.folder); if(!g) out.push(g=[t.folder,[]]); g[1].push(t); });
  const rest=tests.filter(t=>!used.has(t.id));
  if(rest.length) out.push(['Другое',rest]);
  return out;
}

  el.open?o.add(k):o.delete(k);

}

/* ---- адреса экранов: у каждого экрана свой путь (mashavibe.ru/lessons, /schedule…) — работают «назад», обновление и ссылки ---- */
const BASE=location.hostname.endsWith('github.io')?'/trener/':'/';
let routing=false;   // пока открываем экран по адресу — адрес заменяем, а не добавляем в историю
function appPath(){ let p=location.pathname; if(p.startsWith(BASE)) p=p.slice(BASE.length); return p.replace(/^\/+|\/+$/g,''); }
function setUrl(p){ const full=BASE+p; if(location.pathname===full) return; history[routing?'replaceState':'pushState'](null,'',full); }
function route(p){ routing=true; try{ return dispatch(p==null?appPath():p); } finally{ routing=false; } }
function dispatch(p){
  const s=p.split('/'), a=s[0]||'', id=s[1]?decodeURIComponent(s[1]):'';
  return a ? cabRoute(a,id,s[2]||'',p) : home();
}

/* соответствие: ответ — ровно по числу букв задания */
function isMatching(q){ return qType(q.text)==='Соответствие'; }
function shakeInp(){ const i=$('#inp'); if(!i) return; i.classList.remove('wrong'); void i.offsetWidth; i.classList.add('wrong'); }
/* «запишите цифры» — порядок не важен (как на ЕГЭ); соответствие — важен */
function isRight(q,user){
  const a=norm(q.answer);
  return isMatching(q) ? user===a : [...user].sort().join('')===[...a].sort().join('');
}
const NUM_F=['','Одна','Две','Три','Четыре','Пять'], NUM_G=['','одной','двух','трёх','четырёх','пяти'];
/* «Почти»: совпало больше половины цифр ответа */
function almost(q,user){
  const a=norm(q.answer); if(!user) return null;
  if(isMatching(q)){
    let m=0; for(let i=0;i<a.length;i++) if(user[i]===a[i]) m++;
    const bad=a.length-m;
    return m>a.length/2 ? 'Почти. Не совпало позиций: '+bad : null;
  }
  const A=new Set(a), U=new Set(user);
  const common=[...A].filter(d=>U.has(d)).length, extra=[...U].filter(d=>!A.has(d)).length, miss=A.size-common;
  if(common<=A.size/2) return null;
  const parts=[];
  if(extra) parts.push(extra===1?'Одна цифра лишняя':(NUM_F[extra]||extra)+' цифры лишние');
  if(miss) parts.push((parts.length?(NUM_G[miss]||miss):(miss===1?'Одной':(NUM_G[miss]||miss).replace(/^./,c=>c.toUpperCase())))+' не хватает');
  return 'Почти'+(parts.length?'. '+parts.join(', '):'');
}
/* ответ части 1 сохраняется молча: верно/ошибка ученик увидит только после завершения ДЗ */
function saveP1(){
  const q=bank[idx], inp=$('#inp'), user=norm(inp.value);
  if(!user){ shakeInp(); toast('Введи ответ'); inp.focus(); return; }
  results[idx]={q,n:q.n,user,answer:norm(q.answer),ok:isRight(q,user)};
  score=results.filter(r=>r&&!r.p2&&r.ok).length;
  next();
}
/* разбор отправленной работы: поле только для чтения + вердикт словом и значком */
function showP1(r){

function renderP2(q){

function saveP2(){

  results[idx]={q,n:q.n,user:v,p2:true};
  bars();
  showP2(q);

function tog(b,on='Скрыть разбор',off='Показать разбор'){const e=b.nextElementSibling;e.classList.toggle('open');

/* ---- экран результата ---- */
/* «Где ошибки»: группировка по теме вопроса (q.topic — разметка разделов, этап 5a); без тем блок скрыт */
function whereErrors(wrongQs){
  const g={};
  wrongQs.forEach(q=>{ if(q.topic) g[q.topic]=(g[q.topic]||0)+1; });
  const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return '';
  return `<div class="rs-h">Где ошибки</div><div class="rs-where">${rows.map(([t,n])=>
    `<div class="rs-w"><span>${esc(t)}</span><b>${n} ош.</b></div>`).join('')}</div>`;
}
function resultSummary(correct,wrong,total){
  const p=total?Math.round(correct/total*100):0, undone=total-correct-wrong;
  return `
    <div class="rs">
      <div class="rs-kicker">Результат ДЗ</div>
      <div class="rs-name">${esc(curName)}</div>
      <div class="rs-big"><b>${correct}</b><span>из ${total}</span></div>
      <div class="rs-delta" id="rsdelta"></div>
      <div class="rs-tiles">
        <div class="rs-tile"><b>${correct}</b><span>верно</span></div>
        <div class="rs-tile"><b>${wrong}</b><span>${ru(wrong,'ошибка','ошибки','ошибок')}</span></div>
        <div class="rs-tile"><b>${p}%</b><span>результат</span></div>
      </div>
      ${undone>0?`<div class="resnote">Не решено: ${undone} из ${total}</div>`:''}
      ${whereErrors(lastWrong)}
    </div>`;
}
/* кнопки под результатом: одна главная — «Исправить N ошибок», если есть ошибки */
function resultActions(wrong,withAll){
  const p2n=bank.length-countP1(bank);
  return `
    ${wrong>0?`<button class="btn" id="fixbtn" onclick="startMistakes()">Исправить ${wrong} ${ru(wrong,'ошибку','ошибки','ошибок')}</button>`:''}
    <div id="sendbox"></div>
    ${p2n?`<div class="resnote">Часть 2 проверит учитель. Баллы появятся в профиле после проверки.</div>`:''}
    <div class="rs-links">
      <button class="linkbtn" onclick="openTest2()">Решать заново</button>
      ${window.bankSel?`<button class="linkbtn" onclick="navGo('bank')">К банку заданий</button>`:`<button class="linkbtn" onclick="goHW()">К ДЗ</button>`}
      ${withAll?`<button class="linkbtn" onclick="finishEarly()">Все задания с ответами</button>`:''}
    </div>`;
}
function afterResult(){
  renderSendBox();
  resultDelta();
  countUp();
}
/* большое число результата набегает от нуля — один «момент» экрана; без анимации при reduced-motion */
function countUp(){
  const b=document.querySelector('.rs-big b'); if(!b) return;
  const to=parseInt(b.textContent,10); if(!(to>0)) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0=performance.now(), dur=Math.min(900,300+to*40);
  b.style.minWidth=b.offsetWidth+'px';
  (function step(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4);
    b.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(step); })(t0);
}

/* full completion */
function finish(){
  idx=bank.length; bars(); $('#cur').textContent=bank.length;
  const total=countP1(bank), correct=score, wrong=results.filter(r=>!r.p2&&!r.ok).length;
  lastWrong=results.filter(r=>!r.p2&&!r.ok).map(r=>r.q);
  app.className='panel fade';
  app.innerHTML=`
    ${total?resultSummary(correct,wrong,total):`<div class="rs"><div class="rs-kicker">Результат ДЗ</div>
      <div class="rs-name">${esc(curName)}</div><p class="gsub">Ответы второй части сохранены.</p></div>`}
    ${resultActions(wrong,true)}`;
  afterResult();
}
/* restart current base test from scratch */
function openTest2(){ const t=tests.find(x=>x.name===curBase); if(t) bank=testBank(t); else if(window.bankSel) bank=bankSel.slice(); curName=curBase; begin(); }

/* early finish: chart + all questions + answers + explanation toggles */
function finishEarly(){
  $('#bars').style.display='none';
  const total=countP1(bank), correct=results.filter(r=>!r.p2&&r.ok).length, wrong=results.filter(r=>!r.p2&&!r.ok).length;
  lastWrong=results.filter(r=>!r.p2&&!r.ok).map(r=>r.q);
  app.className='panel fade';
  const open=answersOpen();
  const items=bank.map((q,i)=>isP2(q)?p2Item(q):`
    <div class="allitem">
      <div class="qhead">
        <span class="qnum">Задание ${esc(String(q.n||(i+1)))}</span>
        <span class="qtype">${qType(q.text)}</span>
      </div>
      <div class="qtext">${fmtQ(q.text,q)}</div>
      ${mineLine(results[i])}
      ${open?`<div class="aans">Правильный ответ:<b>${esc(q.answer)}</b></div>
      ${q.explanation?`<button class="etog" onclick="tog(this,'Скрыть пояснение','Пояснение')">Пояснение</button>
        <div class="expl"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}`:''}
    </div>`).join('');
  app.innerHTML=`
    ${total?resultSummary(correct,wrong,total):`<div class="rs"><div class="rs-kicker">Результат ДЗ</div><div class="rs-name">${esc(curName)}</div></div>`}
    ${resultActions(wrong,false)}
    <div class="review"><h3>Все задания с ответами</h3></div>
    ${open?'':`<div class="resnote" style="margin:-4px 0 12px;text-align:left">Правильные ответы и пояснения откроются после отправки работы учителю.</div>`}
    ${items}`;
  afterResult();
  window.scrollTo({top:0,behavior:'smooth'});
}
function mineLine(r){
  if(!r||!r.user) return `<div class="mine none">Твой ответ: нет ответа</div>`;
  return `<div class="mine ${r.ok?'ok':'bad'}">Твой ответ:<b>${esc(r.user)}</b><span>${r.ok?'✓ верно':'✕ ошибка'}</span></div>`;
}
function p2Item(q){
  const a=review?((results[bank.indexOf(q)]||{}).user||''):getAns(q);
  return `
    <div class="allitem">
      <div class="qhead">
        <span class="qnum">${esc(p2Label(q))}</span>
        <span class="qtype">${p2Type(q)}</span>
      </div>
      <div class="p2text">${fmtLong(q.text,q)}</div>
      <div class="uans-lab">Твой ответ</div>
      <div class="uans${a?'':' none'}">${a?esc(a):'Ответ не написан'}</div>
      ${review?reviewGrade(q):''}
      ${answersOpen()?`${q.answer?`<div class="uans-lab">Образец ответа</div><div class="uans">${esc(q.answer)}</div>`:''}
      ${q.explanation?`<button class="etog" onclick="tog(this,'Скрыть пояснение','Пояснение')">Пояснение</button>
        <div class="expl"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}`:''}
    </div>`;
}

loadTests().catch(()=>{});
/* главная рисуется сразу; другие адреса откроет cabinet.js, когда узнает, кто вошёл */
if(!appPath()) home(); else { app.className='panel'; app.innerHTML='<div class="cab-load">Загружаем…</div>'; }
</script>
<script src="cabinet.js"></script>
</body>
</html>
