тельному округу\n3) наличие предвыборной агитации\n4) возможность выдвижения независимых беспартийных кандидатов\n5) свободное и добровольное участие граждан в выборах\n6) преодоление партией 5%-ного избирательного порога (барьера)", "answer": "135", "explanation": "1. Да. Принцип тайного голосования сохраняется как основополагающий элемент демократических выборов, независимо от типа избирательной системы. Это обеспечивает защиту избирателей от давления и манипуляций.\n\n2. Нет. При переходе от пропорциональной системы к мажоритарной голосование больше не проводится по единому общенациональному избирательному округу. В мажоритарной системе создаются одномандатные округа, в которых избираются конкретные кандидаты.\n\n3. Да. Наличие предвыборной агитации остаётся неизменным, поскольку оно предусмотрено в рамках обеих систем. Политические партии и кандидаты продолжают представлять свои программы и привлекать избирателей.\n\n4. Нет. В мажоритарной системе кандидат может быть выдвинут без участия политической партии.\n\n5. Да. Свободное и добровольное участие граждан в выборах остаётся основным принципом. Это не зависит от типа избирательной системы, так как является ключевым элементом демократических выборов.\n\n6. Нет. Преодоление 5%-ного избирательного порога характерно для пропорциональной избирательной системы, где партии должны набрать определённый процент голосов для получения мест в парламенте. В мажоритарной системе такого порога нет."}, {"n": "41", "text": "В стране Z прошли парламентские выборы. Какие из приведённых фактов свидетельствуют о том, что выборы проходили по пропорциональной системе? Запишите цифры, под которыми они указаны.\n1) В выборах принимают участие независимые беспартийные кандидаты.\n2) Количество мест в парламенте, полученное партией, зависит от доли голосов избирателей.\n3) Граждане голосуют прежде всего за программу партии, а не за конкретных людей.\n4) Предусмотрено голосование по одномандатным округам.\n5) В парламент проходит кандидат, получивший большинство голосов на выборах.\n6) Чтобы пройти в парламент, партии необходимо преодолеть определённый избирательный барьер.\nРешение\n236\nПояснение:\n1. Нет. В пропорциональной системе выборы проходят по партийным спискам, а независимые кандидаты участвуют преимущественно в мажоритарной системе. \n2. Да. В пропорциональной системе количество мест, полученных партией, зависит от процента голосов, поданных за неё избирателями. \n3. Да. Граждане голосуют за партийные списки, исходя из программ партий, а не за отдельных кандидатов, как в мажоритарной системе. \n4. Нет. Голосование по одномандатным округам характерно для мажоритарной системы, тогда как в пропорциональной избирательный округ обычно является единым. \n5. Нет. Этот принцип соответствует мажоритарной системе, где победу получает кандидат, набравший большинство голосов. \n6. Да. В пропорциональной системе действует избирательный барьер — минимальный процент голосов, необходимый для прохождения партии в парламент.", "answer": "236", "explanation": "1. Нет. В пропорциональной системе выборы проходят по партийным спискам, а независимые кандидаты участвуют преимущественно в мажоритарной системе. \n\n2. Да. В пропорциональной системе количество мест, полученных партией, зависит от процента голосов, поданных за неё избирателями. \n\n3. Да. Граждане голосуют за партийные списки, исходя из программ партий, а не за отдельных кандидатов, как в мажоритарной системе. \n\n4. Нет. Голосование по одномандатным округам характерно для мажоритарной системы, тогда как в пропорциональной избирательный округ обычно является единым. \n\n5. Нет. Этот принцип соответствует мажоритарной системе, где победу получает кандидат, набравший большинство голосов. \n\n6. Да. В пропорциональной системе действует избирательный барьер — минимальный процент голосов, необходимый для прохождения партии в парламент."}, {"n": "42", "text": "Выберите верные суждения о выборах и избирательных системах в демократическом государстве и запишите цифры, под которыми они указаны.\n1) На выборах в представительные органы демократических государств применяется только мажоритарная избирательная система.\n2) Выборы в демократическом обществе предполагают равенство возможностей политических партий и кандидатов, добровольность участия в выборах.\n3) Мажоритарная избирательная система отражает реальную расстановку социально-политических сил в стране, в отличие от пропорциональной избирательной системы.\n4) При проведении выборов по пропорциональной системе депутатские мандаты распределяются между списками кандидатов в соответствии с процентами голосов, поданными за политические партии.\n5) При мажоритарной системе существует возможность выдвижения независимых беспартийных кандидатов.", "answer": "245", "explanation": "1. Нет. В демократических государствах могут использоваться как мажоритарная, так и пропорциональная избирательные системы, а также их смешанные формы. \n\n2. Да. Демократические выборы предполагают равенство возможностей для всех кандидатов и политических партий, а участие в голосовании является свободным и добровольным. \n\n3. Нет. Пропорциональная система более точно отражает расстановку политических сил, так как распределяет мандаты между партиями в зависимости от полученных голосов, тогда как мажоритарная система может приводить к тому, что значительная часть голосов избирателей остаётся непредставленной. \n\n4. Да. В пропорциональной системе мандаты распределяются между списками партий в зависимости от количества голосов, полученных на выборах. \n\n5. Да. В мажоритарной системе кандидаты могут участвовать в выборах без партийной принадлежности, что невозможно в пропорциональной системе."}, {"n": "43", "text": "В стране Z правительство формирует партия, победившая на парламентских выборах. Выберите в приведённом списке черты, свидетельствующие о том, что в стране Z выборы в парламент проходят по пропорциональной системе, и запишите цифры, под которыми эти черты указаны.\n1) Существует возможность выдвижения независимых беспартийных кандидатов.\n2) Количество мест, полученных партией в парламенте, зависит от процента голосов, полученных ею на выборах.\n3) Граждане голосуют за программы партий, а не за конкретных людей.\n4) Введено всеобщее, равное и прямое избирательное право.\n5) Победу одерживает кандидат, получивший большинство голосов на выборах.\n6) Голосование проводится по спискам политических партий.", "answer": "236", "explanation": "1. Нет. Возможность выдвижения независимых кандидатов характерна для мажоритарной системы, тогда как в пропорциональной системе голосование проводится за партийные списки. \n\n2. Да. В пропорциональной системе количество мест, полученных партией, зависит от процента голосов, поданных за неё избирателями. \n\n3. Да. Пропорциональная система предполагает голосование за партийные программы и списки кандидатов, а не за конкретных индивидуальных претендентов, как в мажоритарной системе. \n\n4. Нет. Всеобщее, равное и прямое избирательное право является признаком демократических выборов в целом, но не относится к конкретной избирательной системе. \n\n5. Нет. Этот принцип характерен для мажоритарной системы, в которой побеждает кандидат, набравший большинство голосов. \n\n6. Да. Пропорциональная избирательная система подразумевает голосование по спискам политических партий, что является её ключевой характеристикой."}, {"n": "44", "text": "В государстве Z была проведена реформа избирательной системы. Какие изменения в законодательстве о выборах свидетельствуют об утверждении пропорциональной избирательной системы? Запишите цифры, под которыми они указаны.\n1) распределение мест в парламенте в соответствии с количеством голосов, полученных партиями на выборах \n2) проведение голосования по спискам политических партий \n3) введение всеобщего, равного и прямого избирательного права \n4) введение 7%-ного избирательного барьера для политических партий\n5) голосование за политические программы, а не за конкретных депутатов\n6) отражение хода избирательной кампании в СМИ", "answer": "1245", "explanation": "1. Да. В пропорциональной избирательной системе места в парламенте распределяются в зависимости от количества голосов, полученных партиями на выборах.\n\n2. Да. Голосование по спискам политических партий является характерной чертой пропорциональной избирательной системы.\n\n3. Нет. Это требование является общим для демократических выборов и не связано напрямую с выбором избирательной системы.\n\n4. Да. Избирательный барьер (например, 7%) — это характерная черта пропорциональной избирательной системы, чтобы исключить слишком малые партии из распределения мест.\n\n5. Да. В пропорциональной системе граждане голосуют за политические программы партий, а не за отдельных кандидатов.\n\n6. Нет. Освещение избирательной кампании в СМИ — это требование для всех демократических выборов и не является специфической чертой пропорциональной избирательной системы."}, {"n": "45", "text": "Выберите верные суждения о политическом лидере и запишите цифры, под которыми они указаны.\n1) По отношению лидера к подчинённым различают харизматический и традиционный типы лидерства.\n2) Степень влияния лидеров, результативность их деятельности зависят только от характера среды, в которой они действуют.\n3) Политический лидер вырабатывает политический курс, отражающий реалии жизни общества.\n4) Политический лидер определяет способы решения политических задач.\n5) Харизматический лидер – это тот, кого в качестве такового признают в соответствии со сложившимся в обществе укладом политической жизни.", "answer": "34", "explanation": "1. Нет. По отношению лидера к подчинённым выделяют не харизматический и традиционный типы лидерства, а авторитарный, демократический и либеральный стили. Харизматический и традиционный типы лидерства относятся к классификации по способу легитимации власти. \n\n2. Нет. Степень влияния лидеров и результативность их деятельности зависят не только от характера среды, но и от личных качеств лидера, его способностей, опыта и поддержки со стороны общества. \n\n3. Да. Политический лидер вырабатывает политический курс, который должен учитывать реалии жизни общества, его потребности и интересы. \n\n4. Да. Политический лидер определяет способы решения политических задач, выбирая стратегии и методы, которые помогут достичь поставленных целей. \n\n5. Нет. Харизматический лидер — это тот, кто обладает особыми личными качествами, вызывающими доверие и восхищение у последователей. Традиционный лидер, напротив, признаётся таковым в соответствии с устоявшимися нормами и традициями."}, {"n": "46", "text": "Выберите верные суждения о политическом лидерстве и запишите цифры, под которыми они указаны.\n1) Понятие «лидерство» используется для характеристики как формально-должностного статуса и социальной позиции, так и личностных качеств и делового поведения человека.\n2) По способу легитимации лидерство подразделяется на республиканское и монархическое.\n3) По масштабам лидеры могут быть общенациональными, региональными и местными.\n4) Политические лидеры отвечают за производство и распределение материальных благ.\n5) Политический лидер объединяет вокруг себя своих сторонников.", "answer": "135", "explanation": "1. Да. Понятие «лидерство» может характеризовать как формально-должностной статус и социальную позицию, так и личностные качества и стиль поведения человека. \n\n2. Нет. По способу легитимации лидерство подразделяется на традиционное, харизматическое и рационально-легальное, а не на республиканское и монархическое (относится к форме правления). \n\n3. Да. По масштабам влияния политические лидеры могут быть общенациональными, региональными и местными. \n\n4. Нет. Политические лидеры не занимаются непосредственно производством и распределением материальных благ, их функции связаны с управлением и принятием политических решений. \n\n5. Да. Политический лидер объединяет вокруг себя своих сторонников, создавая систему политической поддержки."}, {"n": "47", "text": "Гражданин А. был избран губернатором области Z. Он уделяет большое внимание защите прав и свобод граждан, развитию институтов гражданского общества. В общении он доброжелателен, открыт для критики.\nЧто из перечисленного характеризует тип политического лидерства, описанный в данной ситуации? Запишите цифры, под которыми указаны верные характеристики.\n1) общенациональный\n2) демократический\n3) традиционный\n4) авторитарный\n5) региональный\n6) легальный (рационально-легальный)", "answer": "256", "explanation": "1. Нет. Лидер, описанный в задании, является губернатором области, что указывает на региональный характер его лидерства. Общенациональное лидерство относится к лидерам, занимающим позиции на уровне всей страны. \n\n2. Да. Демократическое лидерство предполагает уважение прав и свобод граждан, открытость для критики и развитие гражданского общества, что полностью соответствует описанию лидерства гражданина А. \n\n3. Нет. Традиционное лидерство связано с властью, основанной на обычаях и традициях.\n\n4. Нет. Авторитарное лидерство характеризуется концентрацией власти в руках одного человека, ограничением прав и свобод, а также подавлением критики, что не соответствует поведению гражданина А. \n\n5. Да. Гражданин А. является губернатором области, что означает, что его лидерство имеет региональный характер. \n\n6. Да. Легальный (рационально-легальный) тип лидерства подразумевает законность власти, её соблюдение в рамках закона, а также открытость к критике, что соответствует описанному поведению гражданина А."}, {"n": "48", "text": "Гражданин Н. был избран губернатором области Z. Он уделяет большое внимание защите прав и свобод граждан, развитию институтов гражданского общества. В общении он доброжелателен, открыт для критики.\nЧто из перечисленного характеризует тип политического лидерства, описанный в данной ситуации? Запишите цифры, под которыми указаны верные характеристики.\n1) интернациональный\n2) демократический\n3) харизматический\n4) авторитарный\n5) региональный\n6) легальный (рационально-легальный)", "answer": "256", "explanation": "1. Нет. Интернациональный лидерство подразумевает влияние на международные отношения и процессы, что не соответствует описанию регионального лидера в данной ситуации.\n\n2. Да. Демократическое лидерство предполагает уважение прав и свобод граждан, открытость для критики и развитие гражданского общества, что соответствует поведению гражданина Н.\n\n3. Нет. Харизматическое лидерство связано с личной харизмой и способностью лидера вдохновлять на основе личной привлекательности, а не с открытостью к критике и развитию гражданских прав.\n\n4. Нет. Авторитарное лидерство характеризуется централизованной властью, подавлением критики и ограничением свобод, что не соответствует описанию поведения гражданина Н.\n\n5. Да. Гражданин Н. является губернатором области, что означает региональный характер его лидерства.\n\n6. Да. Легальный (рационально-легальный) тип лидерства подразумевает уважение к правам граждан, открытую критику и деятельность в рамках закона, что соответствует описанному поведению гражданина Н."}, {"n": "49", "text": "Выберите верные суждения о средствах массовой информации (СМИ)\nи запишите цифры, под которыми они указаны.\n1) Под СМИ понимается периодическое печатное издание, сетевое издание, телеканал и иная форма распространения массовой информации под постоянным наименованием (названием).\n2) СМИ в любой ситуации позволяют людям адекватно оценивать информацию об актуальных политических событиях.\n3) СМИ традиционно относят к органам исполнительной власти.\n4) Мобилизационная функция СМИ выражается в побуждении людей к определённым политическим действиям.\n5) СМИ путём подачи определённой информации могут влиять на наше восприятие политических и государственных деятелей.", "answer": "145", "explanation": "1. Да. Под средствами массовой информации (СМИ) понимаются различные формы распространения информации, такие как печатные издания, телеканалы, интернет-ресурсы, которые имеют постоянное название или наименование.\n\n2. Нет. СМИ не всегда позволяют адекватно оценивать информацию, поскольку данные могут быть искажены, подвергнуты цензуре или манипулированию, что затрудняет формирование объективной картины происходящих событий.\n\n3. Нет. СМИ не относятся к органам исполнительной власти, их роль заключается в распространении информации и обеспечении свободы слова, а не в исполнении государственных функций.\n\n4. Да. Мобилизационная функция СМИ заключается в побуждении людей к действиям, таким как участие в выборах, митингах или других политических мероприятиях, часто с целью поддержки определённых политических инициатив или движений.\n\n5. Да. СМИ могут влиять на восприятие политических и государственных деятелей, формируя общественное мнение через подачу информации, акценты и репрезентацию отдельных фактов или личностей."}, {"n": "50", "text": "Выберите верные суждения о средствах массовой информации (СМИ) и запишите цифры, под которыми они указаны.\n1) СМИ - это периодическое печатное издание, сетевое издание, телеканал и иная форма распространения массовой информации под постоянным наименованием (названием).\n2) СМИ в любой ситуации позволяют людям адекватно оценивать информацию об актуальных политических событиях,\n3) СМИ традиционно относят к органам исполнительной власти.\n4) СМИ могут побуждать людей к политическим действиям.\n5) СМИ путём подачи определённой информации могут влиять на наше восприятие политических и государственных деятелей.", "answer": "145", "explanation": "1. Да. Средства массовой информации представляют собой различные формы регулярного распространения информации для неопределённого круга лиц, включая печатные и сетевые издания, а также телеканалы, действующие под постоянным названием.\n\n2. Нет. Информация, распространяемая СМИ, может быть интерпретирована, отобрана или подана с определённой точки зрения, что не всегда обеспечивает объективную и адекватную оценку политических событий.\n\n3. Нет. Средства массовой информации не относятся к органам исполнительной власти и не являются элементом государственного аппарата, хотя государство может участвовать в их регулировании или владении.\n\n4. Да. Через освещение событий, формирование повестки и оценочные суждения СМИ способны стимулировать политическую активность граждан, включая участие в выборах, митингах и общественных обсуждениях.\n\n5. Да. Способы подачи информации, выбор фактов и комментариев позволяют СМИ формировать общественное мнение и влиять на восприятие политических и государственных деятелей."}, {"n": "51", "text": "Работа над ошибками\nНиже приведён ряд терминов. Все они, за исключением двух, относятся\nк понятию «микроэкономика».\n1) Фирма; 2) локальный рынок; 3) фондовая биржа; 4) издержки; 5) бухгалтерская прибыль; 6) налоговая система страны.\nНайдите два термина, «выпадающих» из общего ряда и относящихся к другому понятию, и запишите в таблицу цифры, под которыми они указаны.", "answer": "36", "explanation": "1. Нет. Фирма — объект изучения микроэкономики, так как она анализируется на уровне отдельных хозяйствующих субъектов.\n\n2. Нет. Локальный рынок является микроэкономикой, так как отражает взаимодействие конкретных продавцов и покупателей.\n\n3. Да. Фондовая биржа относится к макроэкономике, поскольку является частью финансовой системы государства и влияет на экономику страны в целом.\n\n4. Нет. Издержки — это расходы фирмы на производство товаров и услуг, что делает их предметом микроэкономического анализа.\n\n5. Нет. Бухгалтерская прибыль — показатель эффективности деятельности отдельного предприятия, что также относится к сфере микроэкономики.\n\n6. Да. Налоговая система страны — элемент макроэкономики, так как она регулирует финансовые отношения на уровне государства и определяет общий объём налоговых поступлений в бюджет."}, {"n": "52", "text": "Работа над ошибками\nВыберите верные суждения о социальной мобильности и её видах и запишите цифры, под которыми они указаны.\n1) При помощи каналов социальной мобильности происходит перемещение людей по социальной лестнице.\n2) В результате горизонтальной мобильности индивиды всегда изменяют своё положение в стратификационной системе.\n3) Межпоколенная мобильность – сравнительное изменение социального статуса у представителей различных возрастных групп в отдельной семье.\n4) Социальная мобильность – это разделение общества на группы, занимающие разное положение в социальной иерархии.\n5) Организованной мобильностью называют управляемые государством перемещения человека и групп вверх, вниз и по горизонтали, с согласия людей или без него.", "answer": "135", "explanation": "1. Да. Каналы социальной мобильности (например, образование, армия, брак, профессиональная деятельность) обеспечивают движение людей вверх или вниз по социальной лестнице.\n\n2. Нет. При горизонтальной мобильности человек переходит в другую социальную группу с равным статусом, не изменяя своего положения в стратификационной системе.\n\n3. Да. Межпоколенная мобильность отражает различие в социальном положении между поколениями внутри одной семьи — например, если дети занимают более высокий статус, чем их родители.\n\n4. Нет. Разделение общества на группы по уровню дохода, власти, образования и престижа называется социальной стратификацией, а не мобильностью.\n\n5. Да. Организованная мобильность представляет собой управляемое государством или другими институтами перемещение людей по социальной структуре, которое может происходить как добровольно, так и принудительно."}]}, {"name": "Социология", "questions": [{"n": "1", "text": "Ниже приведен перечень терминов. Все они, за исключением двух, относятся к критериям социальной стратификации.\n1) психологические особенности индивида; 2) уровень дохода; 3) престиж профессии; 4) объем власти; 5) уровень образования; 6) тип музыкальных предпочтений.\nНайдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", "answer": "16", "explanation": "1. Да. Психологические особенности индивида - индивидуальные черты личности, такие как темперамент, характер и эмоциональные особенности \n\n2. Нет. Уровень дохода - количество денежных средств, которые человек или семья получают за определенный период времени \n\n3. Нет. Престиж профессии - общественная оценка значимости и уважения к определенной профессии \n\n4. Нет. Объем власти - степень влияния человека на принятие решений в социальных, политических или экономических сферах \n\n5. Нет. Уровень образования - мера освоения знаний, умений и компетенций, подтвержденная документами об образовании \n\n6. Да. Тип музыкальных предпочтений - личные вкусы человека в отношении музыкальных жанров и стилей"}, {"n": "2", "text": "Выберите верные суждения о социальных группах и их видах и запишите цифры, под которыми они указаны.\n1) Социальные группы – устойчивые совокупности людей, которые имеют отличные, только им присущие признаки (социальное положение, общие интересы, ценностные ориентиры).\n2) Принадлежность к различным социальным группам определяет положение человека в обществе.\n3) Демографические группы выделяют прежде всего по этносоциальному критерию. \n4) В формальной группе все межличностные взаимодействия основаны на эмоциях.\n5) Между социальными группами может существовать определенное неравенство с точки зрения их положения в социальной иерархии.", "answer": "125", "explanation": "1. Да. Дано определение.\n\n2. Да. Положение человека в обществе во многом определяется его принадлежностью к разным социальным группам — по профессии, возрасту, уровню образования.\n\n3. Нет. Демографические группы формируются по таким признакам, как возраст, пол, численность. Этносоциальный критерий используется для выделения этнических групп.\n\n4. Нет. В формальной группе взаимодействие строится на официальных нормах и ролях, а не на личных эмоциональных связях.\n\n5. Да. Социальные группы могут занимать разные позиции в иерархии общества, отличаться по статусу, престижу, уровню доступа к ресурсам."}, {"n": "3", "text": "Выберите верные суждения о социальных группах и запишите цифры, под которыми они указаны.\n1) К отличительным признакам малой группы относят непосредственное взаимодействие и воздействие друг на друга её членов\n2) Этнические общности образованы по демографическому принципу\n3) Социальной группой называют совокупность людей, имеющих какой-либо общий социально значимый признак\n4) Принадлежность к определённой социальной группе помогает человеку осознать своё положение в обществе\n5) В неформальной группе статус членов и цель деятельности всегда чётко определены", "answer": "134", "explanation": "1. Да. Малая группа характеризуется непосредственными личными контактами, устойчивыми эмоциональными связями и взаимодействием между всеми её членами.\n\n2. Нет. Этнические общности формируются на основе культурных признаков: языка, традиций, обычаев, а не только по демографическому принципу. По демографическому — половозрастные.\n\n3. Да. Социальная группа — это совокупность людей, объединённых общим социально значимым признаком: профессией, полом, возрастом, интересами и др.\n\n4. Да. Принадлежность к социальной группе помогает человеку определить своё место в социальной структуре и формирует социальную идентичность.\n\n5. Нет. В неформальных группах цели и статус участников, как правило, не фиксированы жёстко и формируются спонтанно на основе личных отношений."}, {"n": "4", "text": "Выберите верные суждения о социальной стратификации и запишите цифры, под которыми они указаны.\n1) Понятие «социальная стратификация» обозначает систему признаков и критериев социального расслоения.\n2) Деление общества на страты допускает наличие привилегий у представителей некоторых страт.\n3) К критериям социальной стратификации относят объем власти.\n4) Одним из критериев социальной стратификации являются индивидуальные психологические черты человека.\n5) Ученые выделяют два вида социальной стратификации: прогрессивную и регрессивную.", "answer": "123", "explanation": "1. Да. Социальная стратификация понимается как система признаков и критериев, по которым происходит социальное расслоение общества. Такими критериями выступают доход, уровень образования, объём власти, престиж профессии.\n\n2. Да. Деление общества на страты предполагает неравный доступ к благам: одним доступны качественное образование, престижная работа, медицинское обслуживание, а другим эти блага ограничены или недоступны вовсе.\n\n3. Да. Власть является одним из критериев стратификации, так как определяет способность группы влиять на общественные процессы наряду с доходом, престижем и уровнем образования.\n\n4. Нет. Индивидуальные психологические особенности не учитываются при стратификации, потому что она описывает различия социальных групп, а не личные качества отдельных людей.\n\n5. Нет. В социологии выделяют рабство, касты, сословия и классы как основные формы социальной стратификации. Деление на «прогрессивную» и «регрессивную» в науке отсутствует."}, {"n": "5", "text": "После окончания института однокурсники зарегистрировали свой бизнес в установленном законом порядке. Они арендовали помещение, открыли кафе домашнего питания, заключили трудовые договоры с пятью работниками. Как можно охарактеризовать работников кафе? Запишите цифры, под которыми указаны соответствующие характеристики.\n1) малая группа\n2) территориальная группа\n3) этническая группа\n4) профессиональная группа\n5) большая группа\n6) формальная группа", "answer": "146", "explanation": "1. Да. Работники кафе могут быть охарактеризованы как малая группа, так как они ограничены в численности (пять человек), имеют непосредственное общение и взаимодействие в процессе работы.\n\n2. Нет. Территориальная группа объединяется общим местом проживания или нахождения. В данном случае признак территориального единства не указан и не является определяющим для работников кафе.\n\n3. Нет. Этническая группа объединяется общностью происхождения, языка, культуры, традиций. В условии задачи информация о принадлежности работников к одной этнической группе отсутствует, поэтому это характеристика не подходит.\n\n4. Да. Работники кафе выполняют определённые трудовые функции в сфере общественного питания, то есть имеют общую профессиональную деятельность, что позволяет отнести их к профессиональной группе.\n\n5. Нет. Большая группа — это совокупность людей, связанных общими интересами или признаками, но не имеющих личных контактов между собой. Работники кафе образуют небольшой коллектив, где возможно личное общение, поэтому эта характеристика не подходит.\n\n6. Да. Работники кафе действуют в рамках трудовых договоров, соблюдают установленные правила и регламенты, что соответствует характеристике формальной группы."}, {"n": "6", "text": "Выберите верные суждения о социальных группах и запишите цифры, под которыми они указаны.\n1) К признакам большой социальной группы относят наличие прямых личных контактов между всеми членами группы.\n2) В формальной группе межличностные взаимодействия всегда основаны на взаимной симпатии, общем интересе или общей привычке.\n3) Русские, чеченцы, татары – социальные группы, выделяемые по социально-этническому признаку.\n4) Принадлежность к различным социальным группам определяет положение человека в обществе.\n5) Взаимодействие индивидов в первичных социальных группах имеет эпизодический характер.", "answer": "34", "explanation": "1. Нет. У большой социальной группы отсутствуют прямые личные контакты между всеми её членами из-за большой численности. Это является признаком малой группы.\n\n2. Нет. В формальной группе межличностные взаимодействия регулируются официальными правилами, нормами и обязанностями, а не основаны на симпатии, общем интересе или привычке. Это характерно для неформальных групп.\n\n3. Да. Русские, чеченцы, татары — это социальные группы, выделяемые по этническому признаку, который включает общность происхождения, языка, культуры и самосознания.\n\n4. Да. Принадлежность человека к различным социальным группам (по профессии, доходу, образованию, этнической принадлежности и др.) влияет на его положение в обществе.\n\n5. Нет. Взаимодействие индивидов в первичных социальных группах имеет устойчивый, постоянный характер, основанный на близких, личных отношениях, а не эпизодический."}, {"n": "7", "text": "Выберите верные суждения о социальных группах и запишите цифры, под которыми они указаны.\n1) Социальной группой называется совокупность людей, объединяемая устойчивыми социальными связями и отношениями и обладающая рядом признаков, придающих ей неповторимое своеобразие.\n2) Калмыки, башкиры, буряты – социальные группы, выделяемые по социально-демографическому признаку.\n3) В неформальной группе межличностные взаимодействия основаны на взаимной симпатии, общем интересе или общей привычке.\n4) Принадлежность к различным социальным группам определяет положение человека в обществе.\n5) Взаимодействие индивидов в первичных социальных группах имеет исключительно формальный характер.", "answer": "134", "explanation": "1. Да. Социальная группа объединяет людей через устойчивые социальные связи и общие признаки, что обеспечивает её целостность.\n\n2. Нет. Калмыки, башкиры, буряты относятся к этническим группам, которые выделяются по национальному признаку.\n\n3. Да. Взаимодействие в неформальных группах строится на межличностной симпатии и общих интересах.\n\n4. Да. Принадлежность человека к разным группам формирует его социальные статусы и положение в обществе.\n\n5. Нет. Первичные группы характеризуются личным и доверительным общением между их участниками."}, {"n": "8", "text": "Выберите верные суждения о социальной стратификации и социальной мобильности и запишите цифры, под которыми они указаны.\n1) Горизонтальная социальная мобильность всегда имеет групповой характер.\n2) Различают восходящую и нисходящую вертикальную мобильность.\n3) Одним из критериев социальной стратификации общества выступает объём власти.\n4) Вертикальная мобильность обозначает переход индивида в социальную группу с \nравным статусом.\n5) К критериям выделения социальных страт относят уровень доходов.", "answer": "235", "explanation": "1. Нет. Горизонтальная социальная мобильность может быть не только групповой, но и индивидуальной. Это означает переход индивида или группы в другую социальную группу с равным статусом (например, смена профессии без изменения социального уровня).\n\n2. Да. Вертикальная мобильность бывает восходящей (повышение социального статуса) и нисходящей (понижение статуса).\n\n3. Да. Объём власти является одним из критериев социальной стратификации, наряду с доходом, престижем, образованием.\n\n4. Нет. Вертикальная мобильность обозначает переход индивида в социальную группу с другим статусом — выше или ниже по социальной лестнице, а не с равным статусом.\n\n5. Да. Уровень доходов выступает важным критерием при выделении социальных страт (например, деление на богатых, средний класс и бедных)."}, {"n": "9", "text": "Выберите верные суждения о социальной стратификации и социальной мобильности и запишите цифры, под которыми они указаны.\n1) Социальная мобильность – это деление общества на социальные слои и группы.\n2) Различают восходящую и нисходящую вертикальную мобильность.\n3) Повышение социального статуса человека или социальной группы –\nэто пример восходящей мобильности.\n4) Одним из критериев социальной стратификации общества выступает престиж профессии.\n5) Большие социальные группы дифференцируются по индивидуально-психологическим особенностям личности.", "answer": "234", "explanation": "1. Нет. Социальная мобильность – это процесс перемещения людей или групп между различными социальными статусами или слоями. Деление общества на социальные группы называется социальной стратификацией.\n\n2. Да. Различают восходящую и нисходящую вертикальную мобильность. Восходящая мобильность связана с повышением социального статуса, а нисходящая — с его понижением.\n\n3. Да. Повышение социального статуса человека или социальной группы является примером восходящей мобильности, когда индивид или группа продвигаются вверх по социальной лестнице, например, благодаря образованию или профессиональному успеху.\n\n4. Да. Престиж профессии — один из критериев социальной стратификации. Различные профессии оцениваются обществом по степени их уважения и важности, что влияет на положение человека в социальной структуре.\n\n5. Нет. Большие социальные группы не дифференцируются по индивидуально-психологическим особенностям личности. Социальная стратификация основана на экономических, социальных и культурных различиях, таких как доход, власть, образование и престиж. Индивидуально-психологические особенности могут влиять на личный успех, но они не являются критерием стратификации."}, {"n": "10", "text": "Выберите верные суждения о социальной стратификации и социальной мобильности и запишите цифры, под которыми они указаны.\n1) Горизонтальная социальная мобильность всегда имеет индивидуальный характер.\n2) Различают восходящую и нисходящую вертикальную мобильность.\n3) Одним из критериев социальной стратификации общества выступает объём власти.\n4) Горизонтальная мобильность обозначает переход индивида в социальную группу с равным статусом.\n5) Социальные группы дифференцируются по типу темперамента индивидов.", "answer": "234", "explanation": "1. Нет. Горизонтальная социальная мобильность может быть как индивидуальной, так и групповой, например, при переселении целого коллектива или сообщества (например, затопило село — местные переехали в соседнее).\n\n2. Да. Вертикальная мобильность бывает восходящей — при повышении социального статуса, и нисходящей — при его понижении.\n\n3. Да. Власть является одним из основных критериев социальной стратификации наряду с доходом, образованием и престижем профессии.\n\n4. Да. Горизонтальная мобильность означает переход человека из одной социальной группы в другую с равным социальным статусом, например, смену работы на аналогичную должность, но в другом месте (фирме).\n\n5. Нет. Тип темперамента не является критерием социальной стратификации, так как она основывается на социально-экономических показателях, а не на личностных особенностях."}, {"n": "11", "text": "Выберите верные суждения о социальной стратификации и социальной мобильности и запишите цифры, под которыми они указаны.\n1) Личные качества человека выступают критерием социальной стратификации современного общества.\n2) Одним из критериев социальной стратификации общества выступает объём власти.\n3) Социологи различают индивидуальную и групповую (коллективную) мобильность.\n4) Горизонтальная мобильность предполагает переход в социальную группу, находящуюся на другой ступени социальной иерархии.\n5) Один из критериев дифференциации социальных групп – уровень доходов.", "answer": "235", "explanation": "1. Нет. Личные качества человека (например, доброта, честность, коммуникабельность) не являются критерием социальной стратификации, так как она основана на объективных показателях — доходе, власти, образовании и престиже.\n\n2. Да. Объём власти — один из основных критериев социальной стратификации, наряду с уровнем доходов, образованием и престижем профессии.\n\n3. Да. Социологи выделяют индивидуальную мобильность, когда перемещается отдельный человек, и групповую, когда изменения затрагивают целую социальную общность (например, переселение).\n\n4. Нет. Горизонтальная мобильность не связана с переходом на другую ступень социальной иерархии (это относится к вертикальной) — она предполагает перемещение в пределах одного социального слоя, например смену места работы без изменения статуса.\n\n5. Да. Уровень доходов является важнейшим критерием дифференциации социальных групп и показателем социально-экономического неравенства в обществе."}, {"n": "12", "text": "Выберите верные суждения о социальной стратификации и социальной мобильности и запишите цифры, под которыми они указаны.\n1) Социальная стратификация предполагает неравенство в доходах, власти, престиже профессии и образовании.\n2) Социальная мобильность - совокупность социальных статусов и ролей людей в обществе, расположенных в иерархическом порядке.\n3) Горизонтальная мобильность - переход индивида из одной социальной группы в другую, расположенную на том же уровне.\n4) Вертикальная мобильность относится к ситуации, когда один и тот же индивид на протяжении жизни несколько раз меняет свои социальные позиции в отличие от своих родителей.\n5) В состав среднего класса входят люди, имеющие невысокие доходы, средние и мелкие предприниматели, а также топ-менеджеры крупных компаний.", "answer": "13", "explanation": "1. Да. Социальная стратификация отражает неравенство в доходах, уровне власти, образовании и престиже профессии, то есть по ключевым критериям, определяющим положение в обществе.\n\n2. Нет. Социальная мобильность связана с перемещением людей или групп в социальной структуре общества, а совокупность статусов и ролей в иерархии описывает именно социальную стратификацию.\n\n3. Да. Горизонтальная мобильность означает перемещение на том же социальном уровне, например переход на работу в другую фирму без изменения должности.\n\n4. Нет. Описанное относится к внутрипоколенной мобильности, когда индивид в течение своей жизни меняет статус. Вертикальная мобильность связана с движением вверх или вниз по социальной лестнице.\n\n5. Нет. Средний класс составляют мелкие предприниматели, менеджеры среднего звена, квалифицированные специалисты и другие группы с устойчивым средним, но не высоким доходом. Топ-менеджеры крупных компаний относятся к высшему классу. В целом, ученные до сих пор не пришли к единому определению \"средний класс\"."}, {"n": "13", "text": "Выберите верные суждения о социальной стратификации и социальной\nмобильности и запишите цифры, под которыми они указаны.\n1) Социологи различают внутрипоколенную и межпоколенную мобильность.\n2) Одним из критериев социальной стратификации общества служит престиж профессии.\n3) Личные качества человека выступают критерием социальной стратификации современного общества.\n4) Любой вид мобильности сопровождается перемещением по социальной лестнице вверх или вниз.\n5) Один из критериев дифференциации социальных групп – уровень образования.", "answer": "125", "explanation": "1. Да. Социальная мобильность может происходить в пределах жизненного пути одного поколения или выражаться в изменении социального положения детей по сравнению с родителями. \n\n2. Да. Престиж профессии отражает общественную оценку социального статуса и значимости труда. \n\n3. Нет. Социальная стратификация основывается на объективных социальных показателях, таких как доход, образование, власть и престиж. Индивидуальные личные качества не применяются в качестве критерия стратификации.\n\n4. Нет. Перемещение вверх или вниз по социальной иерархии характерно для вертикальной мобильности. Горизонтальная мобильность предполагает смену статуса без изменения социального уровня (например, переезд в другой город при сохранении профессии, уровня образования и дохода).\n\n5. Да. Уровень образования влияет на жизненный успех и социальный статус индивида."}, {"n": "14", "text": "Выберите верные суждения о социальной стратификации и социальной мобильности. Запишите цифры, под которыми они указаны.\n1) При индивидуальной мобильности перемещение по горизонтали или вертикали происходит у каждого человека независимо от других людей.2) Социальная стратификация – это расслоение и иерархическая организация различных слоев общества.\n3) Внутрипоколенная мобильность – изменение статуса в рамках одного поколения.\n4) По сравнению с классовой структурой социальная стратификация выделяет меньшее количество слоев.\n5) Принадлежность к имущественному, властному или профессиональному слою игнорируется при ранжировании людей по степени престижа в обществе.", "answer": "123", "explanation": "1. Да. Индивидуальная мобильность отражает личные перемещения человека в социальной структуре, которые не зависят от статуса других людей, например повышение по службе одного сотрудника.\n\n2. Да. Социальная стратификация — это расслоение общества на страты, расположенные в иерархическом порядке, по таким критериям, как доход, власть, образование, престиж профессии.\n\n3. Да. Внутрипоколенная мобильность проявляется тогда, когда человек изменяет свой социальный статус в течение жизни, например рабочий становится предпринимателем.\n\n4. Нет. Классовая структура — это разновидность стратификации. Социальная стратификация как более широкое понятие учитывает больше критериев и слоёв, чем деление только на классы.\n\n5. Нет. При определении престижа учитывается принадлежность к имущественному, властному и профессиональному слоям, так как именно эти критерии формируют представления о статусе человека."}, {"n": "15", "text": "Выберите верные суждения о социальной стратификации и запишите цифры, под которыми они указаны.\n1) В основу деления общества на страты положены доход, профессия, образование. \n2) Одним из критериев социальной стратификации являются индивидуально-психологические особенности индивида.\n3) Социальная стратификация отражает строение общества.\n4) Изменение социального статуса индивида в процессе вертикальной мобильности называют социальной стратификацией.\n5) Стратификационная структура общества отражает социальное неравенство людей.", "answer": "135", "explanation": "1. Да. Основными критериями социальной стратификации являются уровень дохода, престиж профессии, уровень образования и объём власти.\n\n2. Нет. Индивидуально-психологические особенности человека (темперамент, характер, способности) не относятся к критериям социальной стратификации.\n\n3. Да. Социальная стратификация показывает строение общества, его внутреннюю организацию и распределение людей по социальным слоям.\n\n4. Нет. Изменение социального статуса индивида называется социальной мобильностью.\n\n5. Да. Социальная стратификация отражает существующее в обществе социальное неравенство, выражающееся в различии доступа людей к власти, богатству, престижу и образованию."}, {"n": "16", "text": "Ниже приведен перечень терминов. Все они, за исключением двух, относятся к понятию «гуманистическая национальная политика».\n1) сближение наций; 2) пропаганда этнической исключительности; 3) культурная самобытность; 4) сохранение родного языка; 5) привилегии отдельным этническим группам; 6) толерантность.\nНайдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", "answer": "25", "explanation": "1. Нет. Сближение наций способствует укреплению межнационального согласия и относится к гуманистической национальной политике.\n\n2. Да. Пропаганда этнической исключительности противоречит принципам гуманистической национальной политики.\n\n3. Нет. Культурная самобытность предполагает уважение к традициям и культуре разных народов и отражает гуманистический подход.\n\n4. Нет. Сохранение родного языка является частью гуманистической национальной политики, направленной на развитие культурного многообразия.\n\n5. Да. Привилегии отдельным этническим группам нарушают принцип равноправия народов.\n\n6. Нет. Толерантность отражает уважительное отношение к представителям других национальностей и культур и является одним из принципов гуманистической национальной политики."}, {"n": "17", "text": "Выберите верные суждения об этносоциальных общностях и межнациональных отношениях. Запишите цифры, под которыми они указаны.\n1) В современном мире существуют только военные формы этнической ассимиляции.\n2) Этническая общность – это исторически сложившаяся на определённой территории устойчивая совокупность людей, которая обладает общими чертами и особенностями культуры, языка, самосознания.\n3) Племя, народность, нация – этносоциальные общности.\n4) Межнациональные отношения включают в себя только отношения между людьми различных национальностей, которые являются гражданами разных государств.\n5) К гуманистическим принципам политики в области межнациональных отношений относят готовность к мирному урегулированию спорных проблем.", "answer": "235", "explanation": "1. Нет. Этническая ассимиляция может происходить разными способами — не только силой, но и естественным путём. Например, представители малочисленного народа могут постепенно перенимать язык и культурные традиции более многочисленного этноса, сохраняя при этом мирные отношения.\n\n2. Да. Этническая общность — это исторически сложившаяся группа людей, объединённая общими элементами культуры, языка, традиций и самосознания. Например, русские, татары, якуты — этносы, сформировавшиеся на своих территориях с особыми культурными чертами и историей.\n\n3. Да. Племя, народность и нация — формы этносоциальных общностей, которые различаются степенью сплочённости и уровнем общественного развития. Так, племена существовали на ранних этапах истории, народности появились позже, а нации формируются в эпоху становления государств.\n\n4. Нет. Межнациональные отношения существуют не только между гражданами разных государств, но и внутри одного общества. Например, в России живут десятки народов, и отношения между ними — это тоже межнациональные отношения.\n\n5. Да. Гуманистическая национальная политика основана на стремлении к мирному решению конфликтов и уважении культурных различий. Например, проведение межнациональных форумов, поддержка языков народов России, праздники дружбы народов — всё это формы мирного взаимодействия этносов."}, {"n": "18", "text": "Выберите верные суждения о межнациональных отношениях и запишите цифры, под которыми они указаны.\n1) Межнациональные отношения могут проявляться в форме сотрудничества или конфликта.\n2) Одним из способов предотвращения межнациональных конфликтов в демократическом обществе является соблюдение прав и свобод каждой народности и нации.\n3) Этнической ассимиляцией называют конфликт между представителями разных наций и народностей.\n4) Этническое смешивание подразумевает обособление этнических групп под воздействием фактора силы.\n5) Межнациональная интеграция – это процесс постепенного объединения и углубления взаимодействия между различными этносами, народами и нациями.", "answer": "125", "explanation": "1. Да. Межнациональные отношения могут складываться как в форме сотрудничества — культурного обмена, совместных проектов, так и в форме конфликта, когда интересы и ценности разных народов противоречат друг другу.\n\n2. Да. В демократическом обществе предотвращение межнациональных конфликтов достигается через обеспечение равных прав и свобод для всех народов, как это закреплено, например, в Конституции РФ.\n\n3. Нет. Этническая ассимиляция — это процесс постепенного слияния одного народа с другим, при котором один из них утрачивает свои национальные особенности.\n\n4. Нет. Этническое смешивание предполагает взаимодействие и взаимопроникновение культур.\n\n5. Да. Межнациональная интеграция выражается в сотрудничестве и сближении народов, например, в создании межгосударственных союзов или развитии единого культурного пространства."}, {"n": "19", "text": "Выберите верные суждения об этнических общностях и запишите цифры, под которыми они указаны.\n1) К числу признаков этноса относят язык, общую историческую память, обычаи и традиции.\n2) Этнической общностью называют сложившуюся в определённом государстве демографическую группу.\n3) Видами этнических общностей являются племя, народность, нация.\n4) Члены любой этнической общности обладают сходными политическими воззрениями и толерантным отношением к культуре других этносов.\n5) При формировании этноса значительную роль играет общность территории и общий язык.", "answer": "135", "explanation": "1. Да. К признакам этноса относятся язык, историческая память, обычаи и традиции, которые обеспечивают культурное и духовное единство народа.\n\n2. Нет. Этническая общность — это исторически сложившаяся на определённой территории совокупность людей, объединённых общими чертами культуры, языка и самосознания, а не просто демографическая группа.\n\n3. Да. Племя, народность и нация — это основные виды этнических общностей, различающиеся по уровню развития и характеру связей между людьми.\n\n4. Нет. Этническая общность объединяет людей культурой, языком и традициями, но политические взгляды её членов могут быть различными.\n\n5. Да. Общность территории и языка способствует формированию этноса, обеспечивая условия для общения и совместной деятельности людей."}, {"n": "20", "text": "Выберите верные суждения об этнических общностях и запишите цифры, под которыми они указаны.\n1) Этническая общность – это исторически сложившаяся на определённой территории устойчивая совокупность людей, которая связана общностью языка, культуры, психологического склада и мировосприятия.\n2) Интегративным показателем сформировавшейся этнической общности выступает этническое самосознание.\n3) Доход, образование – факторы, влияющие на формирование этнических групп.\n4) К естественным предпосылкам складывания того или иного этноса относят общность территории.\n5) Одной из предпосылок формирования этнических общностей является переход к постиндустриальному обществу.", "answer": "124", "explanation": "1. Да. Дано определение.\n\n2. Да. Этническое самосознание отражает осознание людьми своей принадлежности к определённому народу и служит показателем сформировавшейся этнической общности.\n\n3. Нет. Доход и образование относятся к социально-экономическим признакам, но не влияют на формирование этнических групп.\n\n4. Да. Общность территории создаёт условия для взаимодействия людей и является естественной предпосылкой формирования этноса.\n\n5. Нет. Переход к постиндустриальному обществу — современный социально-экономический процесс, не связанный с происхождением этнических общностей."}, {"n": "21", "text": "Выберите верные суждения об этнических общностях и межнациональных отношениях. Запишите цифры, под которыми они указаны.\n1) К наиболее древним этническим общностям относятся народности.\n2) Межнациональные отношения формируются только между этническими группами в границах одной страны.\n3) Межнациональная дифференциация подразумевает сближение народов, укрепление связей между ними, взаимовлияние и взаимообогащение культур разных этносов.\n4) В Российской Федерации каждый вправе определять и самостоятельно указывать свою национальную принадлежность.\n5) Этнические группы можно определить как группы людей, имеющих общее происхождение и некоторые культурные, языковые, религиозные особенности и осознающих свою принадлежность к общей группе.", "answer": "45", "explanation": "1. Нет. К наиболее древним этническим общностям относятся племена, а народности сформировались на более позднем этапе исторического развития.\n\n2. Нет. Межнациональные отношения существуют как внутри одного государства, так и между народами разных стран.\n\n3. Нет. Описанные признаки характерны для межнациональной интеграции, а не для дифференциации, которая связана с обособлением народов.\n\n4. Да. Конституция Российской Федерации закрепляет право человека самостоятельно определять и указывать свою национальную принадлежность.\n\n5. Да. Этнические группы объединяют людей, связанных общим происхождением, культурой, языком, религией и осознанием принадлежности к единой общности."}, {"n": "22", "text": "Выберите верные суждения об этносоциальных общностях и межнациональных отношениях. Запишите цифры, под которыми они указаны. \n1) Межнациональные отношения включают в себя только отношения между людьми различных национальностей, которые являются гражданами разных государств.\n2) К гуманистическим принципам политики в области межнациональных отношений относят готовность к мирному урегулированию спорных проблем.\n3) В современном мире существуют только военные формы этнической ассимиляции.\n4) Племя, народность, нация – этносоциальные общности.\n5) Этническая общность – это исторически сложившаяся на определенной территории устойчива совокупность людей, которая обладает общими чертами и особенностями культуры, языка, самосознания.", "answer": "245", "explanation": "1. Нет. Межнациональные отношения складываются как между гражданами разных государств, так и между народами, проживающими в пределах одного государства.\n\n2. Да. Готовность к мирному урегулированию противоречий является одним из гуманистических принципов политики в сфере межнациональных отношений.\n\n3. Нет. Этническая ассимиляция может происходить в культурной, языковой, социальной формах, без применения военных методов.\n\n4. Да. Племя, народность и нация являются видами этносоциальных общностей, различающихся уровнем развития и формой организации.\n\n5. Да. Дано определение."}, {"n": "23", "text": "Выберите верные суждения об этнических группах и межнациональных отношениях и запишите цифры, под которыми они указаны.\n1) Один из способов предотвращения межнациональных конфликтов в демократическом обществе – компактное расселение людей одной национальности в пределах многонационального государства.\n2) Племена, народности, нации являются этническими общностями.\n3) Одним из способов гармонизации межнациональных отношений является развитие культурных связей между народами.\n4) Все этнические общности обязательно имеют свою государственность.\n5) Один из способов предотвращения межнациональных конфликтов в демократическом обществе – обеспечение прав и свобод всех граждан независимо от их национальной принадлежности.", "answer": "235", "explanation": "1. Нет. Компактное расселение людей одной национальности в пределах многонационального государства может привести к обособлению этнических групп и росту напряжённости между ними.\n\n2. Да. Племена, народности и нации представляют собой исторические формы существования этнических общностей, отличающихся уровнем развития и степенью сплочённости.\n\n3. Да. Развитие культурных связей между народами способствует взаимопониманию, обмену духовными ценностями и укреплению доверия, что помогает поддерживать гармоничные межнациональные отношения.\n\n4. Нет. Не все этнические общности обладают своей государственной организацией, многие народы входят в состав многонациональных государств.\n\n5. Да. Обеспечение прав и свобод всех граждан независимо от их национальной принадлежности способствует равенству и предотвращает появление этнической дискриминации."}, {"n": "24", "text": "Выберите верные суждения о молодёжи как социальной группе и запишите цифры, под которыми они указаны.\n1) Одним из главных критериев выделения молодёжи в социально-демографическую группу является совокупность возрастных характеристик.\n2) Социальное положение молодёжи отличается стабильностью и консерватизмом.\n3) Представителей молодёжи отличает необходимость решать схожие проблемы, связанные с выбором профессии, выработка жизненных ценностей, формирование социально ответственного поведения.\n4) Культура молодёжи всегда идентична той господствующей культуре, которая на данный исторический момент существует в обществе.\n5) Для представителей молодёжи типично создание различных неформальных групп.", "answer": "135", "explanation": "1. Да. Молодёжь (как социальная группа) выделяется по главному критерию - возрасту.\n\n2. Нет. Социальное положение молодежи отличается динамичностью и изменчивостью, так как они проходят через период становления и социализации.\n\n3. Да. Представителей молодежи только вступают на жизненный путь, поэтому они не только изучают мир, но и пытаются понять (выбрать) стиль жизни, профессию и т.д.\n\n4. Нет. Культура молодежи может проявлять свою уникальность и отличаться от господствующей культуры в обществе. \n\n5. Да. Молодёжь испытывает повышенное желание признания, стать “своим”. Поэтому часто создают различные группы или вступают в них."}, {"n": "25", "text": "Выберите верные суждения о социальной мобильности и запишите цифры, под которыми они указаны.\n1) Межпоколенная мобильность – сравнительное изменение социального статуса у различных поколений.\n2) Организованной мобильностью называют управляемые государством перемещения человека или целых групп вверх, вниз или по горизонтали: с согласия самих людей, или без их согласия.\n3) К горизонтальному виду мобильности относится получение внеочередного воинского звания.\n4) К вертикальному виду мобильности относится переход человека в более низкий социальный слой.\n5) Социальная мобильность – это разделение общества на группы, занимающие разное положение.", "answer": "124", "explanation": "1. Да. Межпоколенная мобильность означает, что у детей социальный статус отличается от статуса родителей, например ребёнок рабочего становится предпринимателем.\n\n2. Да. Организованная мобильность связана с управлением перемещениями людей государством: это может быть переселение, призыв в армию или распределение выпускников вузов.\n\n3. Нет. Получение воинского звания связано с изменением социального статуса вверх, то есть является примером вертикальной мобильности.\n\n4. Да. Вертикальная мобильность включает движение как вверх, так и вниз. Например, разорившийся предприниматель может перейти в более низкий социальный слой.\n\n5. Нет. Социальная мобильность — это перемещение индивидов или групп в социальной структуре общества, а разделение общества на группы называется социальной стратификацией."}, {"n": "26", "text": "Выберите верные суждения о социальной мобильности и её видах и запишите цифры, под которыми они указаны.\n1) При помощи каналов социальной мобильности происходит перемещение людей по социальной лестнице.\n2) В результате горизонтальной мобильности индивиды всегда изменяют своё положение в стратификационной системе.\n3) Межпоколенная мобильность – сравнительное изменение социального статуса у представителей различных возрастных групп в отдельной семье.\n4) Социальная мобильность – это разделение общества на группы, занимающие разное положение в социальной иерархии.\n5) Организованной мобильностью называют управляемые государством перемещения человека и групп вверх, вниз и по горизонтали, с согласия людей или без него.", "answer": "135", "explanation": "1. Да. Каналы социальной мобильности (например, образование, армия, брак, профессиональная деятельность) обеспечивают движение людей вверх или вниз по социальной лестнице.\n\n2. Нет. При горизонтальной мобильности человек переходит в другую социальную группу с равным статусом, не изменяя своего положения в стратификационной системе.\n\n3. Да. Межпоколенная мобильность отражает различие в социальном положении между поколениями внутри одной семьи — например, если дети занимают более высокий статус, чем их родители.\n\n4. Нет. Разделение общества на группы по уровню дохода, власти, образования и престижа называется социальной стратификацией, а не мобильностью.\n\n5. Да. Организованная мобильность представляет собой управляемое государством или другими институтами перемещение людей по социальной структуре, которое может происходить как добровольно, так и принудительно."}, {"n": "27", "text": "Выберите верные суждения о социальной роли и запишите цифры, под которыми они указаны.\n1) Выполнение индивидом социальной роли зависит только от его индивидуальных психологических качеств.\n2) К основным социальным ролям индивида традиционно относят роли гражданина, работника, собственника и потребителя.\n3) Все социальные роли даются современному человеку от рождения.\n4) Социальная роль тесно связана с социальным статусом и отражает ожидания обществом определенного поведения индивида, соответствующего данному социальному статусу.\n5) Каждая роль в ролевом наборе предполагает особую манеру поведения и общения с людьми.", "answer": "245", "explanation": "1. Нет. Выполнение социальной роли определяется не только личными качествами человека (исполнительный, безответственный и т.д.), но и социальными ожиданиями, нормами и требованиями, установленными обществом.\n\n2. Да. К числу основных социальных ролей человека действительно относятся роли гражданина, работника, собственника и потребителя, поскольку они охватывают ключевые сферы общественной жизни.\n\n3. Нет. От рождения человеку даны лишь биологические предпосылки, а большинство социальных ролей осваивается им в процессе социализации.\n\n4. Да. Социальная роль связана с социальным статусом и выражает ожидаемое обществом поведение человека, занимающего определённое положение в социальной структуре.\n\n5. Да. Каждая роль предполагает особый стиль поведения и взаимодействия с другими людьми, соответствующий требованиям конкретной социальной ситуации."}, {"n": "28", "text": "Выберите верные суждения о социальных ролях и запишите цифры, под которыми они указаны.\n1) Все социальные роли определяются при рождении.\n2) Социальная роль выражается в динамическом воспроизведении социального статуса.\n3) Каждый индивид обладает только одним социальным статусом и соответствующей ему социальной ролью.\n4) Базовые социальные роли предполагают реализацию исключительно политических целей институтов гражданского общества.\n5) Социальная роль - это индивидуальное поведение в соответствии со своим статусом.", "answer": "25", "explanation": "1. Нет. Социальные роли не определяются при рождении — они формируются и осваиваются человеком в процессе социализации по мере включения в различные сферы общественной жизни.\n\n2. Да. Социальная роль отражает поведение человека в конкретных ситуациях и представляет собой динамическое воплощение его социального статуса в действиях.\n\n3. Нет. У человека может быть несколько социальных статусов и, соответственно, множество социальных ролей, которые он выполняет одновременно — например, родитель, работник, гражданин.\n\n4. Нет. Базовые социальные роли не связаны исключительно с политической сферой; они охватывают ключевые направления жизнедеятельности человека — труд, семью, образование, участие в общественной жизни.\n\n5. Да. Социальная роль представляет собой индивидуальное поведение человека, соответствующее его социальному статусу и ожиданиям общества."}, {"n": "29", "text": "Выберите верные суждения о социальной мобильности и запишите цифры, под которыми они указаны.\n1) Совокупность всех социальных перемещений индивида или группы входит в понятие социальной мобильности.\n2) Социальная мобильность может быть связана с приобретением или потерей собственности.\n3) Социальная мобильность предполагает только перемещение по вертикали.\n4) К каналам социальной мобильности относят институт образования.\n5) Межпоколенная социальная мобильность – это ситуация, при которой один и тот же человек, вне сравнения с его родителями, несколько раз на протяжении жизни меняет свои позиции в обществе.", "answer": "124", "explanation": "1. Да. Социальная мобильность охватывает все виды перемещений человека или группы в социальной структуре общества — как вертикальные, так и горизонтальные.\n\n2. Да. Приобретение или утрата собственности может привести к изменению социального положения, то есть являться проявлением социальной мобильности. Приобретение собственности может повысить социальный статус, а потеря — к понижению.\n\n3. Нет. Социальная мобильность включает не только вертикальные перемещения (вверх или вниз), но и горизонтальные — переход в другую группу с равным статусом.\n\n4. Да. Образование является важнейшим каналом социальной мобильности, поскольку даёт возможность повысить квалификацию, получить новую профессию и изменить социальный статус.\n\n5. Нет. Данное описание относится к внутрипоколенной мобильности, тогда как межпоколенная мобильность характеризует различия в положении между поколениями внутри одной семьи."}, {"n": "30", "text": "Выберите верные суждения о семье и браке. Запишите цифры, под которыми они указаны.\n1) Семейное законодательство Российской Федерации исходит из недопустимости произвольного вмешательства кого-либо в дела семьи.\n2) В зависимости от распределения обязанностей выделяют расширенные и традиционные семьи.\n3) Досуговая функция семьи связана с воспроизводством социальной структуры общества, так как предоставляет (передаёт) определённый социальный статус членам семьи.\n4) В Российской Федерации признаётся брак, зарегистрированный органами записи актов гражданского состояния.\n5) Функция духовного общения предполагает развитие личностей членов семьи, духовное взаимообогащение.", "answer": "145", "explanation": "1. Да. Семейное законодательство Российской Федерации исходит из принципа недопустимости произвольного вмешательства в дела семьи, так как семья находится под защитой государства.\n\n2. Нет. Расширенная (или многопоколенная) семья — это форма организации семьи, включающая несколько поколений. Традиционная семья — понятие более широкое и связано с устоями и обычаями. Распределение обязанностей может различаться даже внутри одного типа семьи.\n\n3. Нет. Досуговая функция семьи не связана напрямую с воспроизводством социальной структуры общества. Эта характеристика относится скорее к социализирующей или воспитательной функции. Досуговая функция связана с организацией свободного времени и совместным отдыхом членов семьи.\n\n4. Да. В Российской Федерации брак признаётся только если он зарегистрирован в органах ЗАГС (записи актов гражданского состояния), согласно Семейному кодексу РФ.\n\n5. Да. Функция духовного общения в семье предполагает развитие личности каждого члена семьи, эмоциональную поддержку, взаимопонимание и духовное обогащение друг друга."}, {"n": "31", "text": "Выберите верные суждения о семье. Запишите цифры, под которыми они указаны.\n1) Семья, материнство, отцовство и детство в Российской Федерации находятся под защитой государства.\n2) Репродуктивная функция семьи проявляется в материальном обеспечении её нетрудоспособных членов, в ведении домашнего хозяйства, во взаимной материальной поддержке.\n3) В зависимости от распределения обязанностей выделяют нуклеарные и традиционные семьи.\n4) Семейное законодательство Российской Федерации исходит из необходимости обеспечения беспрепятственного осуществления членами семьи своих прав.\n5) Социально-статусная функция семьи предполагает получение эмоциональной поддержки, психологической защиты.", "answer": "14", "explanation": "1. Да. Конституция Российской Федерации закрепляет, что семья, материнство, отцовство и детство находятся под защитой государства.\n\n2. Нет. Репродуктивная функция семьи связана с продолжением рода, рождением и воспитанием детей. Материальное обеспечение и ведение хозяйства относятся к хозяйственно-бытовой функции.\n\n3. Нет. В зависимости от распределения обязанностей семьи делятся на патриархальные и партнёрские, а нуклеарная семья — это разновидность семейной структуры по количеству поколений.\n\n4. Да. Семейное законодательство направлено на защиту прав членов семьи и обеспечение возможности их свободной реализации.\n\n5. Нет. Социально-статусная функция связана с передачей социального положения и определением статуса человека в обществе. Эмоциональная поддержка и защита относятся к эмоционально-психологической функции семьи."}, {"n": "32", "text": "Выберите верные суждения о семье и запишите цифры, под которыми они указаны.\n1) Нуклеарная семья включает в себя три и более поколения родственников.\n2) Своеобразие семьи заключается в том, что она одновременно представляет собой и социальный институт, и малую социальную группу.\n3) Рекреационная функция семьи проявляется в предоставлении определённого социального статуса членам семьи, в выполнении роли социального лифта. \n4) Семья призвана создать условия для физического, психического, эмоционального и интеллектуального развития ребёнка.\n5) Члены семьи связаны общностью быта, взаимной материальной и моральной ответственностью.", "answer": "245", "explanation": "1. Нет. Нуклеарная семья включает только два поколения — родителей и детей, в отличие от расширенной семьи, где могут жить несколько поколений.\n\n2. Да. Семья обладает двойной природой: она является социальным институтом, регулирующим отношения между супругами и детьми, и одновременно малой социальной группой, основанной на личных связях и эмоциональных отношениях.\n\n3. Нет. Рекреационная (т.е. досуговая) функция семьи связана с организацией отдыха, досуга и восстановлением физических и эмоциональных сил её членов. Предоставление социального статуса относится к социально-статусной функции.\n\n4. Да. Семья выполняет воспитательную функцию, создавая условия для всестороннего развития ребёнка — физического, эмоционального, интеллектуального и духовного.\n\n5. Да. Члены семьи объединены общим бытом, взаимной ответственностью и заботой друг о друге, что является одной из характерных черт семейных отношений."}, {"n": "33", "text": "Выберите верные суждения о семье и её функциях и запишите цифры, под которыми они указаны.\n1) Семьи расширенного типа включают в себя три и более поколения кровных родственников.\n2) Досуговая функция семьи проявляется в предоставлении определённого социального статуса членам семьи, в выполнении роли социального лифта. \n3) Семья является основным агентом вторичной социализации.\n4) Семья призвана создать условия для физического, психического, эмоционального и интеллектуального развития ребёнка.\n5) Члены семьи связаны общностью быта, взаимной материальной и моральной ответственностью.", "answer": "145", "explanation": "1. Да. Расширенная семья включает три и более поколения кровных родственников, живущих вместе или поддерживающих тесные связи.\n\n2. Нет. Досуговая функция семьи связана с организацией совместного отдыха и свободного времени, а не с предоставлением социального статуса или социальной мобильностью. Социально-статусная функция семьи — предоставление определённого социального статуса членам семьи.\n\n3. Нет. Семья — основной агент первичной социализации, формирующий базовые нормы и ценности, а вторичная социализация происходит в школе, коллективе и других институтах.\n\n4. Да. Семья обеспечивает необходимые условия для всестороннего развития ребёнка: физического, психического, эмоционального и интеллектуального.\n\n5. Да. Община быта и взаимная ответственность — ключевые признаки семьи как социальной группы."}, {"n": "34", "text": "Выберите верные суждения о семье и браке. Запишите цифры, под которыми они указаны.\n1) В Российской Федерации права граждан в семье могут быть ограничены только на основании федерального законодательства.\n2) Семья – это большая социальная группа, члены которой связаны только узами родства.\n3) Функция первичного социального контроля связана с тем, что принадлежность к семье позволяет человеку подтвердить и закрепить занимаемые им позиции либо даже продвинуться в социальной иерархии.\n4) Совместное времяпрепровождение на основе взаимных интересов благотворно влияет на всех членов семьи.\n5) В Российской Федерации признаётся брак, заключённый только в органах записи актов гражданского состояния.", "answer": "145", "explanation": "1. Да. Права граждан в семье регулируются федеральными законами, в частности Семейным кодексом Российской Федерации, и могут быть ограничены только на их основании.\n\n2. Нет. Семья является малой социальной группой, члены которой связаны не только родством, но и брачными отношениями, взаимной заботой и общим бытом.\n\n3. Нет. Функция первичного социального контроля семьи заключается в контроле поведения членов семьи, воспитании, соблюдении норм и правил, а не в закреплении их социального статуса.\n\n4. Да. Совместное времяпрепровождение укрепляет эмоциональные связи, способствует взаимопониманию и гармонии в семейных отношениях.\n\n5. Да. Законным в Российской Федерации признаётся только брак, зарегистрированный в органах записи актов гражданского состояния (ЗАГС)."}, {"n": "35", "text": "Выберите верные суждения о семье и браке. Запишите цифры, под которыми они указаны.\n1) В Российской Федерации родители имеют право и обязаны воспитывать своих детей.\n2) Досуговая функция связана с воспроизводством социальной структуры общества, так как предоставляет (передаёт) определённый социальный статус членам семьи.\n3) Семейное законодательство Российской Федерации исходит из необходимости обеспечить беспрепятственное осуществление членами семьи своих прав.\n4) В зависимости от распределения обязанностей выделяют нуклеарные и традиционные семьи.\n5) В Российской Федерации признаётся только брак, заключённый в органах записи актов гражданского состояния.", "answer": "135", "explanation": "1. Да. В соответствии с Семейным кодексом Российской Федерации родители не только имеют право, но и обязаны воспитывать своих детей, заботиться об их развитии и образовании.\n\n2. Нет. Досуговая (рекреационная) функция семьи связана с организацией отдыха, эмоциональной разрядкой и укреплением внутрисемейных отношений. Передача социального статуса относится к социально-статусной функции.\n\n3. Да. Семейное законодательство направлено на защиту прав членов семьи и обеспечение возможности их свободного осуществления без вмешательства извне.\n\n4. Нет. В зависимости от распределения обязанностей различают патриархальные и партнёрские (демократические) семьи. Нуклеарная семья — это классификация по составу, а не по распределению ролей.\n\n5. Да. Законным в Российской Федерации считается только брак, зарегистрированный в органах записи актов гражданского состояния (ЗАГС)."}, {"n": "36", "text": "Выберите верные суждения о социализации и запишите цифры, под которыми они указаны.\n1) Процесс усвоения социальных норм, знаний и образцов поведения, необходимых для успешного функционирования в обществе, называется социализацией.\n2) Социализация индивида происходит как в стихийной, так и в организованной форме.\n3) Воздействие агентов социализации на личность различно в зависимости от того, насколько они значимы для человека, как строится взаимодействие с ними, в каком направлении и какими средствами они оказывают своё влияние.\n4) Социализация имеет только личностную значимость.\n5) Семья – основной агент вторичной социализации.", "answer": "123", "explanation": "1. Да. Процесс усвоения социальных норм, знаний и образцов поведения, необходимых для успешного функционирования в обществе, называется социализацией.\n\n2. Да. Социализация индивида происходит как в стихийной (спонтанной) форме, так и в организованной — под влиянием целенаправленного воспитания и обучения.\n\n3. Да. Воздействие агентов социализации на личность зависит от их значимости для человека, характера взаимодействия с ними, направления и средств влияния.\n\n4. Нет. Социализация имеет общественную значимость, поскольку через неё осуществляется передача культурных ценностей, норм и традиций от одного поколения к другому.\n\n5. Нет. Семья является основным агентом первичной социализации, т.к. именно в семье ребёнок впервые усваивает базовые нормы и формы поведения."}, {"n": "37", "text": "Выберите верные суждения о социализации и запишите цифры, под которыми они указаны.\n1) Социализация индивида начинается с рождения и продолжается в течение всей его жизни.\n2) Институтами первичной социализации индивидов являются политические партии и общественные движения.\n3) Социализация индивида проходит всегда в организованной форме.\n4) Семья является одним из главных социальных институтов, влияющих на социализацию индивида.\n5) Социализация представляет собой усвоение индивидом социальных ценностей, норм и образцов поведения.", "answer": "145", "explanation": "1. Да. Социализация начинается с момента рождения человека и продолжается всю его жизнь, так как индивид постоянно усваивает новые нормы и ценности: оказывается в различных обществах с разными нормами и ценностями, узнает новое, достигает новых жизненных рубежей и т.д.\n\n2. Нет. Политические партии и общественные движения относятся к институтам вторичной социализации. Первичная социализация связана с ближайшим окружением индивида, прежде всего с семьёй.\n\n3. Нет. Социализация может проходить как в организованной форме (например, через деятельность школы), так и стихийно (под влиянием жизненных обстоятельств и среды).\n\n4. Да. Семья является важнейшим институтом социализации, поскольку именно в ней человек впервые осваивает нормы и ценности, получает первые социальные роли, формирует коммуникативные навыки. В семье закладываются основы мировоззрения и моральных установок, которые оказывают длительное влияние на личность.и.\n\n5. Да. Сущность социализации заключается в усвоении индивидом норм, ценностей, образцов поведения, принятых в обществе."}, {"n": "38", "text": "Выберите верные суждения о социализации индивида и запишите цифры, под которыми они указаны.\n1) Социализация связана с освоением индивидом новых социальных ролей.\n2) Первичная социализация заканчивается с началом трудовой деятельности.\n3) Агентами социализации являются только организации, отвечающие за передачу социокультурного опыта.\n4) Агенты вторичной социализации, как правило, действуют узконаправленно, в пределах своей компетенции, в соответствии с официальными предписаниями. \n5) Социализация предполагает только контролируемые процессы целенаправленного воздействия на личность.", "answer": "14", "explanation": "1. Да. Социализация включает освоение новых социальных ролей, так как в процессе жизни человек постоянно принимает на себя новые статусы — ученика, работника, родителя, пенсионера. Каждая роль имеет свои нормы и ценности.\n\n2. Нет. Первичная социализация не ограничивается началом трудовой деятельности, она связана с ближайшим окружением и продолжается до формирования базовых социальных навыков.\n\n3. Нет. Агентами социализации могут выступать как организации (школа, армия, СМИ), так и отдельные люди — родители, друзья, родственники.\n\n4. Да. Агенты вторичной социализации действуют более формально, их влияние ограничено компетенцией и закреплено официальными предписаниями, например, руководитель на работе или врач, с которым взаимодействует человек во время лечения.\n\n5. Нет. Социализация проходит не только в контролируемой, организованной форме, но и стихийно, под влиянием среды и случайных обстоятельств. Не все события в этой жизни можно контролировать."}, {"n": "39", "text": "Ниже приведен перечень социальных санкций. Все они, за исключением двух, относятся к формальным позитивным социальным санкциям.\n1) премирование; 2) присвоение почетного звания; 3) одобрительный отзыв друзей; 4) аплодисменты; 5) награждение почетной
