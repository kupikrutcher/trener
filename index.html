<!DOCTYPE html>
<html lang="ru" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Тренажёр</title>
<style>
/* ===== Quiet Precision ===== */
:root{
  --bg:#faf9f6; --surface:#ffffff; --ink:#1b1b1f; --muted:#8a8a94;
  --line:#e9e7e1; --line-strong:#dcdad2;
  --accent:#4f46e5; --accent-soft:rgba(79,70,229,.08);
  --ok:#3f9d5a; --ok-soft:rgba(63,157,90,.10);
  --bad:#c4593f; --bad-soft:rgba(196,89,63,.10);
  --r:18px;
}
[data-theme="night"]{
  --bg:#0e0e12; --surface:#16161c; --ink:#ececf1; --muted:#7d7d8a;
  --line:#23232c; --line-strong:#2e2e3a;
  --accent:#9aa2ff; --accent-soft:rgba(154,162,255,.12);
  --ok:#6cc88a; --ok-soft:rgba(108,200,138,.14);
  --bad:#e08a72; --bad-soft:rgba(224,138,114,.14);
  color-scheme:dark;
}
[data-theme="sepia"]{
  --bg:#f3ead7; --surface:#fbf5e9; --ink:#3f3322; --muted:#9c8a6e;
  --line:#e4d7bd; --line-strong:#d8c8a8;
  --accent:#b06a16; --accent-soft:rgba(176,106,22,.10);
  --ok:#5b8a3a; --ok-soft:rgba(91,138,58,.12);
  --bad:#b4502f; --bad-soft:rgba(180,80,47,.10);
}
[data-theme="forest"]{
  --bg:#eef2ee; --surface:#fbfdfb; --ink:#16241c; --muted:#6b7d72;
  --line:#d9e2da; --line-strong:#c6d3c8;
  --accent:#1f7a47; --accent-soft:rgba(31,122,71,.09);
  --ok:#1f7a47; --ok-soft:rgba(31,122,71,.12);
  --bad:#b4502f; --bad-soft:rgba(180,80,47,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .4s ease,color .4s ease;
}
.wrap{
  width:100%;max-width:640px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px}
.mark{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.mark b{font-weight:600;font-size:15px;letter-spacing:.02em}
.mark span{font-size:12px;color:var(--muted);font-weight:400}
.themes{display:flex;gap:9px}
.sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:1.5px solid var(--line-strong);padding:0;transition:transform .15s ease}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw.t-paper{background:#faf9f6} .sw.t-night{background:#16161c}
.sw.t-sepia{background:#e9d8b4} .sw.t-forest{background:#cfe0d3}
.bars{margin-bottom:30px}
.track{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.track>i{display:block;height:100%;width:0;background:var(--accent);transition:width .55s cubic-bezier(.22,1,.36,1)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 30px;flex:none}
.fade{animation:fade .5s cubic-bezier(.22,1,.36,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- home / library ---- */
.home h1{font-weight:600;font-size:clamp(26px,6vw,32px);letter-spacing:-.02em;margin:2px 0 8px}
.home .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
.tlist{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.tcard{display:flex;align-items:center;gap:14px;padding:18px 18px;border:1px solid var(--line);
  border-radius:14px;cursor:pointer;background:var(--bg);transition:border-color .2s,background .2s,transform .12s}
.tcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.tcard:active{transform:translateY(1px)}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;font-size:15.5px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.tbadge{font-size:10.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:2px 8px;margin-left:8px;letter-spacing:.03em;vertical-align:middle}
.trm{flex:none;width:28px;height:28px;border-radius:8px;border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer;transition:color .2s,background .2s;line-height:1}
.trm:hover{color:var(--bad);background:var(--bad-soft)}
.tgo{flex:none;color:var(--muted);font-size:18px}
.tcard:hover .tgo{color:var(--accent)}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.01em;
  padding:16px 20px;border-radius:13px;color:#fff;background:var(--accent);
  transition:transform .12s ease,opacity .2s ease,filter .2s ease;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{filter:none;background:var(--accent-soft);border-color:var(--accent)}
.linkfin{display:block;width:100%;text-align:center;margin-top:14px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:color .2s}
.linkfin:hover{color:var(--accent)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6;opacity:.85}
/* ---- question ---- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qnum{font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.qtype{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.qtext{font-size:16px;line-height:1.65;color:var(--ink)}
.qtext .lead{display:block}
.qtext .opt{display:block;margin-top:11px;padding-left:24px;text-indent:-24px}
.qtext .hdr{display:block;margin-top:20px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qtext .ins{display:block;margin-top:16px;font-size:13.5px;color:var(--muted);font-style:italic}
.az{margin-top:30px}
.az .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:11px;letter-spacing:.02em}
.field{width:100%;font-size:21px;font-weight:600;letter-spacing:.1em;text-align:center;font-family:inherit;
  color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:13px;padding:16px 12px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .3s}
.field::placeholder{letter-spacing:.01em;font-weight:400;font-size:13.5px;color:var(--muted);opacity:.55}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.good{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.field.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.az .btn{margin-top:16px}
.verdict{margin-top:22px;display:none}
.verdict.show{display:block;animation:fade .4s ease}
.vrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.verdict.ok .vrow{color:var(--ok)} .verdict.bad .vrow{color:var(--bad)}
.vdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.verdict.ok .vdot{background:var(--ok)} .verdict.bad .vdot{background:var(--bad)}
.cline{margin-top:12px;font-size:14px;color:var(--muted)}
.cline b{color:var(--ink);font-size:17px;letter-spacing:.06em;margin-left:4px}
.etog{margin-top:18px;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;letter-spacing:.01em}
.expl{margin-top:14px;overflow:hidden;max-height:0;transition:max-height .55s ease}
.expl.open{max-height:4000px}
.expl-inner{padding-top:4px;border-top:1px solid var(--line)}
.epoint{font-size:14px;line-height:1.7;color:var(--muted);margin-top:14px}
.epoint:first-child{margin-top:16px}
/* ---- review-all ---- */
.allhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.allhead h1{font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.allsub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.allitem{padding:22px 0;border-top:1px solid var(--line)}
.aans{margin-top:12px;font-size:14px;color:var(--muted)}
.aans b{color:var(--ok);font-size:16px;letter-spacing:.06em;margin-left:4px}
/* ---- result ---- */
.ring{width:150px;height:150px;margin:6px auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font-size:38px;font-weight:600;letter-spacing:-.02em}
.ring .lab b i{font-size:20px;color:var(--muted);font-style:normal}
.ring .lab span{font-size:12px;color:var(--muted);margin-top:2px}
.gtitle{text-align:center;font-size:19px;font-weight:600;margin:2px 0 6px}
.gsub{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 auto 26px;max-width:36ch}
.rrow{display:flex;gap:12px}
.rrow .btn{flex:1}
.review h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:30px 0 14px}
.rev{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.rev .rn{color:var(--ink);font-weight:500;flex:none}
.rev .rd{color:var(--muted);margin-left:auto;text-align:right;font-size:13px}
.rev .rd .y{color:var(--bad);text-decoration:line-through;margin-right:8px}
.rev .rd .g{color:var(--ok);font-weight:600;letter-spacing:.05em}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;opacity:.6;letter-spacing:.03em}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(150%);
  background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:11px;font-size:13.5px;
  z-index:9;transition:transform .4s cubic-bezier(.22,1,.36,1);max-width:88vw}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:680px){.panel{padding:42px 44px}.qtext{font-size:16.5px}}
@media(max-width:380px){.panel{padding:28px 22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mark" onclick="home()"><b>Тренажёр</b><span>обществознание</span></div>
    <div class="themes" id="themes">
      <button class="sw t-paper"  data-t="paper"  aria-label="Бумага"></button>
      <button class="sw t-night"  data-t="night"  aria-label="Ночь"></button>
      <button class="sw t-sepia"  data-t="sepia"  aria-label="Сепия"></button>
      <button class="sw t-forest" data-t="forest" aria-label="Лес"></button>
    </div>
  </div>

  <div class="bars" id="bars" style="display:none">
    <div class="track"><i id="pbar"></i></div>
    <div class="meta"><span><b id="cur">1</b> / <b id="tot">50</b></span><span>верно <b id="scr">0</b></span></div>
  </div>

  <div id="app" class="panel"></div>
  <div class="foot" id="foot"></div>
</div>

<input type="file" id="file" accept=".csv,text/csv" multiple>
<div class="toast" id="toast"></div>

<script>
const BUILTIN = [{"n": "Задание № 1", "text": "Выберите верные суждения о нормах права и запишите цифры, под которыми они указаны.1) Норма права – это элемент системы права, представляющий собой совокупность правовых институтов, регулирующих качественно однородную сферу общественных отношений.2) Нормы права представляют собой правила общеобязательного характера.3) В зависимости от характера предписаний различают управомочивающие, запрещающие и обязывающие правовые нормы.4) Нормы права обеспечиваются силой государственного принуждения.5) Нормы права являются разновидностью социальных норм.", "answer": "2345", "explanation": "1. Нет. Норма права – это не совокупность правовых институтов, а самостоятельная первичная единица системы права. Она представляет собой общеобязательное правило поведения, установленное государством. 2. Да. Нормы права имеют общеобязательный характер, то есть распространяются на всех, кто попадает под их действие. Они регулируют различные сферы общественной жизни, например, трудовые отношения, семейные обязанности, права граждан. Даже если человек не согласен с нормой, он обязан её соблюдать. Например, правила дорожного движения обязательны для всех водителей. 3. Да. Нормы права различаются по своему характеру: – Управомочивающие нормы дают человеку право на определённые действия, но не обязывают его. Например, каждый гражданин имеет право на получение медицинской помощи, но никто не заставляет его обращаться к врачу. – Запрещающие нормы вводят запрет на конкретные действия, например, на продажу алкоголя несовершеннолетним. – Обязывающие нормы требуют от человека определённого поведения, например, родители обязаны обеспечивать своих несовершеннолетних детей. 4. Да. Отличительная черта норм права – их обеспечение государственным принуждением. При нарушении нормы к человеку могут быть применены меры ответственности – штраф, административное взыскание, лишение свободы и др. Например, если работодатель не выплачивает заработную плату своим сотрудникам, государственные органы могут обязать его сделать это и наложить штраф. 5. Да. Нормы права входят в систему социальных норм наряду с нормами морали, религии, традиций. Однако правовые нормы отличаются тем, что устанавливаются государством и закрепляются в законах, а их исполнение обеспечивается принудительной силой."}, {"n": "Задание № 2", "text": "Установите соответствие между характеристиками и источниками (формами) права к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ХАРАКТЕРИСТИКИА) двустороннее или многостороннее соглашение субъектов права,содержащее правовые нормыБ) решение, вынесенное по аналогичному делу, разрешенному в рамках аналогичного производстваВ) документ, принимаемый специально уполномоченным органом государства, который устанавливает, изменяет, или отменяет правовые нормыГ) исторически сложившееся путем многократного повторения правило поведения, санкционированное государством в качестве общеобязательного правилаД) документ, закрепляющий договоренность нескольких субъектов и содержащих их взаимные права и обязанностиИСТОЧНИКИ (ФОРМЫ) ПРАВА1) нормативный правовой акт2) правовой обычай3) судебный прецедент4) нормативный договор", "answer": "43124", "explanation": "А) двустороннее или многостороннее соглашение субъектов права, содержащее правовые нормы — 4) нормативный договорБ) решение, вынесенное по аналогичному делу, разрешенному в рамках аналогичного производства — 3) судебный прецедентВ) документ, принимаемый специально уполномоченным органом государства, который устанавливает, изменяет, или отменяет правовые нормы — 1) нормативный правовой актГ) исторически сложившееся путём многократного повторения правило поведения, санкционированное государством в качестве общеобязательного правила — 2) правовой обычайД) документ, закрепляющий договорённость нескольких субъектов и содержащий их взаимные права и обязанности — 4) нормативный договор"}, {"n": "Задание № 3", "text": "Установите соответствие между характеристиками и источниками (формами) права: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ХАРАКТЕРИСТИКИ А) закон, обладающий высшей юридической силойБ) соглашение двух или более сторон, устанавливающее, изменяющее или отменяющее правовые нормы в пределах их компетенцииВ) решение, вынесенное по конкретному делу, служащее образцом для аналогичных делГ) санкционируемое государством правило поведения, которое сложилось в результате длительного повторения определённых действий, в результате чего закрепилось как устойчивая нормаД) определённая форма принятия (издания) документа правотворческим органом в пределах его компетенцииИСТОЧНИКИ (ФОРМЫ) ПРАВА1) судебный прецедент2) правовой обычай3) нормативный договор4) нормативный правовой актЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "43124", "explanation": "А) закон, обладающий высшей юридической силой — 4) нормативный правовой актБ) соглашение двух или более сторон, устанавливающее, изменяющее или отменяющее правовые нормы в пределах их компетенции — 3) нормативный договорВ) решение, вынесенное по конкретному делу, служащее образцом для аналогичных дел — 1) судебный прецедентГ) санкционируемое государством правило поведения, которое сложилось в результате длительного повторения определённых действий, в результате чего закрепилось как устойчивая норма — 2) правовой обычайД) определённая форма принятия (издания) документа правотворческим органом в пределах его компетенции — 4) нормативный правовой акт"}, {"n": "Задание № 4", "text": "Выберите верные суждения о нормативных правовых актах и запишите цифры, под которыми они указаны.1) По общему правилу закон в Российской Федерации обратной силы не имеет.2) Кодексы являются нормативными правовыми актами.3) Постановления Правительства Российской Федерации относятся к нормативным правовым актам субъектов Российской Федерации.4) Устав субъекта Российской Федерации должен быть официально одобрен Советом Федерации.5) Подзаконным актом называют нормативный правовой акт, принятый органом государственной власти в пределах его компетенции на основеи во исполнение закона.", "answer": "125", "explanation": "1. Да. Закон в Российской Федерации не имеет обратной силы, то есть применяется только к отношениям, возникшим после его вступления в силу. Исключение составляют случаи, когда закон смягчает или отменяет ответственность. 2. Да. Кодексы являются нормативными правовыми актами, которые систематизируют нормы права в определённой сфере. Примеры: Гражданский кодекс РФ, Уголовный кодекс РФ. 3. Нет. Постановления Правительства РФ являются нормативными правовыми актами федерального уровня, а не субъектов РФ. Органы власти субъектов РФ издают собственные акты, но постановления Правительства РФ обязательны для исполнения на федеральном уровне. 4. Нет. Устав субъекта Российской Федерации принимается его законодательным органом и не требует одобрения Совета Федерации. Федеральные органы вмешиваются только в том случае, если в документ противоречит Конституции РФ.5. Да. Подзаконные акты издаются государственными органами в пределах их компетенции на основе и во исполнение закона. Они конкретизируют законодательные нормы, например, указы президента или постановления правительства."}, {"n": "Задание № 5", "text": "Выберите верные суждения о системе права. Запишите цифры, под которыми они указаны.1) Нормативный правовой акт, в отличие от других форм (источников) права, представляет собой исторически выработанное обществом правило поведения, которое признано государством и гарантировано его принудительной силой.2) Процессуальное право определяет правила реализации и защиты материальных прав.3) Отрасль права — это совокупность правовых норм, регулирующих определённую сферу однородных общественных отношений.4) Правовые нормы от других видов социальных норм отличает строгая формальная определённость содержащихся в них предписаний.5) Публично-правовые отношения, в отличие от частно-правовых, основаны на свободе договоров и юридическом равенстве участников.", "answer": "234", "explanation": "1. Нет. Описанное правило относится к правовому обычаю, а не к нормативному правовому акту, который принимается уполномоченными органами и закрепляется в официальном письменном документе.2. Да. Процессуальное право устанавливает порядок реализации, защиты и восстановления материальных прав, а также процедуры разрешения юридических споров.3. Да. Отрасль права представляет собой совокупность правовых норм, регулирующих определённую сферу однородных общественных отношений, например, трудовых или семейных.4. Да. Правовые нормы отличаются формальной определённостью, так как они точно сформулированы, закреплены в официальных источниках и обязательны для исполнения.5. Нет. Публично-правовые отношения строятся на началах власти и подчинения, тогда как свобода договора и юридическое равенство характерны для частно-правовых отношений."}, {"n": "Задание № 6", "text": "Выберите верные суждения о правоотношениях и запишите цифры, под которыми они указаны.1) Правоотношение – это результат воздействия нормы права на фактическое общественное отношение.2) Правоотношение носит волевой характер.3) Под объектом правоотношения понимается материальное либо нематериальное благо, а также действие лица либо результаты данных действий, в связи с которыми формируется правоотношение.4) Процессуальные правоотношения могут возникнуть без материальных правоотношений и существовать без них.5) Гражданское правоотношение связано с деятельностью государственных органов, осуществляющих и реализующих функции государства.", "answer": "123", "explanation": "1. Да. Правоотношение возникает на основе нормы права и конкретного юридического факта и представляет собой форму реализации нормы в реальном общественном взаимодействии.2. Да. Правоотношения носят волевой характер, так как предполагают осознанное поведение участников, выражающееся в осуществлении субъективных прав и исполнении юридических обязанностей.3. Да. Объектом правоотношения являются материальные и нематериальные блага, а также действия участников или их результаты, по поводу которых и складывается данное правоотношение.4. Нет. Процессуальные правоотношения, как правило, возникают в связи с материальными правоотношениями и направлены на их реализацию, защиту или восстановление.5. Нет. Гражданские правоотношения регулируют имущественные и связанные с ними личные неимущественные отношения между равноправными субъектами, а деятельность государственных органов по осуществлению функций государства относится к публично-правовой сфере."}, {"n": "Задание № 7", "text": "Выберите верные суждения о юридической ответственности. Запишите цифры, под которыми они указаны.1) Никто не может нести уголовную ответственность дважды за одно и тоже преступление.2) Компетентные органы могут привлекать к юридической ответственности только в строго установленном законом порядке и на предусмотренных законом основаниях.3) Характер и объём лишений правонарушителя установлены в санкции правовой нормы.4) Юридическая ответственность может наступить за выполнение правовых требований.5) Юридическая ответственность наступает только за бездействие.", "answer": "123", "explanation": "1. Да. Повторное привлечение к уголовной ответственности за одно и то же преступление не допускается — это гарантия от двойного наказания, закреплённая в законе.2. Да. Привлечение к ответственности осуществляется только уполномоченными органами и строго в рамках закона, с соблюдением всех процедур.3. Да. Санкция правовой нормы содержит указание на меры воздействия, которые могут быть применены к нарушителю, включая характер и объём лишений.4. Нет. Ответственность наступает за нарушение нормы, а не за её выполнение. Соблюдение закона не влечёт наказания.5. Нет. Ответственность может наступить как за бездействие, так и за действия, если они нарушают нормы права."}, {"n": "Задание № 8", "text": "Выберите верные суждения о видах юридической ответственности и запишите цифры, под которыми они указаны1) За совершение административного правонарушения может предусматриваться наказание в виде лишения свободы на определенный срок.2) В соответствии с Трудовым кодексом РФ к дисциплинарным взысканиям относят принудительные и обязательные работы.3) Одним из видов наказаний, предусмотренных Кодексом РФ об административных правонарушениях, является предупреждение.4) Одним из видов наказаний, предусмотренных Уголовным кодексом РФ, является ограничение свободы.5) К способам защиты гражданских прав относят компенсацию морального вреда, взыскание неустойки.", "answer": "345", "explanation": "1. Нет. За совершение административного правонарушения не предусматривается наказание в виде лишения свободы на определенный срок. В основном наказания за административные правонарушения включают штрафы, предупреждения, аресты на короткий срок и другие меры.2. Нет. В соответствии с Трудовым кодексом РФ к дисциплинарным взысканиям не относят принудительные и обязательные работы. Дисциплинарные взыскания включают замечание, выговор и увольнение (ЗВУ). Принудительные и обязательные работы — это наказания в рамках уголовного и административного права.3. Да. Одним из видов наказаний, предусмотренных Кодексом РФ об административных правонарушениях, является предупреждение. Это один из менее строгих видов наказания, который может быть применен в случаях, когда правонарушение не является серьезным, но необходимо зафиксировать нарушение.4. Да. Одним из видов наказаний, предусмотренных Уголовным кодексом РФ, является ограничение свободы. Это форма наказания, при которой осужденный обязан соблюдать определенные ограничения, но не помещается в исправительное учреждение.5. Да. К способам защиты гражданских прав относят компенсацию морального вреда и взыскание неустойки. Эти способы направлены на возмещение ущерба или компенсацию убытков, причиненных нарушением гражданских прав."}, {"n": "Задание № 9", "text": "Выберите верные суждения о правонарушениях и юридической ответственности. Запишите цифры, под которыми они указаны.1) Субъектом правонарушения может быть только индивид.2) Гражданско-правовые проступки выражаются в нанесении организациям или отдельным гражданам имущественного или морального вреда.3) Административная ответственность налагается судом только на лицо, совершившее преступление.4) Уголовная ответственность, в отличие от гражданско-правовой ответственности, носит имущественный характер и направлена на компенсацию причинённых убытков.5) Правонарушение - основание для возникновения юридической ответственности.", "answer": "25", "explanation": "1. Нет. Субъектом правонарушения могут быть не только физические лица, но и юридические лица, если это прямо предусмотрено нормами права (например, в гражданском и административном праве).2. Да. Гражданско-правовые проступки связаны с причинением имущественного и (или) морального вреда гражданам и организациям и влекут обязанность его возмещения.3. Нет. Административная ответственность применяется за административные правонарушения и может налагаться как судами, так и иными уполномоченными органами, при этом она не связана с совершением преступления.4. Нет. Уголовная ответственность носит карательный характер и выражается в применении наказаний (лишение свободы, штраф, обязательные работы и др.), тогда как компенсация ущерба является характерной чертой гражданско-правовой ответственности.5. Да. Совершение правонарушения является юридическим основанием для возникновения юридической ответственности, поскольку именно противоправное деяние запускает механизм её применения."}, {"n": "Задание № 10", "text": "Установите соответствие между проступками и их видами: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ПРОСТУПКИ А) остановка автомобиля под запрещающим знакомБ) нарушение авторского праваВ) опоздание на службуГ) невыплата процентов по кредитуД) нарушение правил пожарной безопасностиВИДЫ ПРОСТУПКОВ 1) гражданские проступки2) административные проступки3) дисциплинарные проступки", "answer": "21312", "explanation": "А. остановка автомобиля под запрещающим знаком - 2. административные проступкиБ. нарушение авторского права - 1. гражданские проступкиВ. опоздание на службу - 3. дисциплинарные проступкиГ. невыплата процентов по кредиту - 1. гражданские проступкиД. нарушение правил пожарной безопасности - 2. административные проступки"}, {"n": "Задание № 11", "text": "Установите соответствие между примерами и мерами юридической ответственности в РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ПРИМЕРЫ А) выговорБ) принудительные работыВ) компенсация морального вредаГ) замечаниеД) пожизненное лишение свободыМЕРЫ ЮРИДИЧЕСКОЙ ОТВЕТСТВЕННОСТИ В РФ 1) способы защиты гражданских прав по Гражданскому кодексу РФ2) дисциплинарные взыскания по Трудовому кодексу РФ3) наказания по Уголовному кодексу РФ", "answer": "23123", "explanation": "А. выговор - 2. дисциплинарные взыскания по Трудовому кодексу РФ Б. принудительные работы - 3. наказания по Уголовному кодексу РФ В. компенсация морального вреда - 1. способы защиты гражданских прав по Гражданскому кодексу РФ Г. замечание - 2. дисциплинарные взыскания по Трудовому кодексу РФ Д. пожизненное лишение свободы - 3. наказания по Уголовному кодексу РФ"}, {"n": "Задание № 12", "text": "Выберите верные суждения о субъектах гражданского права. Запишите цифры, под которыми они указаны.1) Решение об ограничении прав юридического лица может принять любой государственный орган.2) Юридические лица как субъекты гражданского права могут иметь в собственности обособленное имущество.3) Юридические лица могут выступать в суде в качестве истца.4) Правоспособность физического лица может быть ограничена решением органа внутренних дел.5) Индивидуальным предпринимателем признаётся лицо, зарегистрированное в этом качестве в установленном законом порядке.", "answer": "235", "explanation": "1. Нет. Решение об ограничении прав юридического лица может принять только суд в установленном законом порядке.2. Да. Юридические лица как субъекты гражданского права могут иметь в собственности обособленное имущество, так как это является одним из признаков юридического лица.3. Да. Юридические лица могут выступать в суде в качестве истца, так как они имеют право на защиту своих прав и интересов.4. Нет. Правоспособность физического лица может быть ограничена только судом в установленном законом порядке, а не органом внутренних дел.5. Да. Индивидуальным предпринимателем признаётся лицо, зарегистрированное в этом качестве в установленном законом порядке, так как регистрация является обязательным условием для осуществления предпринимательской деятельности."}, {"n": "Задание № 13", "text": "Выберите верные суждения о гражданском праве и запишите цифры, под которыми они указаны.1) Субъектами гражданско-правовых отношений могут быть физические лица, юридические лица, публично-правовые образования.2) Гражданское право устанавливает способы защиты имущественных и личных неимущественных прав граждан.3) Гражданские права и обязанности возникают в результате приобретения имущества по основаниям, допускаемым законом.4) К источникам гражданского права относят Уголовный кодекс РФ.5) Гражданское право регулирует общественные отношения в сфере управленческой деятельности государственных органов и должностных лиц.", "answer": "123", "explanation": "1. Да. Физические лица, юридические лица и публично-правовые образования участвуют в гражданско-правовых отношениях как субъекты.2. Да. Гражданское право закрепляет способы защиты имущественных и личных неимущественных прав, включая возмещение убытков и признание права.3. Да. Гражданские права и обязанности возникают при приобретении имущества на основаниях, предусмотренных законом, например по договору или по наследованию.4. Нет. Уголовный кодекс относится к уголовному праву и не является источником гражданского права.5. Нет. Управленческая деятельность государственных органов регулируется нормами административного и конституционного права."}, {"n": "Задание № 14", "text": "Установите соответствие между организационно-правовыми формами и видами юридических лиц в Российской Федерации: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ОРГАНИЗАЦИОННО-ПРАВОВЫЕ ФОРМЫ ЮРИДИЧЕСКИХ ЛИЦ:А) благотворительный фонд Б) государственное унитарное предприятие В) хозяйственное товарищество Г) гаражный кооператив Д) политическая партия ВИДЫ ЮРИДИЧЕСКИХ ЛИЦ:1) некоммерческие 2) коммерческие Запишите выбранные цифры под соответствующими буквами.", "answer": "12211", "explanation": "А) благотворительный фонд — 1) некоммерческие Б) государственное унитарное предприятие — 2) коммерческие В) хозяйственное товарищество — 2) коммерческие Г) гаражный кооператив — 1) некоммерческие Д) политическая партия — 1) некоммерческие"}, {"n": "Задание № 15", "text": "Установите соответствие между примерами и видами субъектов гражданского права в Российской Федерации: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ПРИМЕРЫ А) Республика КалмыкияБ) крестьянское (фермерское) хозяйство «Вкусные продукты»В) муниципальное унитарное предприятие «Транспорт»Г) автор художественного произведения гражданин О.А. КовалевД) Калужская областьВИДЫ СУБЪЕКТОВ ГРАЖДАНСКОГО ПРАВА 1) физическое лицо2) юридическое лицо3) публично-правовое образование", "answer": "32213", "explanation": "А. Республика Калмыкия — 3. публично-правовое образованиеБ. крестьянское (фермерское) хозяйство «Вкусные продукты» — 2. юридическое лицоВ. муниципальное унитарное предприятие «Транспорт» — 2. юридическое лицоГ. автор художественного произведения гражданин О.А. Ковалев — 1. физическое лицоД. Калужская область — 3. публично-правовое образование"}, {"n": "Задание № 16", "text": "Поликарп работает в акционерном обществе, а Мефодий – в производственном кооперативе. Найдите в приведённом списке черты отличия акционерного общества от производственного кооператива. Запишите цифры, под которыми они указаны.1) необходимость заключения трудового договора с работниками2) разделение уставного капитала фирмы на равные части, каждая из которых оформлена ценной бумагой3) возможность получения собственниками ценных бумаг предприятия дивидендов по итогам года4) регистрация предприятия в установленном законом порядке5) получение прибыли в качестве основной цели предприятия6) несение риска убытков в пределах стоимости принадлежащих участнику ценных бумаг", "answer": "236", "explanation": "1. Нет. Необходимость заключения трудового договора с работниками является общей чертой для акционерных обществ и производственных кооперативов.2. Да. Разделение уставного капитала фирмы на равные части, каждая из которых оформлена ценной бумагой, является отличительной чертой акционерного общества, так как уставный капитал акционерного общества делится на акции.3. Да. Возможность получения собственниками ценных бумаг предприятия дивидендов по итогам года является отличительной чертой акционерного общества, так как дивиденды выплачиваются акционерам в зависимости от количества принадлежащих им акций.4. Нет. Регистрация предприятия в установленном законом порядке является общей чертой для всех юридических лиц, независимо от их организационно-правовой формы.5. Нет. Получение прибыли в качестве основной цели предприятия является общей чертой для акционерных обществ и производственных кооперативов, так как они являются коммерческими организациями.6. Да. Несение риска убытков в пределах стоимости принадлежащих участнику ценных бумаг является отличительной чертой акционерного общества, так как акционеры несут риск убытков только в пределах стоимости своих акций."}, {"n": "Задание № 17", "text": "Установите соответствие между примерами и правомочиями собственника: к каждому элементу, данному в первом столбце, подберите соответствующий элемент из второго столбца.ПРИМЕРЫА) Иван продал автомобиль.Б) Екатерина имеет однокомнатную квартиру, но в ней не проживает.В) Анна сдаёт в аренду принадлежащий ей гараж.Г) Марина подарила свой ноутбук младшей сестре.Д) Валерий получил в наследство от родителей дачу, где проводит каждые выходные, а летом выращивает овощи для домашнего стола.ПРАВОМОЧИЯ СОБСТВЕННИКА1) владение2) пользование3) распоряжениеЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "31332", "explanation": "А) Иван продал автомобиль — 3) распоряжениеБ) Екатерина имеет однокомнатную квартиру, но в ней не проживает — 1) владениеВ) Анна сдаёт в аренду принадлежащий ей гараж — 3) распоряжениеГ) Марина подарила свой ноутбук младшей сестре — 3) распоряжениеД) Валерий получил в наследство дачу и использует её для отдыха и выращивания овощей — 2) пользование"}, {"n": "Задание № 18", "text": "Выберите верные суждения о семейном праве Российской Федерации и запишите цифры, под которыми они указаны.1) Семейное право устанавливает порядок осуществления и защиты семейных прав.2) Брак приостанавливается вследствие объявления органом ЗАГС одного из супругов умершим.3) Законный режим имущества супругов устанавливается только брачным договором.4) Супруги обязаны строить свои отношения в семье на основе взаимоуважения и взаимопомощи.5) Родительские права могут осуществляться в противоречии с интересами детей.", "answer": "14", "explanation": "1. Да. Семейное право регулирует порядок возникновения, осуществления и защиты семейных прав и обязанностей граждан.2. Нет. Объявление супруга умершим влечёт прекращение, а не приостановление брака.3. Нет. Законный режим имущества супругов — это режим совместной собственности, установленный Семейным кодексом, а брачный договор вводит договорной режим.4. Да. Семейное законодательство обязывает супругов строить отношения на принципах взаимоуважения, взаимопомощи и ответственности перед семьёй.5. Нет. Родительские права не могут осуществляться в противоречии с интересами детей; закон прямо запрещает такие действия."}, {"n": "Задание № 19", "text": "Выберите верные суждения о браке согласно Семейному кодексу Российской Федерации и запишите цифры, под которыми они указаны.1) Отказ органа записи гражданского состояния в регистрации брака может быть обжалован в прокуратуру лицами, желающими вступить в брак (одним из них). 2) Для заключения брака необходимы взаимное добровольное согласие мужчины и женщины, вступающих в брак, и достижение ими брачного возраста.3) Брак может быть прекращён путём его расторжения по заявлению одного или обоих супругов, а также по заявлению опекуна супруга, признанного судом недееспособным.4) Брак заключается в органах записи актов гражданского состояния.5) Права и обязанности супругов возникают со дня принятия ими решения о вступлении в брак.", "answer": "234", "explanation": "1. Нет. Отказ органа записи актов гражданского состояния в регистрации брака может быть обжалован в суд, а не в прокуратуру.2. Да. Для заключения брака необходимо взаимное добровольное согласие мужчины и женщины и достижение ими брачного возраста, установленного законом.3. Да. Брак может быть расторгнут по заявлению одного или обоих супругов, а также по заявлению опекуна супруга, признанного судом недееспособным.4. Да. Брак в Российской Федерации заключается исключительно в органах записи актов гражданского состояния (ЗАГС).5. Нет. Права и обязанности супругов возникают не с момента решения о вступлении в брак, а со дня государственной регистрации брака в органах ЗАГС."}, {"n": "Задание № 20", "text": "Установите соответствие между ситуациями и способами расторжения брака согласно Семейному кодексу РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.СИТУАЦИИ А) осуждение ранее судом одного из супругов к лишению свободы на срок более трех лет Б) наличие у супругов общих несовершеннолетних детейВ) взаимное согласие супругов при отсутствии несовершеннолетних детейГ) признание ранее судом одного из супругов недееспособным в установленном законом порядкеД) отсутствие согласия одного из супруговСПОСОБЫ РАСТОРЖЕНИЯ БРАКА1) в органах записи актов гражданского состояния2) в судебном порядке", "answer": "12112", "explanation": "А) осуждение ранее судом одного из супругов к лишению свободы на срок более трех лет — 1) в органах записи актов гражданского состоянияБ) наличие у супругов общих несовершеннолетних детей — 2) в судебном порядке В) взаимное согласие супругов при отсутствии несовершеннолетних детей — 1) в органах записи актов гражданского состояния Г) признание ранее судом одного из супругов недееспособным в установленном законом порядке — 1) в органах записи актов гражданского состоянияД) отсутствие согласия одного из супругов — 2) в судебном порядке"}, {"n": "Задание № 21", "text": "Граждане Российской Федерации Игорь и Анна решили вступить в брак. Найдите в приведённом перечне условия, соблюдение которых необходимо для заключения брака в Российской Федерации. Запишите цифры, под которыми они указаны.1) отсутствие судимости у лиц, вступающих в брак2) взаимное добровольное согласие лиц, вступающих в брак3) достижение брачного возраста женихом и невестой4) отсутствие близкого родства между лицами, вступающими в брак5) наличие у лиц, вступающих в брак, постоянного источника доходов6) расторжение невестой и женихом ранее зарегистрированных браков", "answer": "2346", "explanation": "1. Нет. Наличие или отсутствие судимости не является условием для вступления в брак.2. Да. Вступление в брак возможно только при взаимном добровольном согласии.3. Да. Необходимо достижение брачного возраста — обычно 18 лет. В исключительных случаях он может быть снижен.4. Да. Брак запрещён между близкими родственниками.5. Нет. Постоянный доход не является обязательным условием для заключения брака.6. Да. Предыдущие браки должны быть официально расторгнуты. Одновременное нахождение в двух браках не допускается."}, {"n": "Задание № 22", "text": "Выберите верные суждения об особенностях правового регулирования труда несовершеннолетних в Российской Федерации. Запишите цифры, под которыми они указаны.1) Работникам в возрасте до 18 лет предоставляется ежегодный основной оплачиваемый отпуск продолжительностью 45 календарных дней.2) Лица, не достигшие возраста 18 лет, подлежат обязательному предварительному медицинскому осмотру при заключении трудового договора.3) Для работников в возрасте до 18 лет нормы выработки устанавливаются исходя из общих норм выработки пропорционально установленной для этих работников сокращённой продолжительности рабочего времени.4) Для несовершеннолетних работников устанавливается испытание при приёме на работу сроком на один месяц.5) Заключение трудового договора по общему правилу допускается с лицами, достигшими возраста 15 лет.", "answer": "23", "explanation": "1. Нет. Несовершеннолетним работникам предоставляется ежегодный основной оплачиваемый отпуск продолжительностью 31 календарный день.2. Да. При заключении трудового договора лица до 18 лет обязаны пройти предварительный медицинский осмотр.3. Да. Нормы выработки для работников до 18 лет устанавливаются с учётом сокращённой продолжительности рабочего времени, пропорционально общим нормам.4. Нет. Установление испытательного срока для работников младше 18 лет не допускается.5. Нет. По общему правилу трудовой договор можно заключить с лицами, достигшими возраста 16 лет, если работа не мешает получению образования и не связана с вредными условиями труда."}, {"n": "Задание № 23", "text": "Выберите верные суждения о трудовом договоре в соответствии с Трудовым кодексом РФ и запишите цифры, под которыми они указаны.1) Трудовой договор может заключаться на неопределённый срок.2) Трудовой договор вступает в силу со дня его подписания работником и работодателем, если иное не установлено трудовым законодательством.3) При заключении трудового договора в нём по соглашению сторон может быть предусмотрено условие об испытании работника в целях проверки его соответствия поручаемой работе.4) Трудовой договор может быть заключён в устной форме.5) Обязательному предварительному медицинскому осмотру при заключении трудового договора подлежат лица, не достигшие возраста 18 лет.", "answer": "1235", "explanation": "1. Да. Трудовой договор в большинстве случаев заключается на неопределённый срок, такая форма считается основной и применяется, если стороны прямо не указали срок его действия.2. Да. Момент вступления договора в силу определяется датой подписания сторонами, если в документе или в законе не предусмотрено другое правило (например, дата начала работы может быть указана отдельно).3. Да. Условие об испытании может включаться в договор по взаимному соглашению работника и работодателя, и используется для проверки профессиональной пригодности сотрудника.4. Нет. Трудовой договор должен иметь письменную форму; отсутствие письменного оформления не допускается и нарушает требования трудового законодательства.5. Да. Несовершеннолетние обязаны проходить предварительный медицинский осмотр, так как их состояние здоровья требует дополнительной проверки перед допуском к работе, так как законодательство устанавливает повышенную защиту подростков от вредных и опасных условий труда."}, {"n": "Задание № 24", "text": "Выберите верные суждения об особенностях правового регулирования труда несовершеннолетних в Российской Федерации. Запишите цифры, под которыми они указаны.1) Для несовершеннолетних работников испытание при приёме на работу устанавливается сроком на один месяц.2) Заключение трудового договора по общему правилу допускается с лицами, достигшими возраста 16 лет.3) Ежегодный основной оплачиваемый отпуск работникам в возрасте до 18 лет предоставляется продолжительностью 45 календарных дней.4) Лица, не достигшие возраста 18 лет, подлежат обязательному предварительному медицинскому осмотру при заключении трудового договора.5) Для работников в возрасте до 18 лет нормы выработки устанавливаются исходя из общих норм выработки пропорционально установленной для этих работников сокращённой продолжительности рабочего времени.", "answer": "245", "explanation": "1. Нет. Для несовершеннолетних запрещено устанавливать испытательный срок при приёме на работу.2. Да. По общему правилу трудовой договор может быть заключён с лицами, достигшими возраста 16 лет.3. Нет. Ежегодный основной оплачиваемый отпуск для работников в возрасте до 18 лет составляет 31 календарный день.4. Да. Несовершеннолетние обязаны проходить обязательный предварительный медицинский осмотр при заключении трудового договора.5. Да. Нормы выработки для работников до 18 лет устанавливаются пропорционально сокращённой продолжительности их рабочего времени."}, {"n": "Задание № 25", "text": "Установите соответствие между действиями и элементами правового статуса работодателя в соответствии с Трудовым кодексом РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ДЕЙСТВИЯ А) обеспечивать безопасность и условия труда, соответствующие государственным нормативным требованиям охраны трудаБ) привлекать работников к дисциплинарной и материальной ответственности в порядке, установленном закономВ) предоставлять представителям работников полную и достоверную информацию, необходимую для заключения коллективного договора, соглашения и контроля за их выполнениемГ) поощрять работников за добросовестный эффективный трудД) осуществлять обязательное социальное страхование работников в порядке, установленном федеральными законамиЭЛЕМЕНТЫ ПРАВОВОГО СТАТУСА РАБОТОДАТЕЛЯ 1) обязанности2) праваЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "12121", "explanation": "А) обеспечивать безопасность и условия труда, соответствующие государственным нормативным требованиям охраны труда — 1) обязанности Б) привлекать работников к дисциплинарной и материальной ответственности в порядке, установленном законом — 2) права В) предоставлять представителям работников полную и достоверную информацию, необходимую для заключения коллективного договора, соглашения и контроля за их выполнением — 1) обязанности Г) поощрять работников за добросовестный эффективный труд — 2) права Д) осуществлять обязательное социальное страхование работников в порядке, установленном федеральными законами — 1) обязанности"}, {"n": "Задание № 26", "text": "Установите соответствие между ситуациями и основаниями прекращения (расторжения) трудового договора в РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.СИТУАЦИИ А) Пётр Б. был признан полностью неспособным к трудовой деятельности в соответствии с медицинским заключением, выданным в установленном порядке.Б) Григорий Н. неоднократно появлялся на своём рабочем месте в состоянии алкогольного опьянения.В) Евгений М. нашёл более престижную работу.Г) Аттестационная комиссия подтвердила отсутствие у Зои Р. достаточной квалификации для занимаемой должности.Д) 19-летний Василий Ф. был призван на военную службу.ОСНОВАНИЯ ПРЕКРАЩЕНИЯ (РАСТОРЖЕНИЯ) ТРУДОВОГО ДОГОВОРА В РФ 1) инициатива работника2) инициатива работодателя3) обстоятельства, не зависящие от воли сторонЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "32123", "explanation": "А) Пётр Б. был признан полностью неспособным к трудовой деятельности в соответствии с медицинским заключением, выданным в установленном порядке — 3) обстоятельства, не зависящие от воли сторон Б) Григорий Н. неоднократно появлялся на своём рабочем месте в состоянии алкогольного опьянения — 2) инициатива работодателя В) Евгений М. нашёл более престижную работу — 1) инициатива работника Г) Аттестационная комиссия подтвердила отсутствие у Зои Р. достаточной квалификации для занимаемой должности — 2) инициатива работодателя Д) 19-летний Василий Ф. был призван на военную службу — 3) обстоятельства, не зависящие от воли сторон"}, {"n": "Задание № 27", "text": "Установите соответствие между особенностями регулирования трудовых отношений с работниками и разными категориями работников согласно Трудовому кодексу Российской Федерации: к каждому элементу, данному в первом столбце, подберите соответствующий элемент из второго столбца.ОСОБЕННОСТИ РЕГУЛИРОВАНИЯ ТРУДОВЫХ ОТНОШЕНИЙ С РАБОТНИКАМИА) нормальная продолжительность рабочего времени не может превышать 40 часов в неделюБ) при заключении трудового договора в нём по соглашению сторон может быть предусмотрено условие об испытании работника в целях проверки его соответствия поручаемой работеВ) необходимость письменного согласия одного из родителей (попечителя) для заключения трудового договораГ) запрет выполнения работ, которые могут причинить вред здоровью и нравственному развитиюД) право получить ежегодный основной оплачиваемый отпуск на 31 календарный день в удобное времяКАТЕГОРИИ РАБОТНИКОВ1) только 14-летние2) все несовершеннолетние3) совершеннолетние работникиЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "33122", "explanation": "А) нормальная продолжительность рабочего времени не может превышать 40 часов в неделю — 3) совершеннолетние работникиБ) при заключении трудового договора может быть предусмотрено условие об испытании — 3) совершеннолетние работникиВ) необходимость письменного согласия одного из родителей (попечителя) — 1) только 14-летниеГ) запрет выполнения работ, которые могут причинить вред здоровью и нравственному развитию — 2) все несовершеннолетниеД) право получить ежегодный основной оплачиваемый отпуск на 31 календарный день в удобное время — 2) все несовершеннолетние"}, {"n": "Задание № 28", "text": "Выпускник профессионального колледжа Макар нашёл работу по специальности. Для заключения трудового договора он принёс диплом о среднем профессиональном образовании. Какие ещё документы согласно Трудовому кодексу Российской Федерации Макар должен предъявить работодателю? Запишите цифры, под которыми они указаны.1) документы воинского учёта2) копию медицинской карты3) паспорт гражданина Российской Федерации4) налоговое уведомление5) свидетельство о регистрации права собственности на жилое помещение6) документ, подтверждающий регистрацию в системе индивидуального (персонифицированного) учёта, в том числе в форме электронного документа", "answer": "136", "explanation": "1. Да. Документы воинского учёта предъявляются при приёме на работу мужчинами, подлежащими воинскому учёту.2. Нет. Копия медицинской карты не входит в перечень обязательных документов при заключении трудового договора.3. Да. Паспорт гражданина Российской Федерации необходим для удостоверения личности работника.4. Нет. Налоговое уведомление не требуется работодателю при заключении трудового договора.5. Нет. Свидетельство о праве собственности на жильё не относится к числу обязательных документов.6. Да. Документ, подтверждающий регистрацию в системе индивидуального (персонифицированного) учёта (СНИЛС), является обязательным документом, его можно представить в электронной форме."}, {"n": "Задание № 29", "text": "Выберите верные суждения о законодательстве Российской Федерации о налогах и сборах. Запишите цифры, под которыми они указаны.1) Законодательство о налогах и сборах основывается на признании всеобщности и равенства налогообложения.2) Недопустимы налоги и сборы, препятствующие реализации гражданами своих конституционных прав.3) При установлении налогов учитывается профессия налогоплательщика.4) Порядок защиты прав и законных интересов налогоплательщиков (плательщиков сборов, плательщиков страховых взносов) определяется локальными нормативными актами.5) Все неустранимые сомнения, противоречия и неясности актов законодательства о налогах и сборах толкуются в пользу налогоплательщика.", "answer": "125", "explanation": "1. Да. Законодательство о налогах и сборах базируется на принципах всеобщности и равенства налогообложения.2. Да. Налоги не могут ограничивать реализацию конституционных прав граждан.3. Нет. При установлении налогов профессия налогоплательщика не учитывается.4. Нет. Порядок защиты прав налогоплательщиков определяется законодательством Российской Федерации.5. Да. Неустранимые сомнения и противоречия в налоговом законодательстве трактуются в пользу налогоплательщика."}, {"n": "Задание № 30", "text": "Установите соответствие между действиями и элементами статуса налогоплательщика согласно Налоговому кодексу РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ДЕЙСТВИЯ А) уплачивать законно установленные налогиБ) использовать налоговые льготы при наличии оснований и в порядке, установленном законодательством о налогах и сборахВ) получать по месту своего учёта от налоговых органов бесплатную информацию о действующих налогах и сборахГ) встать на учёт в налоговых органах, если это предусмотрено законодательствомД) требовать соблюдения и сохранения налоговой тайныЭЛЕМЕНТЫ СТАТУСА НАЛОГОПЛАТЕЛЬЩИКА1) права2) обязанностиЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "21121", "explanation": "А) уплачивать законно установленные налоги — 2) обязанности Б) использовать налоговые льготы при наличии оснований и в порядке, установленном законодательством о налогах и сборах — 1) права В) получать по месту своего учёта от налоговых органов бесплатную информацию о действующих налогах и сборах — 1) права Г) встать на учёт в налоговых органах, если это предусмотрено законодательством — 2) обязанности Д) требовать соблюдения и сохранения налоговой тайны — 1) права"}, {"n": "Задание № 31", "text": "Установите соответствие между действиями и элементами статусаобучающегося в Российской Федерации: к каждой позиции, данной в первомстолбце, подберите соответствующую позицию из второго столбца.ДЕЙСТВИЯ А) участие в управлении образовательной организацией в порядке, установленном её уставомБ) бережное отношение к имуществу образовательной организацииВ) выбор формы обучения после достижения восемнадцати летГ) обучение по индивидуальному учебному плануД) добросовестное освоение образовательной программыЭЛЕМЕНТЫ СТАТУСА ОБУЧАЮЩЕГОСЯ1) академические права2) обязанностиЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "12112", "explanation": "А) участие в управлении образовательной организацией в порядке, установленном её уставом - 1) академические праваБ) бережное отношение к имуществу образовательной организации - 2) обязанностиВ) выбор формы обучения после достижения восемнадцати лет - 1) академические праваГ) обучение по индивидуальному учебному плану - 1) академические праваД) добросовестное освоение образовательной программы - 2) обязанности"}, {"n": "Задание № 32", "text": "Установите соответствие между действиями и элементами статуса обучающегося в Российской Федерации: к каждому элементу, данному в первом столбце, подберите элемент из второго столбца.ДЕЙСТВИЯ А) перейти в другую образовательную организацию для получения образования по другой профессииБ) уважать честь и достоинство других обучающихсяВ) участвовать в формировании содержания своего профессионального образования при условии соблюдения ФГОСГ) выбирать факультативные учебные предметы, курсы, дисциплины (модули) из перечня, предлагаемого образовательной организацией (после получения основного общего образования)Д) выполнять требования устава образовательной организацииЭЛЕМЕНТЫ СТАТУСА ОБУЧАЮЩЕГОСЯ 1) академические права2) обязанностиЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "12112", "explanation": "А) перейти в другую образовательную организацию для получения образования по другой профессии - 1) академические праваБ) уважать честь и достоинство других обучающихся - 2) обязанностиВ) участвовать в формировании содержания своего профессионального образования при условии соблюдения ФГОС - 1) академические праваГ) выбирать факультативные учебные предметы, курсы, дисциплины (модули) из перечня, предлагаемого образовательной организацией (после получения основного общего образования) - 1) академические праваД) выполнять требования устава образовательной организации - 2) обязанности"}, {"n": "Задание № 33", "text": "Выберите верные суждения об административном праве в Российской Федерации и запишите цифры, под которыми они указаны.1) Административное право имеет один источник, в котором обозначены все виды преступлений как наиболее опасных противоправных проступков.2) Административное право регулирует общественные отношения, возникающие в сфере государственного управления.3) В административных правоотношениях воля одной стороны главенствует над волей другой стороны.4) К наказаниям за нарушения норм административного права относят предупреждение, дисквалификацию.5) К административным наказаниям относят принудительные работы, ограничение свободы.", "answer": "234", "explanation": "1. Нет. Виды преступлений закрепляются уголовным законодательством. Административное право регулирует менее общественно опасные правонарушения.2. Да. Административное право регулирует отношения, возникающие в сфере государственного управления и деятельности органов исполнительной власти. Оно определяет порядок реализации публичных полномочий.3. Да. Административные правоотношения строятся на началах властного подчинения. Одна сторона наделена государственно-властными полномочиями.4. Да. Предупреждение и дисквалификация относятся к видам административных наказаний. Они предусмотрены законодательством об административных правонарушениях.5. Нет. Принудительные работы и ограничение свободы относятся к уголовным наказаниям. В системе административных санкций такие меры не применяются."}, {"n": "Задание № 34", "text": "Выберите верные суждения об административном праве РФ и запишите цифры, под которыми указаны соответствующие положения.1) За совершение административных правонарушений применяются административный арест и конфискация орудия совершения административного проступка.2) Пример нормы административного права: продолжительность ежегодных основного и дополнительных оплачиваемых отпусков исчисляется в календарных днях и максимальным пределом не ограничивается.3) Административное право регулирует имущественные и связанные с ними личные неимущественные отношения.4) Одна из сторон правоотношений, регулируемых административным правом, принимает юридически обязательные решения, осуществляет государственной контроль за действиями другой стороны.5) К видам наказания за административные правонарушения относится предупреждение.", "answer": "145", "explanation": "1. Да. За административные правонарушения могут применяться такие меры наказания, как административный арест и конфискация орудия совершения административного проступка. 2. Нет. Указанное положение относится к трудовому праву, а не к административному. 3. Нет. Административное право регулирует отношения в сфере государственного управления, а имущественные и связанные с ними личные неимущественные отношения регулируются гражданским правом. 4. Да. В административно-правовых отношениях одной из сторон всегда является государственный орган или должностное лицо, которое обладает властными полномочиями и может принимать обязательные для другой стороны решения. 5. Да. Предупреждение является одной из мер административного наказания, предусмотренных Кодексом РФ об административных правонарушениях."}, {"n": "Задание № 35", "text": "Выберите верные суждения об административном праве РФ и запишите цифры, под которыми они указаны.1) К видам наказания за административные правонарушения относятся исправительные работы.2) Административное право регулирует имущественные и личные неимущественные отношения.3) Пример нормы административного права: продолжительность ежегодных основного и дополнительных оплачиваемых отпусков исчисляется в календарных днях и максимальным пределом не ограничивается.4) За совершение административных правонарушений применяются административный арест и конфискация орудия совершения административного проступка.5) Одна из сторон правоотношений, регулируемых административным правом, принимает юридически обязательные решения, осуществляет государственной контроль за действиями второй стороны.", "answer": "45", "explanation": "1. Нет. Исправительные работы относятся к уголовному наказанию, а не к административному.2. Нет. Административное право регулирует отношения в сфере государственного управления, а не имущественные и личные неимущественные отношения, которые регулируются гражданским правом.3. Нет. Норма о продолжительности отпусков относится к трудовому праву, а не к административному.4. Да. За совершение административных правонарушений могут применяться административный арест и конфискация орудия совершения административного проступка.5. Да. Одной из сторон правоотношений, регулируемых административным правом, является орган государственной власти или должностное лицо, которое принимает юридически обязательные решения и осуществляет государственный контроль за действиями другой стороны."}, {"n": "Задание № 36", "text": "Представьте, что Вы помогаете учителю оформить презентацию к уроку обществознания по теме «Юридическая ответственность в Российской Федерации». Один из слайдов называется «Наказания, установленные кодексом Российской Федерации об административных правонарушениях». Что из перечисленного Вы включили бы в этот слайд? Запишите цифры, под которыми указаны административные наказания.1) замечание2) лишение специального права, предоставленного физическому лицу3) предупреждение4) выговор5) обязательные работы6) дисквалификация", "answer": "2356", "explanation": "1. Нет. Замечание относится к мерам дисциплинарной ответственности (трудовое право). 2. Да. Лишение специального права, предоставленного физическому лицу, закреплено в Кодексе об административных правонарушениях. Данная мера применяется, например, в виде лишения права управления транспортным средством.3. Да. Предупреждение является видом административного наказания. Оно выражается в официальном порицании правонарушителя (например, инспектор ГИБДД выдал предупреждение пешеходу, который перебежал дорогу в неположенном месте).4. Нет. Выговор относится к дисциплинарным взысканиям и применяется в сфере трудовых отношений. 5. Да. Обязательные работы предусмотрены КоАП РФ как вид административного наказания. Обязательные работы заключаются в выполнении осужденным в свободное от основной работы или учебы время бесплатных общественно полезных работ. Вид обязательных работ и объекты, на которых они отбываются, определяются органами местного самоуправления по согласованию с уголовно-исполнительными инспекциями.6. Да. Дисквалификация является административным наказанием, связанным с лишением права занимать определённые должности или осуществлять определённую деятельность."}, {"n": "Задание № 37", "text": "Гражданин Российской Федерации Петров припарковал свой автомобиль на детской площадке. Найдите в приведенном списке позиции, соответствующие правовой оценке этих действий и их возможных последствий. Запишите цифры, под которыми они указаны.1) истец2) правонарушение3) гражданское право4) подсудимый5) административное право6) административный штраф", "answer": "256", "explanation": "1. Нет. Истец — это лицо, которое подает иск в суд, требуя защиты своих прав. В данном случае Петров не подает иск, а является нарушителем. Поэтому не является истцом в данном правовом контексте.2. Да. Нарушение правил парковки на детской площадке является правонарушением, так как оно нарушает общественные нормы, регулируемые административным правом. В данном случае Петров нарушил правила, установленные для обеспечения безопасности и удобства детей.3. Нет. Гражданское право регулирует частные правоотношения, такие как сделки, договора и имущество. Нарушение правил парковки на детской площадке — это административное правонарушение, а не гражданский спор.4. Нет. Подсудимый — это лицо, которое обвиняется в совершении уголовного преступления, а не административного правонарушения. В данной ситуации Петров не обвиняется в преступлении, а нарушает административные правила.5. Да. Правила парковки на детских площадках регулируются административным правом, так как это вопрос общественного порядка. Административное право охватывает действия, которые связаны с административными правонарушениями, за которые могут быть предусмотрены штрафы или другие санкции.6. Да. В соответствии с административным правом, нарушение правил парковки может повлечь административное наказание, в том числе штраф. Это является одной из мер воздействия для обеспечения соблюдения правил."}, {"n": "Задание № 38", "text": "Выберите верные суждения о праве человека на благоприятную окружающую среду и запишите цифры, под которыми они указаны.1) К объектам охраны окружающей среды относятся в том числе поверхностные и подземные воды.2) Право человека на благоприятную окружающую среду относится к числу политических прав и свобод.3) Любой гражданин имеет право требовать возмещения ущерба, причинённого его здоровью или имуществу экологическим правонарушением.4) Юридические лица могут быть субъектами экологических правонарушений.5) Основные виды ответственности за совершение экологического преступления перечислены в Гражданском кодексе РФ.", "answer": "134", "explanation": "1. Да. К объектам охраны окружающей среды относятся не только поверхностные и подземные воды, но и другие природные ресурсы, такие как воздух, почва, флора и фауна.2. Нет. Право человека на благоприятную окружающую среду относится к числу социальных прав и свобод, а не политических. Оно гарантируется Конституцией РФ и другими законодательными актами.3. Да. Каждый гражданин может требовать возмещения ущерба, причинённого его здоровью или имуществу экологическим правонарушением, в соответствии с законодательством, включая возможность подачи иска в суд.4. Да. Юридические лица могут быть субъектами экологических правонарушений и несут ответственность за экологические преступления, как и физические лица.5. Нет. Основные виды ответственности за экологические преступления, включая штрафы, конфискацию имущества и лишение свободы, регулируются Уголовным кодексом РФ, а не Гражданским."}, {"n": "Задание № 39", "text": "Выберите верные суждения об экологическом праве в Российской Федерации и запишите цифры, под которыми они указаны.1) Экологическое правонарушение причиняет экологический вред или создаёт реальную угрозу причинения такого вреда компонентам природной среды, природным объектам и природным комплексам.2) Экологическая информация общедоступна, за исключением информации, отнесённой законодательством Российской Федерации к государственной тайне.3) Согласно законодательству благоприятная окружающая среда — окружающая среда, качество которой обеспечивает успешную социализацию личности в профессиональной сфере.4) Граждане обязаны выдвигать предложения о проведении общественной экологической экспертизы и участвовать в её проведении в установленном порядке.5) Один из принципов охраны окружающей среды — обязательность оценки воздействия на окружающую среду при принятии решений об осуществлении хозяйственной и иной деятельности.", "answer": "125", "explanation": "1. Да. Экологическое правонарушение действительно причиняет экологический вред или создаёт реальную угрозу причинения такого вреда компонентам природной среды, природным объектам и природным комплексам.2. Да. Согласно закону экологическая информация является общедоступной, к которой не может быть ограничен доступ, за исключением информации, отнесённой законодательством Российской Федерации к государственной тайне.3. Нет. Благоприятная окружающая среда — это окружающая среда, качество которой обеспечивает устойчивое функционирование естественных экологических систем, природных и природно-антропогенных объектов.4. Нет. Граждане имеют право, но не обязаны. Участие граждан в таких процессах носит добровольный характер.5. Да. Это требование закреплено в экологическом законодательстве для предотвращения негативных последствий человеческой деятельности."}, {"n": "Задание № 40", "text": "Установите соответствие между действиями по охране окружающей среды и элементами правового статуса гражданина РФ: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.ДЕЙСТВИЯ ПО ОХРАНЕ ОКРУЖАЮЩЕЙ СРЕДЫ А) бережно относиться к природным богатствамБ) направлять обращения в органы местного самоуправленияВ) выдвигать предложения о проведении экологической общественной экспертизы и участвовать в её проведенииГ) принимать участие в собраниях и митингах по вопросу окружающей средыД) сохранять природу и окружающую средуЭЛЕМЕНТЫ ПРАВОВОГО СТАТУСА ГРАЖДАНИНА РФ 1) права2) обязанностиЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "21112", "explanation": "А. бережно относиться к природным богатствам — 2. обязанностиБ. направлять обращения в органы местного самоуправления — 1. праваВ. выдвигать предложения о проведении экологической общественной экспертизы и участвовать в её проведении — 1. праваГ. принимать участие в собраниях и митингах по вопросу окружающей среды — 1. праваД. сохранять природу и окружающую среду — 2. обязанности"}, {"n": "Задание № 41", "text": "Выберите верные суждения об уголовной ответственности в РФ и запишите цифры, под которыми указаны соответствующие положения. 1) Уголовная ответственность является правовым последствием совершения преступления.2) В соответствии с Трудовым кодексом РФ работник, регулярно опаздывающий к началу рабочего дня, может быть привлечен к уголовной ответственности.3) Уголовная ответственность применяется в целях восстановления социальной справедливости, а также исправления осужденного и предупреждения совершения им новых преступлений.4) В соответствии с Уголовным кодексом РФ к уголовным наказаниям относятся штраф, обязательные работы, арест, лишение свободы на определенный срок и др.5) Уголовной ответственности по общему правилу подлежит лицо, достигшее ко времени совершения преступления 16-летнего возраста.", "answer": "1345", "explanation": "1. Да. Уголовная ответственность является правовым последствием совершения преступления, когда нарушение уголовного закона влечет применение уголовного наказания.2. Нет. Регулярное опоздание к началу рабочего дня является нарушением трудовой дисциплины, а не преступлением, поэтому оно не может привести к уголовной ответственности.3. Да. Уголовная ответственность направлена на восстановление социальной справедливости, исправление осужденного и предотвращение новых преступлений.4. Да. К уголовным наказаниям, согласно Уголовному кодексу РФ, относятся штраф, обязательные работы, арест, лишение свободы и другие меры, в зависимости от тяжести преступления.5. Да. По общему правилу, к уголовной ответственности привлекаются лица, достигшие 16 лет на момент совершения преступления, если их действия подпадают под определение преступления."}, {"n": "Задание № 42", "text": "Представьте, что Вы помогаете учителю оформить презентацию к уроку обществознания по теме «Юридическая ответственность в Российской Федерации». Один из слайдов называется «Уголовные наказания, установленные Уголовным кодексом Российской Федерации». Что из перечисленного Вы включили бы в этот слайд? Запишите цифры, под которыми указаны уголовные наказания.1) штраф2) обязательные работы3) предупреждение4) ограничение свободы5) исправительные работы6) лишение специального права, предоставленного физическому лицу", "answer": "1245", "explanation": "1. Да. Штраф является видом уголовного наказания.2. Да. Обязательные работы входят в перечень уголовных наказаний и заключаются в выполнении осужденным в свободное от основной работы или учебы время бесплатных общественно полезных работ.3. Нет. Предупреждение является мерой административной ответственности (КоАП РФ), а не уголовной.4. Да. Ограничение свободы — это вид уголовного наказания, который заключается в установлении судом осужденному определенных ограничений (например, запрет на выход из дома в определенное время) без изоляции от общества.5. Да. Исправительные работы являются видом уголовного наказания и назначаются осужденному как по месту его работы, так и в местах, определяемых органами местного самоуправления.6. Нет. Лишение специального права, предоставленного физическому лицу (например, права управления транспортным средством), относится к мерам административного наказания (КоАП РФ). В Уголовном кодексе предусмотрено «лишение права занимать определенные должности или заниматься определенной деятельностью»."}, {"n": "Задание № 43", "text": "Выберите верные суждения о гражданском судопроизводстве в РФ и запишите цифры, под которыми они указаны.1) Гражданское судопроизводство ведётся в соответствии с федеральными законами, действующими во время рассмотрения и разрешения гражданского дела.2) Основная задача гражданского судопроизводства – эффективное наказание лица, совершившего преступление.3) Сторонами в гражданском судопроизводстве являются истец и ответчик.4) Результатом гражданского судопроизводства является приговор подсудимому.5) Стороны в гражданском судопроизводстве пользуются равными процессуальными правами и несут равные процессуальные обязанности.", "answer": "135", "explanation": "1. Да. Гражданское судопроизводство осуществляется согласно федеральным законам, имеющим силу в момент разбирательства дела, совершения отдельных процессуальных действий или исполнения судебных актов.2. Нет. Назначение наказания за совершение преступления относится к целям уголовного процесса. Гражданское судопроизводство направлено на правильное рассмотрение и разрешение дел для защиты нарушенных прав и свобод граждан или организаций.3. Да. В гражданском процессе сторонами выступают истец, предъявляющий требования, и ответчик, к которому данные требования обращены.4. Нет. Приговор выносится только по итогам уголовного разбирательства. Суд по результатам гражданского дела принимает решение.5. Да. Гражданское процессуальное законодательство закрепляет равенство сторон. Истец и ответчик обладают одинаковыми возможностями защищать свои интересы, представлять доказательства и обязаны соблюдать установленный порядок."}, {"n": "Задание № 44", "text": "Совершеннолетние трудоспособные дети нетрудоспособного Аркадия Ниловича шесть лет не проявляли заботы о нем, он подал на них в суд. Найдите в приведенном списке позиции, соответствующие правовому решению описанного конфликта, и запишите цифры, под которыми они указаны.1) потерпевший2) конституционное судопроизводство3) истец4) уголовное судопроизводство5) ответчик6) гражданское судопроизводство", "answer": "356", "explanation": "1. Нет. Потерпевший - процессуальный статус в сфере уголовного судопроизводства.2. Нет. Конституционное судопроизводство регулирует вопросы соответствия нормативных актов Конституции РФ, что не относится к данному случаю.3. Да. Аркадий Нилович является истцом, так как он подал иск в суд.4. Нет. Уголовное судопроизводство регулирует вопросы уголовного преследования, что не относится к данному случаю.5. Да. Дети Аркадия Ниловича являются ответчиками, так как против них был подан иск.6. Да. Данный конфликт относится к гражданскому судопроизводству, так как регулирует имущественные и личные неимущественные отношения между гражданами."}, {"n": "Задание № 45", "text": "Выберите верные суждения об административной юрисдикции в Российской Федерации и запишите цифры, под которыми они указаны.1) Административная юрисдикция – это установленная нормами права деятельность органов государственного управления и их должностных лиц по разрешению индивидуальных административных дел и применению соответствующих юридических санкций в административном порядке.2) К административным наказаниям относят исправительные и принудительные работы.3) Административную юрисдикцию могут осуществлять только органы внутренних дел (полиция).4) Производство по делу об административном правонарушении проходит несколько стадий: возбуждение дела, подготовка к рассмотрению, рассмотрение, вынесение и оглашение решения, исполнение.5) К субъектам административных правонарушений применяются наказания менее суровые, чем уголовные наказания.", "answer": "145", "explanation": "1. Да. Административная юрисдикция включает деятельность органов государственного управления по разрешению административных дел и применению санкций. 2. Нет. Исправительные и принудительные работы являются видами уголовного наказания, а не административного. 3. Нет. Административную юрисдикцию осуществляют не только органы внутренних дел, но и другие уполномоченные органы, такие как суды, таможенные, налоговые и иные органы. 4. Да. Производство по делу об административном правонарушении проходит несколько стадий, включая возбуждение дела, подготовку, рассмотрение, вынесение решения и его исполнение. 5. Да. Административные наказания менее суровы, чем уголовные, так как не предусматривают лишение свободы, а включают штрафы, предупреждения, дисквалификацию и другие меры."}, {"n": "Задание № 46", "text": "Ниже приведён перечень мер. Все они, за исключением двух, согласно Уголовно-процессуальному кодексу Российской Федерации относятся к мерам пресечения.1) дисквалификация; 2) домашний арест; 3) лишение специального, воинского или почётного звания, классного чина и государственных наград; 4) заключение под стражу; 5) подписка о невыезде; 6) залог.Найдите две меры, «выпадающие» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", "answer": "13", "explanation": "1. Дисквалификация — это вид административного наказания, заключающийся в лишении физического лица права занимать руководящие должности или осуществлять определенную деятельность; не относится к мерам пресечения в уголовном процессе.2. Домашний арест — мера пресечения, заключающаяся в изоляции подозреваемого или обвиняемого от общества в жилом помещении, в котором он проживает, с возложением запретов и осуществлением за ним контроля.3. Лишение специального, воинского или почётного звания, классного чина и государственных наград — вид дополнительного уголовного наказания, которое может быть назначено судом при осуждении за совершение тяжкого или особо тяжкого преступления.4. Заключение под стражу — самая строгая мера пресечения, состоящая в принудительном содержании подозреваемого или обвиняемого в условия
