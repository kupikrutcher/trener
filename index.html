 участие в собраниях и митингах по вопросу окружающей средыД) сохранять природу и окружающую средуЭЛЕМЕНТЫ ПРАВОВОГО СТАТУСА ГРАЖДАНИНА РФ 1) права2) обязанностиЗапишите в таблицу выбранные цифры под соответствующими буквами.", "answer": "21112", "explanation": "А. бережно относиться к природным богатствам — 2. обязанностиБ. направлять обращения в органы местного самоуправления — 1. праваВ. выдвигать предложения о проведении экологической общественной экспертизы и участвовать в её проведении — 1. праваГ. принимать участие в собраниях и митингах по вопросу окружающей среды — 1. праваД. сохранять природу и окружающую среду — 2. обязанности"}, {"n": "Задание № 41", "text": "Выберите верные суждения об уголовной ответственности в РФ и запишите цифры, под которыми указаны соответствующие положения. 1) Уголовная ответственность является правовым последствием совершения преступления.2) В соответствии с Трудовым кодексом РФ работник, регулярно опаздывающий к началу рабочего дня, может быть привлечен к уголовной ответственности.3) Уголовная ответственность применяется в целях восстановления социальной справедливости, а также исправления осужденного и предупреждения совершения им новых преступлений.4) В соответствии с Уголовным кодексом РФ к уголовным наказаниям относятся штраф, обязательные работы, арест, лишение свободы на определенный срок и др.5) Уголовной ответственности по общему правилу подлежит лицо, достигшее ко времени совершения преступления 16-летнего возраста.", "answer": "1345", "explanation": "1. Да. Уголовная ответственность является правовым последствием совершения преступления, когда нарушение уголовного закона влечет применение уголовного наказания.2. Нет. Регулярное опоздание к началу рабочего дня является нарушением трудовой дисциплины, а не преступлением, поэтому оно не может привести к уголовной ответственности.3. Да. Уголовная ответственность направлена на восстановление социальной справедливости, исправление осужденного и предотвращение новых преступлений.4. Да. К уголовным наказаниям, согласно Уголовному кодексу РФ, относятся штраф, обязательные работы, арест, лишение свободы и другие меры, в зависимости от тяжести преступления.5. Да. По общему правилу, к уголовной ответственности привлекаются лица, достигшие 16 лет на момент совершения преступления, если их действия подпадают под определение преступления."}, {"n": "Задание № 42", "text": "Представьте, что Вы помогаете учителю оформить презентацию к уроку обществознания по теме «Юридическая ответственность в Российской Федерации». Один из слайдов называется «Уголовные наказания, установленные Уголовным кодексом Российской Федерации». Что из перечисленного Вы включили бы в этот слайд? Запишите цифры, под которыми указаны уголовные наказания.1) штраф2) обязательные работы3) предупреждение4) ограничение свободы5) исправительные работы6) лишение специального права, предоставленного физическому лицу", "answer": "1245", "explanation": "1. Да. Штраф является видом уголовного наказания.2. Да. Обязательные работы входят в перечень уголовных наказаний и заключаются в выполнении осужденным в свободное от основной работы или учебы время бесплатных общественно полезных работ.3. Нет. Предупреждение является мерой административной ответственности (КоАП РФ), а не уголовной.4. Да. Ограничение свободы — это вид уголовного наказания, который заключается в установлении судом осужденному определенных ограничений (например, запрет на выход из дома в определенное время) без изоляции от общества.5. Да. Исправительные работы являются видом уголовного наказания и назначаются осужденному как по месту его работы, так и в местах, определяемых органами местного самоуправления.6. Нет. Лишение специального права, предоставленного физическому лицу (например, права управления транспортным средством), относится к мерам административного наказания (КоАП РФ). В Уголовном кодексе предусмотрено «лишение права занимать определенные должности или заниматься определенной деятельностью»."}, {"n": "Задание № 43", "text": "Выберите верные суждения о гражданском судопроизводстве в РФ и запишите цифры, под которыми они указаны.1) Гражданское судопроизводство ведётся в соответствии с федеральными законами, действующими во время рассмотрения и разрешения гражданского дела.2) Основная задача гражданского судопроизводства – эффективное наказание лица, совершившего преступление.3) Сторонами в гражданском судопроизводстве являются истец и ответчик.4) Результатом гражданского судопроизводства является приговор подсудимому.5) Стороны в гражданском судопроизводстве пользуются равными процессуальными правами и несут равные процессуальные обязанности.", "answer": "135", "explanation": "1. Да. Гражданское судопроизводство осуществляется согласно федеральным законам, имеющим силу в момент разбирательства дела, совершения отдельных процессуальных действий или исполнения судебных актов.2. Нет. Назначение наказания за совершение преступления относится к целям уголовного процесса. Гражданское судопроизводство направлено на правильное рассмотрение и разрешение дел для защиты нарушенных прав и свобод граждан или организаций.3. Да. В гражданском процессе сторонами выступают истец, предъявляющий требования, и ответчик, к которому данные требования обращены.4. Нет. Приговор выносится только по итогам уголовного разбирательства. Суд по результатам гражданского дела принимает решение.5. Да. Гражданское процессуальное законодательство закрепляет равенство сторон. Истец и ответчик обладают одинаковыми возможностями защищать свои интересы, представлять доказательства и обязаны соблюдать установленный порядок."}, {"n": "Задание № 44", "text": "Совершеннолетние трудоспособные дети нетрудоспособного Аркадия Ниловича шесть лет не проявляли заботы о нем, он подал на них в суд. Найдите в приведенном списке позиции, соответствующие правовому решению описанного конфликта, и запишите цифры, под которыми они указаны.1) потерпевший2) конституционное судопроизводство3) истец4) уголовное судопроизводство5) ответчик6) гражданское судопроизводство", "answer": "356", "explanation": "1. Нет. Потерпевший - процессуальный статус в сфере уголовного судопроизводства.2. Нет. Конституционное судопроизводство регулирует вопросы соответствия нормативных актов Конституции РФ, что не относится к данному случаю.3. Да. Аркадий Нилович является истцом, так как он подал иск в суд.4. Нет. Уголовное судопроизводство регулирует вопросы уголовного преследования, что не относится к данному случаю.5. Да. Дети Аркадия Ниловича являются ответчиками, так как против них был подан иск.6. Да. Данный конфликт относится к гражданскому судопроизводству, так как регулирует имущественные и личные неимущественные отношения между гражданами."}, {"n": "Задание № 45", "text": "Выберите верные суждения об административной юрисдикции в Российской Федерации и запишите цифры, под которыми они указаны.1) Административная юрисдикция – это установленная нормами права деятельность органов государственного управления и их должностных лиц по разрешению индивидуальных административных дел и применению соответствующих юридических санкций в административном порядке.2) К административным наказаниям относят исправительные и принудительные работы.3) Административную юрисдикцию могут осуществлять только органы внутренних дел (полиция).4) Производство по делу об административном правонарушении проходит несколько стадий: возбуждение дела, подготовка к рассмотрению, рассмотрение, вынесение и оглашение решения, исполнение.5) К субъектам административных правонарушений применяются наказания менее суровые, чем уголовные наказания.", "answer": "145", "explanation": "1. Да. Административная юрисдикция включает деятельность органов государственного управления по разрешению административных дел и применению санкций. 2. Нет. Исправительные и принудительные работы являются видами уголовного наказания, а не административного. 3. Нет. Административную юрисдикцию осуществляют не только органы внутренних дел, но и другие уполномоченные органы, такие как суды, таможенные, налоговые и иные органы. 4. Да. Производство по делу об административном правонарушении проходит несколько стадий, включая возбуждение дела, подготовку, рассмотрение, вынесение решения и его исполнение. 5. Да. Административные наказания менее суровы, чем уголовные, так как не предусматривают лишение свободы, а включают штрафы, предупреждения, дисквалификацию и другие меры."}, {"n": "Задание № 46", "text": "Ниже приведён перечень мер. Все они, за исключением двух, согласно Уголовно-процессуальному кодексу Российской Федерации относятся к мерам пресечения.1) дисквалификация; 2) домашний арест; 3) лишение специального, воинского или почётного звания, классного чина и государственных наград; 4) заключение под стражу; 5) подписка о невыезде; 6) залог.Найдите две меры, «выпадающие» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", "answer": "13", "explanation": "1. Дисквалификация — это вид административного наказания, заключающийся в лишении физического лица права занимать руководящие должности или осуществлять определенную деятельность; не относится к мерам пресечения в уголовном процессе.2. Домашний арест — мера пресечения, заключающаяся в изоляции подозреваемого или обвиняемого от общества в жилом помещении, в котором он проживает, с возложением запретов и осуществлением за ним контроля.3. Лишение специального, воинского или почётного звания, классного чина и государственных наград — вид дополнительного уголовного наказания, которое может быть назначено судом при осуждении за совершение тяжкого или особо тяжкого преступления.4. Заключение под стражу — самая строгая мера пресечения, состоящая в принудительном содержании подозреваемого или обвиняемого в условиях изоляции от общества в специально предназначенных для этого местах (СИЗО).5. Подписка о невыезде и надлежащем поведении — мера пресечения, состоящая в письменном обязательстве лица не покидать место жительства без разрешения, являться по вызовам и не препятствовать производству по делу.6. Залог — мера пресечения, заключающаяся в передаче подозреваемым, обвиняемым либо другим лицом в орган, осуществляющий производство по делу, имущества или денег в целях обеспечения явки и надлежащего поведения."}, {"n": "Задание № 47", "text": "Выберите верные суждения о нормах уголовно-процессуального права в Российской Федерации и запишите цифры, под которыми они указаны.1) Уголовное судопроизводство ведётся только на родном языке потерпевшего. 2) Функции обвинения, защиты и разрешения уголовного дела могут быть возложены на одно и то же должностное лицо. 3) Обвинительный приговор может быть основан на предположениях. 4) Уголовное судопроизводство имеет своим назначением защиту личности от незаконного и необоснованного обвинения, осуждения, ограничения её прав и свобод. 5) Судьи рассматривают и разрешают уголовные дела в условиях, исключающих постороннее воздействие на них.", "answer": "45", "explanation": "1. Нет. Уголовное судопроизводство ведётся на русском языке, а если участник не владеет русским языком, ему предоставляется переводчик.2. Нет. Функции обвинения, защиты и разрешения уголовного дела разделены и не могут быть возложены на одно и то же должностное лицо.3. Нет. Обвинительный приговор не может быть основан на предположениях. Он требует подтверждения и доказательств.4. Да. Уголовное судопроизводство имеет своим назначением защиту личности от незаконного и необоснованного обвинения, осуждения, ограничения её прав и свобод.5. Да. Судьи рассматривают и разрешают уголовные дела в условиях, исключающих постороннее воздействие на них."}, {"n": "Задание № 48", "text": "Выберите верные суждения о нормах уголовно-процессуального права в Российской Федерации и запишите цифры, под которыми они указаны.1) Определения суда должны быть законными, обоснованными и мотивированными,2) Обвинительный приговор может быть основан на предположениях.3) Лицо, которое задержано по подозрению в совершении преступления, должно содержаться в условиях, исключающих угрозу его жизни и здоровью.4) Функции обвинения, защиты и разрешения уголовного дела могут быть возложены на одно и то же должностное лицо.5) В ходе судебного производства по уголовному делу адвокат поддерживает государственное обвинение, обеспечивая его законность и обоснованность", "answer": "13", "explanation": "1. Да. Все решения суда (включая определения и постановления), а также решения судьи, прокурора и следователя должны быть законными, обоснованными и мотивированными.2. Нет. Обвинительный приговор не может быть основан на предположениях. Он постановляется лишь при условии, что в ходе судебного разбирательства виновность подсудимого в совершении преступления подтверждена совокупностью исследованных судом доказательств.3. Да. При осуществлении правосудия по уголовным делам никто не должен подвергаться насилию, пыткам, другому жестокому или унижающему человеческое достоинство обращению. Лицо, задержанное по подозрению в преступлении, должно содержаться в условиях, исключающих угрозу его жизни и здоровью.4. Нет. В уголовном судопроизводстве функции обвинения, защиты и разрешения уголовного дела отделены друг от друга и не могут быть возложены на одно и то же должностное лицо или один и тот же орган. 5. Нет. Государственное обвинение в суде поддерживает прокурор. Адвокат (защитник) представляет интересы подсудимого, обеспечивая реализацию его права на защиту и оспаривая доводы обвинения."}, {"n": "Задание № 49", "text": "Установите соответствие между субъектами и участниками уголовного судопроизводства (согласно Уголовно-процессуальному кодексу Российской Федерации): к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.СУБЪЕКТЫА) экспертБ) прокурорВ) обвиняемыйГ) следовательД) свидетельУЧАСТНИКИ УГОЛОВНОГО СУДОПРОИЗВОДСТВА1) сторона защиты2) сторона обвинения3) иные участникиЗапишите в таблицу выбранные цифры под соответствующими буквами", "answer": "32123", "explanation": "А) эксперт — 3) иные участникиБ) прокурор — 2) сторона обвиненияВ) обвиняемый — 1) сторона защитыГ) следователь — 2) сторона обвиненияД) свидетель — 3) иные участники"}, {"n": "Задание № 50", "text": "Установите соответствие между участниками уголовного судопроизводства и стороной, которую он представляет: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.УЧАСТНИКИ УГОЛОВНОГО СУДОПРОИЗВОДСТВА А) подозреваемыйБ) прокурорВ) адвокатГ) потерпевшийД) обвиняемыйСТОРОНЫ УГОЛОВНОГО СУДОПРОИЗВОДСТВА 1) обвинение2) защита", "answer": "21212", "explanation": "А. подозреваемый - 2. защитаБ. прокурор - 1. обвинениеВ. адвокат - 2. защитаГ. потерпевший - 1. обвинениеД. обвиняемый - 2. защита"}]}];
let tests=[];

const $=s=>document.querySelector(s);

/* ---- theme ---- */
const THEMES=['paper','night','sepia','forest'];
function setTheme(t){
  if(THEMES.indexOf(t)<0) t='paper';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('tr_theme',t)}catch(e){}
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===t));
}
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));
(function(){let t='paper';try{t=localStorage.getItem('tr_theme')||'paper'}catch(e){}setTheme(t)})();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---- tests storage ---- */
function loadTests(){
  tests=BUILTINS.map((t,i)=>({id:'b'+i,name:t.name,builtin:true,questions:t.questions}));
  try{
    const raw=localStorage.getItem('tr_tests');
    if(raw){JSON.parse(raw).forEach(t=>{if(t&&t.questions&&t.questions.length)tests.push({id:t.id,name:t.name,questions:t.questions})})}
  }catch(e){}
}
function saveTests(){
  try{localStorage.setItem('tr_tests', JSON.stringify(tests.filter(t=>!t.builtin)));}
  catch(e){toast('Не удалось сохранить (память браузера переполнена)')}
}

/* ---- helpers ---- */
function norm(s){return (s||'').replace(/\D/g,'')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function plural(n){const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'задание':(a>=2&&a<=4&&(b<10||b>=20)?'задания':'заданий'))}

function qType(t){
  if(/соответстви/i.test(t)) return 'Соответствие';
  if(/выберите верные суждения/i.test(t)) return 'Выбор суждений';
  if(/найдите|какие|что из|перечн/i.test(t)) return 'Несколько ответов';
  return 'Краткий ответ';
}
function fmtQ(t){
  let s=esc(t);
  s=s.replace(/\s*(ХАРАКТЕРИСТИКИ|ИСТОЧНИКИ[^0-9А-ЯЁ]*\([^)]*\)|ИСТОЧНИКИ[^0-9]*|ВИДЫ[^0-9]*|ПРОСТУПКИ|ПРИМЕРЫ|ДЕЙСТВИЯ[^0-9]*|МЕРЫ[^0-9]*|СИТУАЦИИ|ОСНОВАНИЯ[^0-9]*|КАТЕГОРИИ[^0-9]*|ЭЛЕМЕНТЫ[^0-9]*|ОРГАНИЗАЦИОННО[^0-9]*|СУБЪЕКТЫ|УЧАСТНИКИ[^0-9]*|СТОРОНЫ[^0-9]*|ПРАВОМОЧИЯ[^0-9]*)\s*/g,
    m=>'</span><span class="hdr">'+m.trim()+'</span><span class="lead">');
  s=s.replace(/\s*(\d{1,2}\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*([А-Д]\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*(Запишите[^]*)$/,'</span><span class="ins">$1');
  s='<span class="lead">'+s+'</span>';
  s=s.replace(/<span class="[a-z]+">\s*<\/span>/g,'');
  return s;
}
function fmtExpl(t){
  let s=esc(t).replace(/\s+/g,' ').trim();
  const letterMode=(s.match(/[АБВГД][.)]/g)||[]).length>=3;
  if(letterMode){
    s=s.replace(/\s*([АБВГД][.)])\s*/g,'</div><div class="epoint">$1 ');
  }else{
    s=s.replace(/(^|[\s.;:»)\]])(\d{1,2}[.)])\s+/g,'$1</div><div class="epoint">$2 ');
  }
  s='<div class="epoint">'+s+'</div>';
  s=s.replace(/<div class="epoint">\s*<\/div>/g,'');
  return s;
}

  app.innerHTML=`
    <div class="home">
      <h1>Тесты</h1>
      <p class="sub">Выбери тест или добавь свой. Имя теста = имя файла.</p>
      ${tests.length?`<div class="tlist">${cards}</div>`:`<div class="empty">Пока нет тестов.<br>Добавь CSV-файл, чтобы начать.</div>`}
      <button class="btn ghost" onclick="document.getElementById('file').click()">+ Добавить тесты (CSV)</button>
      <div class="note">Можно выбрать сразу несколько файлов. Формат CSV: «Номер задания», «Текст вопроса и варианты ответа», «Правильный ответ», «Пояснение».</div>
    </div>`;
}

function openTest(id){
  const t=tests.find(x=>x.id===id); if(!t)return;
  bank=t.questions; curName=t.name; curBase=t.name; begin();
}
function removeTest(id){
  tests=tests.filter(t=>t.id!==id); saveTests(); home();
}
function startMistakes(){
  if(!lastWrong.length){toast('Ошибок нет');return}
  bank=lastWrong.slice(); curName=curBase+' · работа над ошибками'; begin();
}

function begin(){idx=0;score=0;results=[];render()}

function bars(){
  $('#bars').style.display='block';
  $('#tot').textContent=bank.length;
  $('#cur').textContent=Math.min(idx+1,bank.length);
  $('#scr').textContent=score;
  $('#pbar').style.width=(idx/bank.length*100)+'%';
}

function render(){
  if(idx>=bank.length) return finish();
  answered=false;
  const q=bank[idx];
  bars();
  $('#foot').textContent=curName;
  app.className='panel fade';
  app.innerHTML=`
    <div class="qhead">
      <span class="qnum">${esc(q.n||('Задание '+(idx+1)))}</span>
      <span class="qtype">${qType(q.text)}</span>
    </div>
    <div class="qtext">${fmtQ(q.text)}</div>
    <div class="az">
      <label class="lab" for="inp">Твой ответ — только цифры</label>
      <input id="inp" class="field" inputmode="numeric" autocomplete="off" placeholder="Ты точно знаешь правильный ответ">
      <button class="btn" id="check" onclick="check()">Проверить</button>
      <button class="linkfin" onclick="finishEarly()">Завершить тест</button>
    </div>
    <div class="verdict" id="verdict"></div>`;
  const inp=$('#inp'); inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answered?next():check()}});
}

function check(){
  if(answered) return;
  const q=bank[idx], inp=$('#inp'), user=norm(inp.value);
  if(!user){inp.classList.add('wrong');setTimeout(()=>inp.classList.remove('wrong'),360);toast('Введи ответ');return}
  answered=true;
  const ok=user===norm(q.answer);
  if(ok) score++;
  results.push({q,n:q.n,user,answer:norm(q.answer),ok});
  inp.classList.add(ok?'good':'wrong'); inp.readOnly=true;
  $('#scr').textContent=score;
  $('#check').outerHTML=`<button class="btn" onclick="next()">${idx+1<bank.length?'Дальше':'Результат'}</button>`;
  const v=$('#verdict');
  v.className='verdict show '+(ok?'ok':'bad');
  v.innerHTML=`
    <div class="vrow"><span class="vdot">${ok?'✓':'✕'}</span>${ok?'Верно':'Неверно'}</div>
    ${ok?'':`<div class="cline">Правильный ответ:<b>${esc(q.answer)}</b></div>`}
    ${q.explanation?`<button class="etog" onclick="tog(this)">Скрыть разбор</button>
      <div class="expl open"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}`;
  setTimeout(()=>{if(v.scrollIntoView)v.scrollIntoView({behavior:'smooth',block:'nearest'})},120);
}
function tog(b){const e=b.nextElementSibling;e.classList.toggle('open');
  b.textContent=e.classList.contains('open')?'Скрыть разбор':'Показать разбор'}
function next(){idx++;render()}

/* ---- result chart (correct vs wrong + работа над ошибками) ---- */
function resultChart(correct,wrong,total){
  const C=2*Math.PI*66;
  const okLen=total?C*correct/total:0, badLen=total?C*wrong/total:0;
  const p=total?Math.round(correct/total*100):0;
  const undone=total-correct-wrong;
  return `
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle class="bgc" cx="75" cy="75" r="66" fill="none" stroke-width="10"/>
        <circle class="seg seg-ok" id="segok" cx="75" cy="75" r="66" fill="none" stroke-width="10"
          stroke-linecap="butt" stroke-dasharray="0 ${C}"/>
        <circle class="seg seg-bad" id="segbad" cx="75" cy="75" r="66" fill="none" stroke-width="10"
          stroke-linecap="butt" stroke-dasharray="0 ${C}" stroke-dashoffset="${-okLen}"/>
      </svg>
      <div class="lab"><b>${correct}<i>/${total}</i></b><span>${p}% верно</span></div>
    </div>
    <div class="resbreak">
      <div class="resbox okbox"><b>${correct}</b><span>верно</span></div>
      ${wrong>0
        ? `<div class="resbox errbox" onclick="startMistakes()"><b>${wrong}</b><span>работа над ошибками →</span></div>`
        : `<div class="resbox donebox"><b>✓</b><span>ошибок нет</span></div>`}
    </div>
    ${undone>0?`<div class="resnote">Не решено: ${undone} из ${total}</div>`:''}`;
}
function animChart(correct,wrong,total){
  const C=2*Math.PI*66;
  const okLen=total?C*correct/total:0, badLen=total?C*wrong/total:0;
  setTimeout(()=>{
    const so=$('#segok'), sb=$('#segbad');
    if(so) so.setAttribute('stroke-dasharray', okLen+' '+(C-okLen));
    if(sb) sb.setAttribute('stroke-dasharray', badLen+' '+(C-badLen));
  },150);
}

function grade(p){
  if(p>=90) return ['Отлично','Материал ты знаешь уверенно.'];
  if(p>=75) return ['Хорошо','Крепкий результат — почти идеал.'];
  if(p>=50) return ['Неплохо','База есть, слабые темы стоит повторить.'];
  return ['Нужно повторить','Пройди материал ещё раз и попробуй снова.'];
}

/* full completion */
function finish(){
  $('#pbar').style.width='100%'; $('#cur').textContent=bank.length;
  const total=bank.length, correct=score, wrong=results.filter(r=>!r.ok).length;
  lastWrong=results.filter(r=>!r.ok).map(r=>r.q);
  const p=Math.round(correct/total*100), gr=grade(p), g=gr[0], gs=gr[1];
  app.className='panel fade';
  app.innerHTML=`
    ${resultChart(correct,wrong,total)}
    <div class="gtitle">${g}</div>
    <div class="gsub">${esc(curName)} · ${gs}</div>
    <div class="rrow">
      <button class="btn" onclick="openTest2()">Решать заново</button>
      <button class="btn ghost" onclick="home()">К тестам</button>
    </div>
    <button class="linkfin" onclick="finishEarly()">Показать все задания с ответами</button>`;
  animChart(correct,wrong,total);
}
/* restart current base test from scratch */
function openTest2(){ bank = tests.find(t=>t.name===curBase)?tests.find(t=>t.name===curBase).questions:bank; curName=curBase; begin(); }

/* early finish: chart + all questions + answers + explanation toggles */
function finishEarly(){
  $('#bars').style.display='none';
  const total=bank.length, correct=results.filter(r=>r.ok).length, wrong=results.filter(r=>!r.ok).length;
  lastWrong=results.filter(r=>!r.ok).map(r=>r.q);
  app.className='panel fade';
  const items=bank.map((q,i)=>`
    <div class="allitem">
      <div class="qhead">
        <span class="qnum">${esc(q.n||('Задание '+(i+1)))}</span>
        <span class="qtype">${qType(q.text)}</span>
      </div>
      <div class="qtext">${fmtQ(q.text)}</div>
      <div class="aans">Правильный ответ:<b>${esc(q.answer)}</b></div>
      ${q.explanation?`<button class="etog" onclick="tog2(this)">Пояснение</button>
        <div class="expl"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}
    </div>`).join('');
  app.innerHTML=`
    <div class="allhead"><h1>Результат</h1></div>
    <p class="allsub">${esc(curName)}</p>
    ${resultChart(correct,wrong,total)}
    <div class="rrow" style="margin-top:18px">
      <button class="btn" onclick="openTest2()">Решать заново</button>
      <button class="btn ghost" onclick="home()">К тестам</button>
    </div>
    <div class="review"><h3>Все задания с ответами</h3></div>
    ${items}`;
  animChart(correct,wrong,total);
  window.scrollTo({top:0,behavior:'smooth'});
}
function tog2(b){const e=b.nextElementSibling;e.classList.toggle('open');
  b.textContent=e.classList.contains('open')?'Скрыть пояснение':'Пояснение'}

/* ---- add tests from files ---- */
function fileName(name){return name.replace(/\.[^.]+$/,'').trim()||'Без имени'}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
$('#file').addEventListener('change',ev=>{
  const files=[...ev.target.files]; ev.target.value='';
  if(!files.length) return;
  let added=0, pending=files.length;
  const done=()=>{ if(--pending===0){ saveTests(); home();
    toast(added?('Добавлено тестов: '+added):'Не удалось прочитать файлы'); } };
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ try{const qs=parseCSV(r.result);
      if(qs.length){tests.push({id:uid(),name:fileName(f.name),questions:qs}); added++;}}catch(e){} done(); };
    r.onerror=()=>done();
    r.readAsText(f,'utf-8');
  });
});
function parseCSV(text){
  text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}}
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<3)continue;
    const n=(r[0]||'').trim(),tx=(r[1]||'').trim(),an=(r[2]||'').trim();
    if(!tx||!an)continue;
    out.push({n:n||('Задание '+i),text:tx,answer:an,explanation:(r[3]||'').trim()})}
  return out;
}

loadTests();
home();
</script>
