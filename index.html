<!DOCTYPE html>
<html lang="ru" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Тренажёр</title>
<style>
/* ===== Quiet Precision ===== */
:root{
  --bg:#faf9f6; --surface:#ffffff; --ink:#1b1b1f; --muted:#8a8a94;
  --line:#e9e7e1; --line-strong:#dcdad2;
  --accent:#4f46e5; --accent-soft:rgba(79,70,229,.08);
  --ok:#3f9d5a; --ok-soft:rgba(63,157,90,.10);
  --bad:#c4593f; --bad-soft:rgba(196,89,63,.10);
  --r:18px;
}
[data-theme="night"]{
  --bg:#0e0e12; --surface:#16161c; --ink:#ececf1; --muted:#7d7d8a;
  --line:#23232c; --line-strong:#2e2e3a;
  --accent:#9aa2ff; --accent-soft:rgba(154,162,255,.12);
  --ok:#6cc88a; --ok-soft:rgba(108,200,138,.14);
  --bad:#e08a72; --bad-soft:rgba(224,138,114,.14);
  color-scheme:dark;
}
[data-theme="sepia"]{
  --bg:#f3ead7; --surface:#fbf5e9; --ink:#3f3322; --muted:#9c8a6e;
  --line:#e4d7bd; --line-strong:#d8c8a8;
  --accent:#b06a16; --accent-soft:rgba(176,106,22,.10);
  --ok:#5b8a3a; --ok-soft:rgba(91,138,58,.12);
  --bad:#b4502f; --bad-soft:rgba(180,80,47,.10);
}
[data-theme="forest"]{
  --bg:#eef2ee; --surface:#fbfdfb; --ink:#16241c; --muted:#6b7d72;
  --line:#d9e2da; --line-strong:#c6d3c8;
  --accent:#1f7a47; --accent-soft:rgba(31,122,71,.09);
  --ok:#1f7a47; --ok-soft:rgba(31,122,71,.12);
  --bad:#b4502f; --bad-soft:rgba(180,80,47,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .4s ease,color .4s ease;
}
.wrap{
  width:100%;max-width:640px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px}
.mark{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.mark b{font-weight:600;font-size:15px;letter-spacing:.02em}
.mark span{font-size:12px;color:var(--muted);font-weight:400}
.themes{display:flex;gap:9px}
.sw{width:18px;height:18px;border-radius:50%;cursor:pointer;border:1.5px solid var(--line-strong);padding:0;transition:transform .15s ease}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw.t-paper{background:#faf9f6} .sw.t-night{background:#16161c}
.sw.t-sepia{background:#e9d8b4} .sw.t-forest{background:#cfe0d3}
.bars{margin-bottom:30px}
.track{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.track>i{display:block;height:100%;width:0;background:var(--accent);transition:width .55s cubic-bezier(.22,1,.36,1)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 30px;flex:none}
.fade{animation:fade .5s cubic-bezier(.22,1,.36,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- home / library ---- */
.home h1{font-weight:600;font-size:clamp(26px,6vw,32px);letter-spacing:-.02em;margin:2px 0 8px}
.home .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
.tlist{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.tcard{display:flex;align-items:center;gap:14px;padding:18px 18px;border:1px solid var(--line);
  border-radius:14px;cursor:pointer;background:var(--bg);transition:border-color .2s,background .2s,transform .12s}
.tcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.tcard:active{transform:translateY(1px)}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;font-size:15.5px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.tbadge{font-size:10.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:2px 8px;margin-left:8px;letter-spacing:.03em;vertical-align:middle}
.trm{flex:none;width:28px;height:28px;border-radius:8px;border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer;transition:color .2s,background .2s;line-height:1}
.trm:hover{color:var(--bad);background:var(--bad-soft)}
.tgo{flex:none;color:var(--muted);font-size:18px}
.tcard:hover .tgo{color:var(--accent)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;padding:28px 12px;border:1px dashed var(--line-strong);border-radius:14px;margin-bottom:22px}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.01em;
  padding:16px 20px;border-radius:13px;color:#fff;background:var(--accent);
  transition:transform .12s ease,opacity .2s ease,filter .2s ease;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{filter:none;background:var(--accent-soft);border-color:var(--accent)}
.linkfin{display:block;width:100%;text-align:center;margin-top:14px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:color .2s}
.linkfin:hover{color:var(--accent)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6;opacity:.85}
/* ---- question ---- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qnum{font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.qtype{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.qtext{font-size:16px;line-height:1.65;color:var(--ink)}
.qtext .lead{display:block}
.qtext .opt{display:block;margin-top:11px;padding-left:24px;text-indent:-24px}
.qtext .hdr{display:block;margin-top:20px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qtext .ins{display:block;margin-top:16px;font-size:13.5px;color:var(--muted);font-style:italic}
.az{margin-top:30px}
.az .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:11px;letter-spacing:.02em}
.field{width:100%;font-size:21px;font-weight:600;letter-spacing:.1em;text-align:center;font-family:inherit;
  color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:13px;padding:16px 12px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .3s}
.field::placeholder{letter-spacing:.01em;font-weight:400;font-size:13.5px;color:var(--muted);opacity:.55}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.good{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.field.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.az .btn{margin-top:16px}
.verdict{margin-top:22px;display:none}
.verdict.show{display:block;animation:fade .4s ease}
.vrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.verdict.ok .vrow{color:var(--ok)} .verdict.bad .vrow{color:var(--bad)}
.vdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.verdict.ok .vdot{background:var(--ok)} .verdict.bad .vdot{background:var(--bad)}
.cline{margin-top:12px;font-size:14px;color:var(--muted)}
.cline b{color:var(--ink);font-size:17px;letter-spacing:.06em;margin-left:4px}
.etog{margin-top:18px;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;letter-spacing:.01em}
.expl{margin-top:14px;overflow:hidden;max-height:0;transition:max-height .55s ease}
.expl.open{max-height:4000px}
.expl-inner{padding-top:4px;border-top:1px solid var(--line)}
.epoint{font-size:14px;line-height:1.7;color:var(--muted);margin-top:14px}
.epoint:first-child{margin-top:16px}
/* ---- review-all ---- */
.allhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.allhead h1{font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
.allsub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.allitem{padding:22px 0;border-top:1px solid var(--line)}
.aans{margin-top:12px;font-size:14px;color:var(--muted)}
.aans b{color:var(--ok);font-size:16px;letter-spacing:.06em;margin-left:4px}
/* ---- result chart ---- */
.ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)}
.ring .seg{transition:stroke-dasharray 1.05s cubic-bezier(.22,1,.36,1)}
.ring .seg-ok{stroke:var(--ok)} .ring .seg-bad{stroke:var(--bad)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font-size:36px;font-weight:600;letter-spacing:-.02em}
.ring .lab b i{font-size:19px;color:var(--muted);font-style:normal}
.ring .lab span{font-size:12px;color:var(--muted);margin-top:2px}
.resbreak{display:flex;gap:12px;margin:16px 0 4px}
.resbox{flex:1;border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:center;background:var(--bg)}
.resbox b{display:block;font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1}
.resbox span{display:block;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.okbox b,.donebox b{color:var(--ok)}
.errbox{border-color:var(--bad);background:var(--bad-soft);cursor:pointer;transition:transform .12s,filter .2s,box-shadow .2s;
  box-shadow:0 0 0 3px var(--bad-soft)}
.errbox b{color:var(--bad)}
.errbox span{color:var(--bad);font-weight:600}
.errbox:hover{filter:brightness(1.05)}
.errbox:active{transform:translateY(1px)}
.resnote{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.gtitle{text-align:center;font-size:18px;font-weight:600;margin:18px 0 4px}
.gsub{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 auto 22px;max-width:38ch}
.rrow{display:flex;gap:12px}
.rrow .btn{flex:1}
.review h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:30px 0 14px}
.rev{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.rev .rn{color:var(--ink);font-weight:500;flex:none}
.rev .rd{color:var(--muted);margin-left:auto;text-align:right;font-size:13px}
.rev .rd .y{color:var(--bad);text-decoration:line-through;margin-right:8px}
.rev .rd .g{color:var(--ok);font-weight:600;letter-spacing:.05em}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;opacity:.6;letter-spacing:.03em}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(150%);
  background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:11px;font-size:13.5px;
  z-index:9;transition:transform .4s cubic-bezier(.22,1,.36,1);max-width:88vw}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:680px){.panel{padding:42px 44px}.qtext{font-size:16.5px}}
@media(max-width:380px){.panel{padding:28px 22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mark" onclick="home()"><b>Тренажёр</b><span>обществознание</span></div>
    <div class="themes" id="themes">
      <button class="sw t-paper"  data-t="paper"  aria-label="Бумага"></button>
      <button class="sw t-night"  data-t="night"  aria-label="Ночь"></button>
      <button class="sw t-sepia"  data-t="sepia"  aria-label="Сепия"></button>
      <button class="sw t-forest" data-t="forest" aria-label="Лес"></button>
    </div>
  </div>

  <div class="bars" id="bars" style="display:none">
    <div class="track"><i id="pbar"></i></div>
    <div class="meta"><span><b id="cur">1</b> / <b id="tot">50</b></span><span>верно <b id="scr">0</b></span></div>
  </div>

  <div id="app" class="panel"></div>
  <div class="foot" id="foot"></div>
</div>

<input type="file" id="file" accept=".csv,text/csv" multiple>
<div class="toast" id="toast"></div>

<script>
const BUILTINS = [{"name": "Политика", "questions": [{"n": "1", "text": "Выберите верные суждения о власти и запишите цифры, под которыми они указаны.\n1) Политической властью называют способность и возможность отстаивать и претворять в жизнь определённые политические взгляды, установки и цели.\n2) Признаком государственной власти является монопольное право использовать силу в пределах страны.\n3) В соответствии с целями своей деятельности государственная власть делится на законодательную, исполнительную и судебную.\n4) Принцип разделения властей реализуется только в демократических государствах.\n5) По основному субъекту осуществления власть бывает унитарная и республиканская.", "answer": "1234", "explanation": "1. Да. Политической властью называют способность и возможность отстаивать и претворять в жизнь определённые политические взгляды, установки и цели. Эта власть выражается в способности субъекта власти навязывать свою волю, координировать действия общества и его институтов для достижения политических целей. Политическая власть играет ключевую роль в управлении обществом, обеспечивая стабильность и согласованность в социально-политической жизни.\n\n2. Да. Признаком государственной власти является монопольное право использовать силу в пределах страны. Это право закреплено в законах и подразумевает возможность применения государственного принуждения через армию, полицию и другие силовые структуры для обеспечения порядка, защиты правопорядка и государственной безопасности. Монополия на легитимное насилие позволяет государству поддерживать стабильность и правопорядок.\n\n3. Да. В соответствии с целями своей деятельности государственная власть делится на законодательную, исполнительную и судебную. Законодательная власть занимается разработкой и принятием законов, исполнительная — их реализацией и управлением государственными процессами, а судебная обеспечивает соблюдение законов и защиту прав граждан. Эта система разделения властей направлена на предотвращение концентрации власти в руках одного органа и обеспечивает её сбалансированное функционирование.\n\n4. Да. Принцип разделения властей реализуется только в демократических государствах, так как он предполагает независимость и самостоятельность законодательной, исполнительной и судебной ветвей власти. В авторитарных государствах, хотя могут формально существовать различные ветви власти, они, как правило, подчинены одной — исполнительной, или непосредственно главе государства, что делает их зависимыми.\n\n5. Нет. По основному субъекту осуществления власть бывает республиканская и монархическая"}, {"n": "2", "text": "Выберите верные суждения о власти и запишите цифры, под которыми они указаны.\n1) Властью называют способность одной стороны (индивида или группы) оказывать влияние на поведение другой стороны вне зависимости от того, готова последняя к сотрудничеству или нет.\n2) Любая власть предполагает наличие неравных отношений между теми, кто осуществляет власть, и теми, кто ей подчиняется.\n3) По степени институциализации власть бывает демократическая, авторитарная и др.\n4) По режиму правления выделяют власть пропорциональную и мажоритарную.\n5) Одной из целей государственной власти является объединение общества для решения важных социальных задач.", "answer": "125", "explanation": "1. Да. Власть — это способность индивида или группы влиять на поведение других, даже если те не готовы к сотрудничеству. Это определение охватывает все виды власти, от политической до экономической. \n\n2. Да. Любая власть предполагает неравенство между властвующими, обладающими правом принятия решений, и подвластными, обязанными их исполнять. Такое распределение полномочий и ответственности является основой властных отношений. \n\n3. Нет. По степени институциализации власть бывает правительственная, городская, школьная и др. \n\n4. Нет. Режим правления предполагает такие формы, как демократический, авторитарный и тоталитарный. Пропорциональная и мажоритарная системы относятся к избирательным системам, а не к режимам правления. \n\n5. Да. Государственная власть стремится объединить общество для решения важных социальных задач, таких как обеспечение стабильности, согласование интересов различных групп и достижение общих целей."}, {"n": "3", "text": "Выберите верные суждения о власти и её видах и запишите цифры, под которыми они указаны.\n1) Политической властью называют способность одного человека или группы лиц контролировать поведение граждан, общества в целом, исходя из общенациональных или общегосударственных задач. \n2) Легальность власти проявляется в её неофициальном одобрении обществом в силу её притягательных черт. \n3) Возникновение политической власти обусловлено потребностью в регуляции общественных отношений, авторитетном разрешении социальных конфликтов. \n4) Политическая власть – это и инструмент господства, и эффективное средство интеграции общества и сохранения общественного порядка. \n5) Харизматический тип легитимности власти основан на вере в святость традиций и право властвовать тем, кто получил власть в соответствии с этими традициями.", "answer": "134", "explanation": "1. Да. Политическая власть действительно характеризуется способностью контролировать поведение граждан и общества, направляя его в соответствии с общенациональными или общегосударственными целями. \n\n2. Нет. Легальность власти означает её соответствие правовым нормам, то есть законность. Неофициальное одобрение обществом связано с легитимностью, а не с легальностью. \n\n3. Да. Возникновение политической власти связано с необходимостью регулировать общественные отношения, решать социальные конфликты и обеспечивать порядок в обществе, что подтверждается её основными функциями. \n\n4. Да. Политическая власть выполняет как функцию господства и контроля, так и задачу интеграции общества, поддержания порядка и реализации общезначимых целей. \n\n5. Нет. Харизматический тип легитимности власти основывается на вере в исключительные качества или лидерство конкретного человека, а вера в традиции характерна для традиционного типа легитимности."}, {"n": "4", "text": "Ниже приведён перечень терминов. Все они, за исключением двух, являются названиями подсистем политической системы общества.\n1) институциональная; 2) избирательная; 3) коммуникативная; 4) культурно-идеологическая; 5) нормативная; 6) пропорциональная.\nНайдите два термина, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", "answer": "26", "explanation": "1. Институциональная – подсистема, включающая в себя политические институты и организации (например, государство, партии, общественные объединения), которые организуют и осуществляют политическую деятельность. \n\n2. Избирательная – процесс формирования органов власти и управления через выборы. Термин не относится к подсистемам политической системы, так как описывает отдельный механизм в её рамках. \n\n3. Коммуникативная – подсистема, связанная с процессами взаимодействия между различными субъектами политической системы, такими как граждане, политические партии, СМИ, государственные органы. \n\n4. Культурно-идеологическая – подсистема, обеспечивающая формирование и распространение политической культуры, ценностей, идей и идеологий, объединяющих общество. \n\n5. Нормативная – подсистема, которая включает политико-правовые нормы и правила, регулирующие деятельность участников политической системы (например, законы, конституция, обычаи). \n\n6. Пропорциональная – термин, связанный с избирательной системой, а не с подсистемами политической системы. Описывает способ распределения мест в органах власти на основе пропорционального представительства партий."}, {"n": "5", "text": "Выберите верные суждения о политической системе общества и запишите цифры, под которыми они указаны. \n1) Политическая система общества включает в себя экономическую, социальную и духовную подсистемы. \n2) Политологи различают мажоритарные и пропорциональные типы политических систем общества. \n3) Социальные нормы (правовые, политические, нравственные и т.п.) являются элементами институциональной (организационной) подсистемы политической системы общества. \n4) В структуру политической системы общества входят общественно-политические организации. \n5) Политическая система общества регулирует политические процессы.", "answer": "45", "explanation": "1. Нет. Сферы (подсистемы) общества – экономическая, социальная, политическая и духовная. Политическая система включает в себя следующие компоненты: нормативная, коммуникативная, институциональная, культурно-идеологическая и функциональная.\n\n2. Нет. Мажоритарные и пропорциональные системы – это типы избирательных систем, а не политических систем общества. Политическая система включает в себя различные элементы, такие как политические институты, организации и процессы.\n\n3. Нет. Социальные нормы, включая правовые, политические и нравственные, относятся к нормативым аспектам политической системы, но не являются частью институциональной подсистемы. Институциональная подсистема включает в себя политические институты, такие как парламенты, правительства, суды.\n\n4. Да. Общественно-политические организации являются важным элементом политической системы. Они включают партии, движения, неправительственные организации, которые играют роль в организации и реализации политической жизни.\n\n5. Да. Политическая система регулирует политические процессы, направляя действия различных политических акторов, таких как государственные органы, политические партии и гражданское общество, для достижения политических целей."}, {"n": "6", "text": "Выберите верные суждения о политической системе общества и запишите цифры, под которыми они указаны.\n1) К функциям политической системы общества относится выявление связанных с властью интересов больших социальных групп. \n2) Разнообразные взаимодействия субъектов политической жизни составляют основу коммуникативной подсистемы политической системы общества. \n3) По характеру политических режимов различают мажоритарные и пропорциональные политические системы общества. \n4) Организационная подсистема политической системы включает в себя политические институты и организации, выражающие и представляющие различные по значимости властные интересы. \n5) Одним из элементов культурной подсистемы политической системы общества является политическая психология.", "answer": "1245", "explanation": "1. Да. Одной из функций политической системы является выявление и учет интересов больших социальных групп, связанных с распределением и использованием власти. Это помогает направить политическую деятельность на решение общественно значимых задач.\n\n2. Да. Коммуникативная подсистема политической системы включает в себя разнообразные взаимодействия между субъектами политической жизни, такими как граждане, партии, общественные организации и государственные структуры, обеспечивая обмен информацией и координацию действий.\n\n3. Нет. По характеру политических режимов различают демократические, авторитарные и тоталитарные системы. Мажоритарные и пропорциональные системы относятся к избирательным системам, а не к политическим режимам.\n\n4. Да. Организационная подсистема политической системы включает политические институты, такие как государство, партии и общественные движения, которые представляют и защищают различные властные интересы в обществе.\n\n5. Да. Политическая психология является элементом культурной подсистемы политической системы, поскольку она отражает эмоциональное отношение общества к власти, политическим процессам и событиям."}, {"n": "7", "text": "Выберите верные суждения о политической системе общества и запишите цифры, под которыми они указаны.\n1) Нормативная подсистема политической системы представляет собой совокупность отношений, которые возникают в процессе деятельности политических организаций и социальных институтов.\n2) Организационную подсистему политической системы составляет совокупность социальных норм, регулирующих отношения, которые складываются в связи с осуществлением государственной власти.\n3) Политическая система общества – это совокупность связей и отношений государственных и негосударственных институтов, которые участвуют в политической жизни страны, чтобы приобрести политическое влияние, осуществлять власть.\n4) Политическая система общества позволяет согласовывать интересы различных слоев общества.\n5) Политическая система общества обеспечивает его стабильность и безопасность.", "answer": "345", "explanation": "1. Нет. Нормативная подсистема включает политические нормы, ценности, традиции, регулирующие поведение политических субъектов, а не сами отношения между организациями.\n\n2. Нет. Организационная подсистема состоит из государственных органов, партий, движений, СМИ и других институтов, участвующих в политической жизни, а не из норм.\n\n3. Да. Политическая система общества представляет собой совокупность институтов, норм и отношений, через которые осуществляется политическая власть и взаимодействие субъектов политики.\n\n4. Да. Политическая система выполняет функцию согласования интересов социальных групп и предотвращения конфликтов в обществе.\n\n5. Да. Одна из функций политической системы — обеспечение стабильности, порядка и безопасности общества."}, {"n": "8", "text": "Выберите верные суждения о политической системе общества и запишите цифры, под которыми они указаны.\n1) Коммуникативная подсистема политической системы общества представляет собой совокупность отношений, которые возникают в процессе деятельности политических организаций и социальных институтов.\n2) Организационную подсистему политической системы общества составляет совокупность социальных норм, регулирующих отношения, которые складываются в связи с осуществлением государственной власти.\n3) В зависимости от типа господствующей в обществе идеологии выделяют традиционные, тоталитарные и демократические политические системы.\n4) Политическая система общества позволяет согласовывать интересы различных слоёв общества.\n5) Политическая система общества обеспечивает стабильность и безопасность в обществе.", "answer": "145", "explanation": "1. Да. Коммуникативная подсистема отражает систему связей и взаимодействий между элементами политической системы и другими сферами общества, поэтому её можно описать как совокупность отношений, возникающих в процессе деятельности политических институтов.\n\n2. Нет. Организационная подсистема состоит из государственных органов, партий, движений, СМИ и других институтов. В суждении ей приписаны свойства нормативной подсистемы, связанной с нормами и правилами.\n\n3. Нет. Деление политических систем на традиционные, тоталитарные и демократические основано не на типе идеологии, а на характере политического режима и способах осуществления власти.\n\n4. Да. Политическая система выполняет интегративную функцию, обеспечивая согласование интересов социальных групп и предотвращая социальные конфликты.\n\n5. Да. Одна из функций политической системы — поддержание стабильности, порядка и безопасности в обществе."}, {"n": "9", "text": "Выберите верные суждения о политической системе общества и запишите цифры, под которыми они указаны.\n1) Политическая система общества призвана отражать разнообразные интересы социальных групп, которые непосредственно или через свои организации и движения оказывают влияние на государственную власть.\n2) Политическая система общества любого типа всегда стабильна и не подвержена изменениям на протяжении длительного времени.\n3) Политическая система выполняет функцию определения целей и направлений развития общества и государства.\n4) Ценности, политические идеологии относятся к культурной подсистеме политической системы общества.\n5) Политическая система общества выполняет функцию выдвижения политических лидеров, подготовки кадров для государственного аппарата и политических организаций.", "answer": "1345", "explanation": "1. Да. Политическая система обеспечивает представительство и согласование интересов социальных групп, влияющих на государственную власть напрямую или через организации.\n\n2. Нет. Политические системы изменяются под воздействием социальных, экономических и культурных факторов и не являются неизменными структурами.\n\n3. Да. Определение стратегических целей и направлений развития общества относится к функциям политической системы.\n\n4. Да. Культурно-идеологическая подсистема включает ценности, политические идеологии, политические традиции и модели поведения.\n\n5. Да. Политическая система выполняет функцию политической социализации, включающую подготовку кадров и выдвижение политических лидеров."}, {"n": "10", "text": "Ниже приведён перечень признаков. Все они, за исключением двух, относятся к признакам любого государства.\n1) наличие территории; 2) суверенитет; 3) публичная власть; 4) федеративное устройство; 5) право взимания налогов с граждан и фирм; 6) реализация принципа разделения властей.\nНайдите два признака, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.", "answer": "46", "explanation": "1. Нет. Наличие определённой территории выступает обязательным признаком государства, так как именно в её пределах осуществляется государственная власть. Без закреплённого пространства функционирование государства невозможно.\n\n2. Нет. Суверенитет выражается в верховенстве государственной власти внутри страны и её независимости во внешней политике. Данное свойство присуще любому государству независимо от формы устройства и режима.\n\n3. Нет. Публичная власть представляет собой особый аппарат управления, отделённый от общества и действующий на профессиональной основе. Через неё обеспечивается управление общественными процессами.\n\n4. Да. Федеративное устройство отражает лишь один из возможных типов территориальной организации государства. Унитарные государства существуют на равне с федеративными.\n\n5. Нет. Право взимания налогов связано с формированием государственного бюджета и финансированием общественных функций. Реализация данного права характерна для любого государства.\n\n6. Да. Реализация принципа разделения властей характерна для демократических государств. В условиях авторитарных и тоталитарных режимов данный принцип не применяется."}, {"n": "11", "text": "Выберите верные суждения о государстве и запишите цифры, под которыми они указаны.\n1) К основным признакам государства любого типа относятся федеративная форма государственного устройства и территория, на которую распространяется власть.\n2) Государство отличается от политической партии тем, что оно является субъектом политической жизни.\n3) Государство – это институт публичной власти, который обладает суверенитетом.\n4) Государство призвано уравновешивать различные социальные интересы.\n5) Государство вырабатывает и проводит общую для страны политику во всех сферах жизни общества.", "answer": "345", "explanation": "1. Нет. К основным признакам государства относятся территория, население, публичная власть, суверенитет, система налогов и сборов, а также наличие права. Федеративная форма государственного устройства не является обязательным признаком, существуют государства с унитарным устройством.\n\n2. Нет. И государство, и политическая партия являются субъектами политической жизни. Но государство отличается от политической партии более широкой сферой деятельности, обладанием суверенитетом, возможность легитимно применять силу, публичной властью и т.д..\n\n3. Да. Государство – это институт публичной власти, который обладает суверенитетом, то есть верховенством внутри страны и независимостью в международных отношениях.\n\n4. Да. Государство выполняет функцию уравновешивания различных социальных интересов, чтобы предотвратить конфликты между группами населения и обеспечить стабильное развитие общества.\n\n5. Да. Государство вырабатывает и проводит общую политику в экономической, социальной, культурной, оборонной и других сферах жизни общества, что является одной из его ключевых функций."}, {"n": "12", "text": "Выберите верные суждения о государстве и запишите цифры, под которыми они указаны.\n1) Государство любого типа устанавливает и собирает налоги.\n2) К обязательным признакам государства любого типа относят наличие политических партий и территорию, на которую распространяется его власть.\n3) Государство как политический институт ориентировано на реализацию общезначимых целей и интересов.\n4) Государство обладает суверенитетом и правом законного принуждения к выполнению своей воли.\n5) Государство, в отличие от политической партии, является политическим институтом.", "answer": "134", "explanation": "1. Да. Государство любого типа устанавливает и собирает налоги. \n\n2. Нет. Наличие политических партий не является обязательным признаком государства. Территория — да, это обязательный признак, но политические партии могут отсутствовать, например, в авторитарных или тоталитарных режимах.\n\n3. Да. Государство как политический институт действительно ориентировано на реализацию общезначимых целей и интересов, поскольку призвано обеспечивать порядок, защиту и благо общества в целом.\n\n4. Да. Государство обладает суверенитетом (верховной властью внутри и независимостью во внешних делах) и правом легального принуждения, то есть имеет право заставлять граждан соблюдать законы при помощи силовых структур.\n\n5. Нет. И государство, и политическая партия являются политическими институтами. Государство — это центральный институт политической системы, а политическая партия — один из элементов, участвующих в политическом процессе."}, {"n": "13", "text": "Выберите верные суждения о государстве и запишите цифры, под которыми они указаны.\n1) Форма государственного (территориального) устройства – это организация верховной государственной власти и порядок её образования.\n2) Традиционно выделяют две формы правления: демократию и республику.\n3) Государственная власть обладает верховенством внутри страны и независимостью в отношениях с другими государствами.\n4) В президентской республике президент, будучи главой государства, не является главой правительства.\n5) Государство осуществляет управление обществом и обеспечивает в нём порядок и стабильность.", "answer": "35", "explanation": "1. Нет. Форма государственного (территориального) устройства характеризует организацию государства по территориальному признаку, а не порядок образования верховной власти. К этой категории относятся федерации, унитарные государства и конфедерации.\n\n2. Нет. Традиционно выделяют три формы правления: монархию, республику и смешанную форму, в которых могут быть различные варианты распределения властных полномочий между органами государственной власти.\n\n3. Да. Государственная власть обладает верховенством внутри страны, что означает её способность принимать обязательные для всех законы и обеспечивать их исполнение, а также независимость в отношениях с другими государствами, что подразумевает суверенитет и право на международную политику.\n\n4. Нет. В президентской республике президент является одновременно главой государства и главой правительства, обладая широкими полномочиями в управлении исполнительной властью.\n\n5. Да. Государство осуществляет управление обществом, регулирует различные общественные отношения и обеспечивает порядок и стабильность, чтобы поддерживать законность, безопасность и развитие общества."}, {"n": "14", "text": "Выберите верные суждения о государстве и запишите цифры, под которыми они указаны.\n1) Государство как политический институт ориентировано на реализацию общезначимых целей и интересов. \n2) Государство обладает суверенитетом и правом законного принуждения к выполнению своей воли. \n3) В парламентской республике президент является одновременно и главой государства, и главой правительства. \n4) Форма правления – это внутреннее деление государства, правовое положение его частей, характер их взаимоотношений друг с другом и с центральными органами власти. \n5) В зависимости от формы государственного (территориального) устройства выделяют унитарные и демократические государства.", "answer": "12", "explanation": "1. Да. Государство как политический институт ориентировано на реализацию общезначимых целей и интересов. Оно обеспечивает безопасность, правопорядок, социальную справедливость и экономическое развитие, действуя в интересах всего общества.\n\n2. Да. Государство обладает суверенитетом, то есть верховенством власти на своей территории, и правом законного принуждения к выполнению своей воли через законы и правоохранительные органы. Это позволяет государству обеспечивать порядок и соблюдение правовых норм.\n\n3. Нет. В парламентской республике президент не является одновременно главой государства и главой правительства. В таких системах президент выполняет в основном представительские функции, а реальная исполнительная власть принадлежит премьер-министру, который возглавляет правительство.\n\n4. Нет. Форма правления — это не внутреннее деление государства, а способ организации верховной власти, определяющий, кто и как её осуществляет. Внутреннее деление государства относится к форме государственного устройства (унитарное, федеративное, конфедеративное).\n\n5. Нет. В зависимости от формы государственного (территориального) устройства выделяют унитарные и федеративные государства, а не демократические. Демократия — это политический режим, а не форма территориального устройства."}, {"n": "15", "text": "Выберите верные суждения о государстве и запишите цифры, под которыми они указаны.\n1) В президентской республике президент, будучи главой государства, не возглавляет правительство.\n2) Государство осуществляет управление обществом и обеспечивает в нём порядок и стабильность.\n3) Форма государственного (территориального) устройства – это организация верховной государственной власти и порядок её образования.\n4) Традиционно выделяют две формы правления: демократию и республику.\n5) Государственная власть обладает верховенством внутри страны и независимостью в отношениях с другими государствами.", "answer": "25", "explanation": "1. Нет. В президентской республике президент глава государства и исполнительной власти, он сам возглавляет правительство.\n\n2. Да. Государство осуществляет управление общественными процессами и выполняет функции по обеспечению порядка и стабильности в обществе.\n\n3. Нет. Форма государственного (территориального) устройства характеризует распределение власти между центром и территориями, а не организацию верховной власти и порядок её формирования.\n\n4. Нет. Демократия относится к политическому режиму, а республика — к форме правления; данные категории не образуют единую классификацию форм правления.\n\n5. Да. Верховенство государственной власти внутри страны и её независимость во внешних отношениях выражают суверенитет государства."}, {"n": "16", "text": "Представьте, что Вы помогаете учителю оформить презентацию к уроку обществознания по теме «Государство». Один из слайдов называется «Внутренние функции государства». Что из перечисленного необходимо включить в этот слайд? Запишите цифры, под которыми указаны соответствующие функции.\n1) обеспечение обороны и безопасности\n2) обеспечение равных условий для предприятий различных форм собственности\n3) координация экономического и политического взаимодействия с иными государствами\n4) обеспечение рационального использования природных ресурсов\n5) учёт в политике интересов различных социальных групп\n6) проведение единой внешней политики", "answer": "245", "explanation": "1. Нет. Обеспечение обороны и безопасности связано с защитой государства от внешних угроз и относится к внешним функциям государства.\n\n2. Да. Создание и поддержание равных условий для предприятий различных форм собственности относится к внутренней экономической функции государства.\n\n3. Нет. Координация экономического и политического взаимодействия с другими государствами является проявлением внешнеполитической функции.\n\n4. Да. Рациональное использование и охрана природных ресурсов входят во внутренние функции государства и связаны с экологической политикой.\n\n5. Да. Учёт интересов различных социальных групп отражает внутреннюю социальную и интегративную функцию государства.\n\n6. Нет. Проведение единой внешней политики относится к сфере внешних функций государства."}, {"n": "17", "text": "В государстве Z установился демократический политический режим. Правительство осуществляет свою деятельность на внутреннем и внешнем направлениях. Что из перечисленного ниже относится к социальной и культурно-образовательной функциям государства? Запишите цифры, под которыми указаны проявления соответствующих функций государства.\n1) поддержание мирных отношений с соседними государствами\n2) поддержка конкуренции и развитие предпринимательской деятельности\n3) контроль за расходованием налогов\n4) создание условий, обеспечивающих достойную жизнь и свободное развитие граждан\n5) развитие образования, здравоохранения\n6) трансляция позитивных социальных ценностей", "answer": "456", "explanation": "1. Нет. Поддержание мирных отношений с другими государствами относится к внешнеполитической функции государства.\n\n2. Нет. Поддержка конкуренции и предпринимательства связана с экономической функцией государства.\n\n3. Нет. Контроль за расходованием налогов относится к финансово-контрольной и управленческой деятельности государства.\n\n4. Да. Создание условий для достойной жизни и свободного развития граждан выражает социальную функцию государства и направлено на повышение уровня и качества жизни населения.\n\n5. Да. Развитие образования и здравоохранения относится к социальной и культурно-образовательной функциям государства, так как обеспечивает воспроизводство человеческого капитала.\n\n6. Да. Трансляция позитивных социальных ценностей связана с культурно-образовательной функцией государства и направлена на формирование ценностных ориентиров общества."}, {"n": "18", "text": "Выберите верные суждения о гражданском обществе и запишите цифры, под которыми они указаны.\n1) Гражданское общество представляет собой совокупность межличностных отношений, развивающихся под контролем государства\n2) В гражданском обществе, в отличие от государственных структур, преобладают вертикальные связи между участниками\n3) Организации гражданского общества призваны обеспечивать реальные гарантии прав и свобод человека, равный доступ к участию в государственных и общественных делах\n4) Цель функционирования современного гражданского общества заключается в удовлетворении материальных и духовных потребностей человека, в создании условий, обеспечивающих ему достойную жизнь и свободное развитие\n5) Экономическая база гражданского общества – государственная собственность.", "answer": "34", "explanation": "1. Нет. Гражданское общество представляет собой сферу самоуправляемых и добровольных общественных отношений, которая формируется вне государственного контроля.\n\n2. Нет. В гражданском обществе преобладают горизонтальные связи, основанные на равенстве и партнёрстве, в отличие от иерархических вертикальных структур государственной власти.\n\n3. Да. Одной из задач организаций гражданского общества является защита прав и свобод человека, а также содействие участию граждан в жизни общества и государства.\n\n4. Да. Гражданское общество направлено на создание условий для достойной жизни, реализации интересов и потребностей личности.\n\n5. Нет. Экономическая база гражданского общества — частная собственность, свободный рынок и многообразие форм собственности."}, {"n": "19", "text": "Выберите верные суждения о демократии и запишите цифры, под которыми они указаны.\n1) Высшей ценностью демократии являются человек, его права и свободы.\n2) Выборы – это отличительный признак демократии; при других политических режимах выборы отсутствуют.\n3) Демократия является одной из форм государственно-территориального устройства.\n4) Основополагающие принципы демократии – подчинение меньшинства большинству и учёт интересов меньшинства.\n5) Представительная демократия предполагает участие народа в делах государства через выборные органы.", "answer": "145", "explanation": "1. Да. Высшей ценностью демократии являются человек, его права и свободы. Это закреплено в конституциях демократических государств и международных документах, таких как Всеобщая декларация прав человека.\n\n2. Нет. Выборы не являются исключительным признаком демократии, так как они могут проводиться и при других политических режимах, например, в авторитарных государствах, где выборы носят формальный характер и не отражают реальной конкуренции.\n\n3. Нет. Демократия не является формой государственно-территориального устройства. Это политический режим, в то время как государственно-территориальное устройство относится к федеративным, унитарным или конфедеративным формам.\n\n4. Да. Основополагающие принципы демократии включают подчинение меньшинства большинству при принятии решений, а также учёт интересов меньшинства, что обеспечивает баланс и предотвращает тиранию большинства.\n\n5. Да. Представительная демократия предполагает участие народа в делах государства через выборные органы, такие как парламент или местные органы власти, которые принимают решения от имени граждан."}, {"n": "20", "text": "Выберите верные суждения о демократии и запишите цифры, под которыми они указаны.\n1) Для демократии характерен политический плюрализм.\n2) Выборы – это отличительный признак демократии; при других политических режимах выборы отсутствуют.\n3) Демократия является одной из форм государственного (территориального) устройства.\n4) Основополагающий принцип демократии – подчинение меньшинства большинству и учёт интересов меньшинства.\n5) Представительная демократия предполагает непосредственное участие народа в определении главных проблем общественной жизни, в обсуждении путей их решения и в принятии соответствующих решений.", "answer": "14", "explanation": "1. Да. Для демократии характерен политический плюрализм, то есть наличие и конкуренция разных политических партий, движений и взглядов, что обеспечивает разнообразие мнений и свободу выбора.\n\n2. Нет. Хотя выборы являются важным элементом демократии, они могут также существовать в других политических режимах, например, в авторитарных режимах, где выборы могут быть проведены, но с ограничениями, не обеспечивающими реальное политическое соперничество.\n\n3. Нет. Демократия — это форма государственного устройства (политический режим), а не форма территориального устройства. В разных странах может существовать демократическая форма правления в рамках унитарного, федеративного или другого территориального устройства.\n\n4. Да. Основополагающий принцип демократии заключается в том, что решения принимаются большинством, но при этом должны учитываться интересы меньшинства, чтобы обеспечить справедливость и защиту прав всех граждан.\n\n5. Нет. Представительная демократия предполагает участие граждан через избранных представителей, а не через непосредственное участие народа в принятии решений. В отличие от прямой демократии, где народ участвует напрямую, в представительной системе это делают выбранные ими представители."}, {"n": "21", "text": "Выберите верные суждения о политических режимах и запишите цифры, под которыми они указаны.\n1) К признакам политического режима относят систему методов осуществления политической власти.\n2) Политические режимы различаются в зависимости от наличия или отсутствия политических партий в обществе, существования оппозиции, её статуса и взаимоотношений с государственной властью.\n3) Тип политического режима определяется состоянием прав и свобод человека в обществе, развитостью общественно-политических традиций.\n4) Наличие суверенитета – отличительная черта демократического государства.\n5) Особенностью тоталитарного режима является реализация на практике принципа верховенства права.", "answer": "123", "explanation": "1. Да. Политический режим включает в себя методы и способы осуществления власти, определяющие её характер и особенности. \n\n2. Да. Критерии наличия или отсутствия политических партий, оппозиции, их статуса и взаимоотношений с властью являются ключевыми для разграничения политических режимов. \n\n3. Да. Тип политического режима напрямую связан с состоянием прав и свобод граждан, а также с уровнем развития общественно-политических традиций в стране. \n\n4. Нет. Наличие суверенитета является общей характеристикой любого государства, а не отличительной чертой демократического режима. \n\n5. Нет. Тоталитарный режим характеризуется подавлением прав и свобод, жёстким контролем над обществом, что противоречит принципу верховенства права."}, {"n": "22", "text": "Выберите верные суждения о политических режимах и запишите цифры, под которыми они указаны.\n1) К признакам политического режима относят механизмы властвования, способ функционирования государственных органов, процедуры отбора правящих групп и политических лидеров.\n2) Тоталитарный режим от демократического отличает наличие профессионального аппарата управления (бюрократии).\n3) Режиму любого типа свойственна реализация принципа разделения властей.\n4) Политический режим характеризуется порядком распределения власти между различными социальными силами и выражающими их интересы политическими организациями.\n5) Тип политического режима в обществе определяется состоянием свобод\nи прав человека, господствующим типом легитимности власти.", "answer": "145", "explanation": "1. Да. Политический режим определяется совокупностью способов и методов осуществления власти, включая функционирование государственных органов и порядок формирования правящих элит.\n\n2. Нет. Профессиональный аппарат управления существует при любом типе государства; наличие бюрократии не является отличительным признаком тоталитарного режима.\n\n3. Нет. Принцип разделения властей реализуется в демократических государствах, но не является обязательным для авторитарных и тоталитарных режимов.\n\n4. Да. Политический режим отражает, как распределяется и осуществляется власть между социальными группами и представляющими их политическими организациями.\n\n5. Да. Уровень гарантированности прав и свобод человека, а также характер легитимности власти являются ключевыми критериями определения типа политического режима."}, {"n": "23", "text": "Выберите верные суждения о гражданском обществе и государстве и запишите цифры, под которыми они указаны.\n1) Основой гражданского общества является зрелая рыночная экономика, позволяющая субъектам экономической деятельности иметь частную собственность и отстаивать свои частные интересы.\n2) Гражданское общество может эффективно функционировать при любом политическом режиме, так как именно оно определяет границы прав и свобод граждан.\n3) Деятельность организаций гражданского общества основана на принципах добровольности, равноправия, самоуправления и законности.\n4) К признакам гражданского общества относят наличие обязательной идеологии.\n5) Деятельность гражданского общества охватывает практически все сферы деятельности людей.", "answer": "135", "explanation": "1. Да. Основой гражданского общества является рыночная экономика, в которой признаётся частная собственность и существует возможность реализации частных интересов.\n\n2. Нет. Эффективное гражданское общество формируется преимущественно в условиях демократического режима, при котором обеспечены права и свободы граждан. При авторитарных и тоталитарных режимах его развитие ограничено, т.к. сама государственная власть сильно ограничивает права и возможности граждан.\n\n3. Да. Организации гражданского общества действуют на основе добровольности вступления, равноправия участников, самоуправления и соблюдения закона. Нельзя принудительно заставить человека быть членом гражданского общества.\n\n4. Нет. Обязательная идеология — признак тоталитарного государства, а не гражданского общества. В гражданском обществе предполагается идейное многообразие, т.к. гражданское общество направлено на реализацию и отстаивание интересов граждан различных слоев.\n\n5. Да. Гражданское общество охватывает экономическую, социальную, культурную и духовную сферы жизни, не входящие в сферу прямого государственного управления."}, {"n": "24", "text": "В государстве Z были проведены политические реформы. Какие из приведённых признаков свидетельствуют о том, что государство стало правовым? Запишите цифры, под которыми они указаны.\n1) провозглашение республики\n2) создание гарантий для осуществления принципа разделения властей\n3) реализация на практике прав и свобод человека и личности\n4) победа консервативной партии на выборах\n5) верховенство закона во всех сферах жизни\n6) общественная поддержка проведённых преобразований", "answer": "235", "explanation": "1. Нет. Провозглашение республики относится к форме правления и само по себе не характеризует государство как правовое.\n\n2. Да. Разделение властей и наличие гарантий его реализации ограничивают концентрацию власти и обеспечивают взаимный контроль государственных органов.\n\n3. Да. Реальная защита и осуществление прав и свобод личности является ключевым признаком правового государства.\n\n4. Нет. Победа конкретной политической партии отражает результаты выборов, но не свидетельствует о правовом характере государства.\n\n5. Да. Верховенство закона означает обязательность правовых норм для государства, его органов и граждан и лежит в основе правового государства.\n\n6. Нет. Общественная поддержка реформ характеризует отношение общества к изменениям, но не относится к признакам правового государства."}, {"n": "25", "text": "В государстве Z регулярно проходят выборы в парламент. Какие из перечисленных признаков позволяют считать политический режим в государстве Z недемократическим? Запишите цифры, под которыми они указаны.\n1) господство единственной официальной государственной идеологии\n2) централизованная экономика, система бюрократического управления ею\n3) активная деятельность институтов гражданского общества\n4) монополия государства на правотворчество\n5) гарантия и соблюдение индивидуальных гражданских прав и свобод\n6) всесторонний контроль за жизнью граждан", "answer": "126", "explanation": "1. Да. Господство единственной государственной идеологии исключает идейный плюрализм и ограничивает свободу политического выбора, что характерно для недемократических режимов.\n\n2. Да. Централизованная экономика с жёстким бюрократическим управлением усиливает роль государства и снижает самостоятельность общества, что типично для недемократических режимов.\n\n3. Нет. Активная деятельность институтов гражданского общества свидетельствует о развитии демократии и участии граждан в общественно-политической жизни.\n\n4. Нет. Монополия государства на правотворчество является признаком любого государства.\n\n5. Нет. Гарантия и соблюдение прав и свобод личности являются ключевым признаком демократического политического режима.\n\n6. Да. Всесторонний контроль государства над жизнью граждан указывает на подавление автономии личности и общества, что характерно для недемократических режимов."}, {"n": "26", "text": "В государстве Z законодательную власть осуществляет парламент, а всенародно избираемый глава государства формирует правительство и возглавляет исполнительную власть. Граждане обладают всей полнотой прав и свобод, развиты институты гражданского общества. Государство Z включает в себя территории субъектов, которые имеют право принятия собственной конституции. Парламент имеет двухпалатную структуру. Найдите в приведённом ниже списке характеристики формы государства Z и запишите цифры, под которыми они указаны.\n1) конституционная монархия\n2) президентская республика\n3) федеративное государство\n4) демократическое государство\n5) абсолютная монархия\n6) унитарное государство", "answer": "234", "explanation": "1. Нет. В описании не указано наличие монархии, а глава государства всенародно избирается, что исключает монархию.\n\n2. Да. В описании говорится о том, что всенародно избираемый глава государства формирует правительство и возглавляет исполнительную власть, что является характерным признаком президентской республики.\n\n3. Да. Описание, в котором упоминаются субъекты, имеющие право принятия собственной конституции, указывает на федеративное устройство, где регионы обладают определённой самостоятельностью.\n\n4. Да. Упоминание о правах и свободах граждан, а также развитии институтов гражданского общества указывает на демократическое государство.\n\n5. Нет. Абсолютная монархия исключает выборность главы государства, а в данном случае глава государства избирается всенародно.\n\n6. Нет. Унитарное государство предполагает отсутствие субъектов с политической самостоятельностью, что не соответствует описанию."}, {"n": "27", "text": "Политическая реформа в стране Z способствовала развитию демократии. Какие изменения в жизни общества непосредственно отражают этот процесс? Запишите цифры, под которыми они указаны.\n1) отмена общеобязательной официальной идеологии\n2) разрешение деятельности политической оппозиции\n3) выборы президента на альтернативной основе\n4) принятие новых законов\n5) закрытие негосударственных учебных заведений\n6) переход к унитарной форме государства", "answer": "123", "explanation": "1. Да. Отмена общеобязательной официальной идеологии свидетельствует о политическом плюрализме, который является важным признаком демократического режима. \n\n2. Да. Разрешение деятельности политической оппозиции способствует созданию конкурентной политической среды, что также является признаком демократии. \n\n3. Да. Выборы президента на альтернативной основе указывают на участие граждан в политической жизни и возможность выбора, что отражает демократические принципы. \n\n4. Нет. Принятие новых законов само по себе не указывает на развитие демократии, так как это характерно для всех форм государственного устройства. \n\n5. Нет. Закрытие негосударственных учебных заведений противоречит принципам демократии, так как ограничивает свободу в сфере образования и лишает граждан альтернатив. \n\n6. Нет. Переход к унитарной форме государства не связан непосредственно с развитием демократии, так как форма государственного устройства (унитарная или федеративная) не определяет уровень демократичности."}, {"n": "28", "text": "Выберите верные суждения о выборах Президента России. Запишите цифры, под которыми они указаны.\n1) Президент России избирается гражданами Российской Федерации на основе всеобщего равного и прямого избирательного права при тайном голосовании.\n2) Выборы Президента России проводятся по единому федеральному избирательному округу, включающему в себя всю территорию Российской Федерации.\n3) Президентом России может быть избран гражданин Российской Федерации не моложе 35 лет.\n4) В соответствии с Конституцией Российской Федерации выборы Президента России назначает Государственная Дума Федерального Собрания РФ.\n5) Президент России избирается сроком на пять лет.", "answer": "123", "explanation": "1. Да. Президент Российской Федерации избирается гражданами на основе всеобщего, равного и прямого избирательного права при тайном голосовании, что закреплено в Конституции РФ.\n\n2. Да. Выборы Президента РФ проводятся по единому федеральному избирательному округу, который охватывает всю территорию Российской Федерации.\n\n3. Да. Конституция РФ устанавливает возрастной ценз для кандидата в президенты — не моложе 35 лет и при наличии гражданства РФ.\n\n4. Нет. Выборы Президента Российской Федерации назначает Совет Федерации Федерального Собрания РФ, а не Государственная Дума.\n\n5. Нет. Президент Российской Федерации избирается сроком на шесть лет, а не на пять."}, {"n": "29", "text": "Выберите верные суждения о выборах депутатов Государственной Думы Федерального Собрания Российской Федерации. Запишите цифры, под которыми они указаны.\n1) Гражданин России, достигший на день голосования 18 лет, может быть избран депутатом Государственной Думы.\n2) В соответствии с Конституцией Российской Федерации в Государственную Думу избирается 450 депутатов.\n3) Не имеет права быть избранным депутатом Государственной Думы гражданин России, осуждённый к лишению свободы за совершение особо тяжкого преступления, судимость которого снята или погашена – до истечения 15 лет со дня снятия или погашения судимости.\n4) Подготовка и проведение выборов депутатов Государственной Думы осуществляются открыто и гласно.\n5) Все депутаты Государственной Думы избираются по одномандатным избирательным округам.", "answer": "234", "explanation": "1. Нет. Для избрания депутатом Государственной Думы установлен более высокий возрастной ценз — кандидат должен достичь 21 года.\n\n2. Да. Конституцией Российской Федерации закреплено, что Государственная Дума состоит из 450 депутатов.\n\n3. Да. Закон устанавливает дополнительные ограничения пассивного избирательного права для лиц, осуждённых за особо тяжкие преступления, даже после снятия или погашения судимости в течение установленного срока.\n\n4. Да. Выборы депутатов Государственной Думы проводятся на основе принципов гласности и открытости, что обеспечивает общественный контроль за избирательным процессом.\n\n5. Нет. Депутаты Государственной Думы избираются по смешанной системе: часть по одномандатным округам, часть по федеральным партийным спискам."}, {"n": "30", "text": "Выберите верные суждения о выборах Президента Российской Федерации. Запишите цифры, под которыми они указаны.\n1) Президент России избирается гражданами на основе всеобщего равного и прямого избирательного права при тайном голосовании.\n2) Подготовка и проведение выборов Президента России, обеспечение реализации и защиты избирательных прав граждан и контроль за соблюдением указанных прав возлагаются на избирательные комиссии в пределах их компетенции.\n3) Зарегистрированным кандидатам гарантируются равные условия доступа к средствам массовой информации для проведения предвыборной агитации.\n4) Кандидаты на должность Президента России могут быть выдвинуты только политическими партиями.\n5) Президентом России может быть избран гражданин Российской Федерации не моложе 25 лет, постоянно проживающий в России не менее 5 лет.", "answer": "123", "explanation": "1. Да. Президент Российской Федерации избирается гражданами на основе всеобщего, равного и прямого избирательного права при тайном голосовании, что прямо закреплено в Конституции РФ.\n\n2. Да. Подготовка и проведение выборов, защита избирательных прав граждан и контроль за их соблюдением осуществляются избирательными комиссиями в пределах установленной законом компетенции.\n\n3. Да. Зарегистрированным кандидатам гарантируются равные условия доступа к средствам массовой информации для проведения предвыборной агитации, что обеспечивает принцип равенства кандидатов.\n\n4. Нет. Кандидаты на должность Президента РФ могут быть выдвинуты как политическими партиями, так и в порядке самовыдвижения.\n\n5. Нет. Кандидат в Президенты РФ должен быть не моложе 35 лет и постоянно проживать в Российской Федерации не менее 25 лет, поэтому указанные в суждении требования не соответствуют Конституции РФ."}, {"n": "31", "text": "Представьте, что Вы помогаете учителю оформить презентацию к уроку обществознания по теме «Избирательная кампания в Российской Федерации». Один из слайдов называется «Выборы депутатов Государственной Думы Федерального Собрания Российской Федерации». Что из перечисленного следует включить в этот слайд? Запишите цифры, под которыми указаны соответствующие позиции.\n1) Гражданин России, достигший на день голосования 18 лет, может быть избран депутатом Государственной Думы.\n2) В соответствии с Конституцией Российской Федерации в Государственную Думу Федерального Собрания РФ избирается 450 депутатов.\n3) Не имеет права быть избранным депутатом Государственной Думы гражданин России, осуждённый к лишению свободы за совершение тяжкого и (или) особо тяжкого преступления и имеющий на день голосования неснятую и непогашенную судимость за указанное преступление.\n4) Все депутаты Государственной Думы избираются по одномандатным избирательным округам.\n5) Подготовка и проведение выборов депутатов Государственной Думы осуществляются открыто и гласно.\n6) Выборы всех депутатов Государственной Думы осуществляются по мажоритарной системе.", "answer": "235", "explanation": "1. Нет. Для избрания депутатом Государственной Думы установлен возрастной ценз 21 год, поэтому достижение 18 лет даёт право голосовать, но не быть избранным.\n\n2. Да. Конституция Российской Федерации закрепляет численный состав Государственной Думы — 450 депутатов.\n\n3. Да. Закон ограничивает пассивное избирательное право лиц с неснятой и непогашенной судимостью за тяжкие и особо тяжкие преступления.\n\n4. Нет. Депутаты Государственной Думы избираются по смешанной избирательной системе, а не только по одномандатным округам.\n\n5. Да. Подготовка и проведение выборов осуществляется на основе принципов открытости и гласности, что обеспечивает прозрачность избирательного процесса.\n\n6. Нет. Выборы депутатов Государственной Думы не являются полностью мажоритарными, так как часть депутатов избирается по пропорциональной системе."}, {"n": "32", "text": "Выберите верные суждения о политическом участии в демократическом обществе и запишите цифры, под которыми они указаны.\n1) Политическое участие – это индивидуальные или групповые действия в целях влияния на власть любого уровня или на выбор политического лидера.\n2) Политическое участие осуществляется только через избранных представителей.\n3) Политическое участие может быть постоянным и эпизодическим, организованным и неорганизованным.\n4) Граждане имеют право участвовать в общественных объединениях (союзах, ассоциациях и политических партиях).\n5) Степень вовлечённости гражданина в политическую жизнь страны зависит только от его личных качеств.", "answer": "134", "explanation": "1. Да. Политическое участие включает различные формы активности граждан – как индивидуальные (голосование, участие в митингах), так и групповые (участие в партиях, общественных движениях) – с целью влияния на власть или выбор политических лидеров. \n\n2. Нет. Политическое участие может осуществляться не только через избранных представителей (депутатов), но и напрямую – например, через референдумы, петиции, митинги. \n\n3. Да. Политическое участие бывает разным по степени вовлечённости: постоянным (активная политическая деятельность) и эпизодическим (участие в выборах), организованным (в рамках партий, движений) и неорганизованным (стихийные акции). \n\n4. Да. Граждане демократических государств имеют право на объединение в союзы, ассоциации и политические партии, что является формой политического участия. \n\n5. Нет. На степень вовлечённости гражданина в политическую жизнь влияет не только его личная активность, но и факторы среды – политическая культура, уровень демократии, социально-экономические условия."}, {"n": "33", "text": "Выберите верные суждения о политическом процессе и запишите цифры, под которыми они указаны.\n1) В зависимости от объекта власти различают прогрессивные и регрессивные политические процессы.\n2) Домохозяйства и фирмы являются субъектами политического процесса.\n3) Политический процесс включает в себя совокупность действий индивидов, групп, политических институтов, реализующих свои политические цели и интересы.\n4) Политический процесс отражает технологию осуществления политической власти, принятия и воплощения в жизнь политических решений.\n5) Субъекты различных политических процессов стремятся реализовать свои интересы и требования посредством принимаемых государством управленческих решений.", "answer": "345", "explanation": "1. Нет. Прогрессивной или регрессивной может быть шкала налогообложения или для оценки направленности изменений в обществе.\n\n2. Нет. Домохозяйства и фирмы не являются прямыми субъектами политического процесса. Субъектами политического процесса выступают индивиды, социальные группы, общественные объединения, партии и государственные институты. \n\n3. Да. Политический процесс охватывает действия различных субъектов, направленные на достижение их целей и интересов в сфере политики, что является его основным содержанием. \n\n4. Да. Политический процесс представляет собой механизм осуществления политической власти и включает этапы принятия, реализации и контроля за выполнением политических решений. \n\n5. Да. Политический процесс предполагает, что его участники добиваются своих целей через взаимодействие с государственной властью, включая внесение предложений, участие в выборах или акциях протеста."}, {"n": "34", "text": "Выберите верные суждения о политическом процессе и запишите цифры, под которыми они указаны.\n1) Политические процессы могут проходить с разной степенью интенсивности в разные периоды и в зависимости от затрагиваемых вопросов.\n2) По уровню масштаба выделяют публичные и скрытые политические процессы.\n3) Глобальные политические процессы характеризуются тем, что в них участвуют члены одной политической организации или отдельного региона.\n4) Политический процесс отражает технологию осуществления политической власти, принятия и воплощения в жизнь политических решений.\n5) Субъекты различных политических процессов стремятся реализовать свои интересы и требования посредством принимаемых государством управленческих решений.", "answer": "145", "explanation": "1. Да. Политические процессы отличаются по интенсивности и динамике, так как зависят от конкретных исторических условий, значимости решаемых вопросов и степени вовлечённости участников.\n\n2. Нет. Деление на публичные и скрытые связано со степенью открытости политических процессов.\n\n3. Нет. Глобальные политические процессы охватывают взаимодействие многих государств и международных акторов, а не ограничиваются рамками одной организации или региона.\n\n4. Да. Политический процесс показывает, каким образом осуществляется политическая власть, как принимаются и реализуются политические решения.\n\n5. Да. Участники политических процессов стремятся отстаивать и реализовывать свои интересы через воздействие на государственные управленческие решения."}, {"n": "35", "text": "Выберите верные суждения о политическом процессе и запишите цифры, под которыми они указаны.\n1) В зависимости от объекта власти различают пропорциональные и мажоритарные политические процессы.\n2) Субъекты различных политических процессов стремятся реализовать свои интересы и требования посредством принимаемых государством управленческих решений.\n3) Глобальные политические процессы характеризуются тем, что в них участвуют члены одной политической организации или отдельного региона.\n4) Политический процесс отражает технологию осуществления политической власти, принятия и воплощения в жизнь политических решений.\n5) Домохозяйства и фирмы выступают субъектами политического процесса.", "answer": "24", "explanation": "1. Нет. Пропорциональные и мажоритарные — это виды избирательных систем, а не классификация политических процессов по объекту власти.\n\n2. Да. Участники политического процесса стремятся реализовать свои интересы и требования через воздействие на принимаемые государством управленческие решения.\n\n3. Нет. Глобальные политические процессы охватывают взаимодействие государств и международных акторов, а не ограничиваются одной организацией или отдельным регионом.\n\n4. Да. Политический процесс отражает механизм осуществления политической власти, а также порядок принятия и реализации политических решений.\n\n5. Нет. Домохозяйства и фирмы являются основными субъектами экономических отношений; субъектами политического процесса выступают государство, политические партии, общественные движения, граждане."}, {"n": "36", "text": "Выберите верные суждения о политическом участии в демократическом обществе и запишите цифры, под которыми они указаны.\n1) Участие граждан в политической жизни страны – это осознанное влияние конкретного человека на принятие и реализацию важных общественных решений или формирование органов государственной власти.\n2) Политическое участие осуществляется только через избранных представителей.\n3) Политическое участие предполагает в том числе и совместные действия граждан для достижения групповых интересов.\n4) Граждане имеют право сами участвовать в общественных объединениях (союзах, ассоциациях и политических партиях).\n5) Степень вовлечённости гражданина в политическую жизнь страны зависит только от его личных качеств.", "answer": "134", "explanation": "1. Да. Политическое участие предполагает осознанное воздействие граждан на принятие общественно значимых решений и формирование органов государственной власти.\n\n2. Нет. В демократическом обществе политическое участие осуществляется не только через представителей, но и напрямую, например через выборы, референдумы, общественные инициативы.\n\n3. Да. Политическое участие включает коллективные формы деятельности, направленные на защиту и реализацию общих интересов социальных групп.\n\n4. Да. Участие в общественных объединениях и политических партиях является одной из форм политического участия граждан в демократическом обществе.\n\n5. Нет. Степень вовлечённости в политическую жизнь зависит не только от личных качеств гражданина, но и от политического режима, уровня политической культуры и условий, создаваемых государством."}, {"n": "37", "text": "Выберите верные суждения о политических партиях и запишите цифры, под которыми они указаны.\n1) Политические партии нацелены на завоевание (удержание) власти для реализации определённого политического курса.\n2) По способу организации выделяют массовые и кадровые партии.\n3) Основными функциями политических партий являются разработка и принятие государственного бюджета.\n4) По отношению к парламенту партии делятся на легальные и нелегальные.\n5) Политические партии для получения мест в парламенте пропагандируют определённую политическую идеологию.", "answer": "125", "explanation": "1. Да. Политические партии стремятся к завоеванию или удержанию власти, чтобы реализовать свою программу и политический курс. \n\n2. Да. По способу организации партии делятся на массовые, с широкой социальной базой и активным участием членов, и кадровые, состоящие из небольшой группы профессиональных политиков. \n\n3. Нет. Разработка и принятие государственного бюджета относится к компетенции органов государственной власти, а не политических партий. \n\n4. Нет. Деление на легальные и нелегальные партии связано с их правовым статусом, а не с их отношением к парламенту. \n\n5. Да. Политические партии пропагандируют свои идеологии, чтобы привлечь избирателей и получить места в парламенте для реализации своих целей."}, {"n": "38", "text": "Выберите верные суждения о политических партиях и запишите цифры, под которыми они указаны.\n1) Политические партии выполняют роль посредника между обществом и государством.\n2) По организационному строению (организационной структуре / внутренней структуре) выделяют массовые и кадровые партии.\n3) Основная функция политических партий состоит в разработке и принятии государственного бюджета.\n4) По отношению к избирателям партии делятся на легальные и нелегальные.\n5) Кадровыми партиями считаются партии, которые по результатам выборов лишены возможности исполнять правительственные функции.", "answer": "12", "explanation": "1. Да. Политические партии выполняют роль посредника между обществом и государством, представляя интересы различных социальных групп и участвуя в политическом процессе. \n\n2. Да. По организационному строению политические партии делятся на массовые (с разветвлённой структурой, ориентированные на широкий круг избирателей) и кадровые (ориентированные на узкий круг профессиональных политиков). \n\n3. Нет. Разработка и принятие государственного бюджета — это функции органов государственной власти, а не политических партий. \n\n4. Нет. Деление партий на легальные и нелегальные связано с их статусом в рамках правового поля государства, а не с отношением к избирателям. \n\n5. Нет. Кадровые партии отличаются тем, что они активизируются в период выборов, а не из-за невозможности исполнять правительственные функции."}, {"n": "39", "text": "Выберите верные суждения о политических партиях и общественно-политических движениях и запишите цифры, под которыми они указаны.\n1) По способу организации различают партии легальные и нелегальные.\n2) В массовых партиях отсутствует система членства, а вся деятельность партии ориентирована только на проведение избирательных кампаний.\n3) Кадровые партии, как правило, отстаивают священность и неотчуждаемость естественных прав личности, их приоритет над интересами общества и государства.\n4) Общественно-политические движения – это массовые общественные объединения, которые могут оказывать воздействие на государственную власть.\n5) Политические партии участвуют в выборах в органы государственной власти.", "answer": "45", "explanation": "1. Нет. По способу организации партии делятся на массовые и кадровые, а не на легальные и нелегальные. Легальность партии определяется соблюдением законодательства. \n\n2. Нет. В массовых партиях существует система членства, и их деятельность направлена не только на проведение избирательных кампаний, но и на широкий спектр политической активности, включая мобилизацию сторонников, формулирование политической программы и участие в законодательной деятельности. В суждении описана кадровая партия.\n\n3. Нет. Кадровые партии состоят из небольшого числа профессиональных политиков. Либерная идеология же провозглашает права личности над интересами общества и государства. \n\n4. Да. Общественно-политические движения — это массовые объединения, которые могут оказывать влияние на государственную власть, но не стремятся к завоеванию власти, как политические партии. \n\n5. Да. Политические партии участвуют в выборах в органы государственной власти (например, парламент), выдвигая кандидатов и представляя свои программы избирателям."}, {"n": "40", "text": "В демократическом государстве Z в ходе реформы избирательной системы был осуществлён переход от пропорциональной к мажоритарной системе выборов в парламент. Что из перечисленного осталось неизменным в ходе избирательной реформы? Запишите соответствующие цифры.\n1) принцип тайного голосования\n2) голосование по единому общенациональному избира
