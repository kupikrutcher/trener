х изоляции от общества в специально предназначенных для этого местах (СИЗО).5. Подписка о невыезде и надлежащем поведении — мера пресечения, состоящая в письменном обязательстве лица не покидать место жительства без разрешения, являться по вызовам и не препятствовать производству по делу.6. Залог — мера пресечения, заключающаяся в передаче подозреваемым, обвиняемым либо другим лицом в орган, осуществляющий производство по делу, имущества или денег в целях обеспечения явки и надлежащего поведения."}, {"n": "Задание № 47", "text": "Выберите верные суждения о нормах уголовно-процессуального права в Российской Федерации и запишите цифры, под которыми они указаны.1) Уголовное судопроизводство ведётся только на родном языке потерпевшего. 2) Функции обвинения, защиты и разрешения уголовного дела могут быть возложены на одно и то же должностное лицо. 3) Обвинительный приговор может быть основан на предположениях. 4) Уголовное судопроизводство имеет своим назначением защиту личности от незаконного и необоснованного обвинения, осуждения, ограничения её прав и свобод. 5) Судьи рассматривают и разрешают уголовные дела в условиях, исключающих постороннее воздействие на них.", "answer": "45", "explanation": "1. Нет. Уголовное судопроизводство ведётся на русском языке, а если участник не владеет русским языком, ему предоставляется переводчик.2. Нет. Функции обвинения, защиты и разрешения уголовного дела разделены и не могут быть возложены на одно и то же должностное лицо.3. Нет. Обвинительный приговор не может быть основан на предположениях. Он требует подтверждения и доказательств.4. Да. Уголовное судопроизводство имеет своим назначением защиту личности от незаконного и необоснованного обвинения, осуждения, ограничения её прав и свобод.5. Да. Судьи рассматривают и разрешают уголовные дела в условиях, исключающих постороннее воздействие на них."}, {"n": "Задание № 48", "text": "Выберите верные суждения о нормах уголовно-процессуального права в Российской Федерации и запишите цифры, под которыми они указаны.1) Определения суда должны быть законными, обоснованными и мотивированными,2) Обвинительный приговор может быть основан на предположениях.3) Лицо, которое задержано по подозрению в совершении преступления, должно содержаться в условиях, исключающих угрозу его жизни и здоровью.4) Функции обвинения, защиты и разрешения уголовного дела могут быть возложены на одно и то же должностное лицо.5) В ходе судебного производства по уголовному делу адвокат поддерживает государственное обвинение, обеспечивая его законность и обоснованность", "answer": "13", "explanation": "1. Да. Все решения суда (включая определения и постановления), а также решения судьи, прокурора и следователя должны быть законными, обоснованными и мотивированными.2. Нет. Обвинительный приговор не может быть основан на предположениях. Он постановляется лишь при условии, что в ходе судебного разбирательства виновность подсудимого в совершении преступления подтверждена совокупностью исследованных судом доказательств.3. Да. При осуществлении правосудия по уголовным делам никто не должен подвергаться насилию, пыткам, другому жестокому или унижающему человеческое достоинство обращению. Лицо, задержанное по подозрению в преступлении, должно содержаться в условиях, исключающих угрозу его жизни и здоровью.4. Нет. В уголовном судопроизводстве функции обвинения, защиты и разрешения уголовного дела отделены друг от друга и не могут быть возложены на одно и то же должностное лицо или один и тот же орган. 5. Нет. Государственное обвинение в суде поддерживает прокурор. Адвокат (защитник) представляет интересы подсудимого, обеспечивая реализацию его права на защиту и оспаривая доводы обвинения."}, {"n": "Задание № 49", "text": "Установите соответствие между субъектами и участниками уголовного судопроизводства (согласно Уголовно-процессуальному кодексу Российской Федерации): к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.СУБЪЕКТЫА) экспертБ) прокурорВ) обвиняемыйГ) следовательД) свидетельУЧАСТНИКИ УГОЛОВНОГО СУДОПРОИЗВОДСТВА1) сторона защиты2) сторона обвинения3) иные участникиЗапишите в таблицу выбранные цифры под соответствующими буквами", "answer": "32123", "explanation": "А) эксперт — 3) иные участникиБ) прокурор — 2) сторона обвиненияВ) обвиняемый — 1) сторона защитыГ) следователь — 2) сторона обвиненияД) свидетель — 3) иные участники"}, {"n": "Задание № 50", "text": "Установите соответствие между участниками уголовного судопроизводства и стороной, которую он представляет: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца.УЧАСТНИКИ УГОЛОВНОГО СУДОПРОИЗВОДСТВА А) подозреваемыйБ) прокурорВ) адвокатГ) потерпевшийД) обвиняемыйСТОРОНЫ УГОЛОВНОГО СУДОПРОИЗВОДСТВА 1) обвинение2) защита", "answer": "21212", "explanation": "А. подозреваемый - 2. защитаБ. прокурор - 1. обвинениеВ. адвокат - 2. защитаГ. потерпевший - 1. обвинениеД. обвиняемый - 2. защита"}];
const BUILTIN_NAME = "Право · 50 заданий";

let tests=[];
let bank=[], curName="", idx=0, score=0, answered=false, results=[];
const $=s=>document.querySelector(s);
const app=$('#app');

/* ---- theme ---- */
const THEMES=['paper','night','sepia','forest'];
function setTheme(t){
  if(THEMES.indexOf(t)<0) t='paper';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('tr_theme',t)}catch(e){}
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===t));
}
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));
(function(){let t='paper';try{t=localStorage.getItem('tr_theme')||'paper'}catch(e){}setTheme(t)})();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---- tests storage ---- */
function loadTests(){
  tests=[{id:'builtin',name:BUILTIN_NAME,builtin:true,questions:BUILTIN}];
  try{
    const raw=localStorage.getItem('tr_tests');
    if(raw){JSON.parse(raw).forEach(t=>{if(t&&t.questions&&t.questions.length)tests.push({id:t.id,name:t.name,questions:t.questions})})}
  }catch(e){}
}
function saveTests(){
  try{localStorage.setItem('tr_tests', JSON.stringify(tests.filter(t=>!t.builtin)));}
  catch(e){toast('Не удалось сохранить (память браузера переполнена)')}
}

/* ---- helpers ---- */
function norm(s){return (s||'').replace(/\D/g,'')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function plural(n){const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'задание':(a>=2&&a<=4&&(b<10||b>=20)?'задания':'заданий'))}

function qType(t){
  if(/соответстви/i.test(t)) return 'Соответствие';
  if(/выберите верные суждения/i.test(t)) return 'Выбор суждений';
  if(/найдите|какие|что из|перечн/i.test(t)) return 'Несколько ответов';
  return 'Краткий ответ';
}
function fmtQ(t){
  let s=esc(t);
  s=s.replace(/\s*(ХАРАКТЕРИСТИКИ|ИСТОЧНИКИ[^0-9А-ЯЁ]*\([^)]*\)|ИСТОЧНИКИ[^0-9]*|ВИДЫ[^0-9]*|ПРОСТУПКИ|ПРИМЕРЫ|ДЕЙСТВИЯ[^0-9]*|МЕРЫ[^0-9]*|СИТУАЦИИ|ОСНОВАНИЯ[^0-9]*|КАТЕГОРИИ[^0-9]*|ЭЛЕМЕНТЫ[^0-9]*|ОРГАНИЗАЦИОННО[^0-9]*|СУБЪЕКТЫ|УЧАСТНИКИ[^0-9]*|СТОРОНЫ[^0-9]*|ПРАВОМОЧИЯ[^0-9]*)\s*/g,
    m=>'</span><span class="hdr">'+m.trim()+'</span><span class="lead">');
  s=s.replace(/\s*(\d{1,2}\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*([А-Д]\))\s*/g,'</span><span class="opt">$1 ');
  s=s.replace(/\s*(Запишите[^]*)$/,'</span><span class="ins">$1');
  s='<span class="lead">'+s+'</span>';
  s=s.replace(/<span class="[a-z]+">\s*<\/span>/g,'');
  return s;
}
function fmtExpl(t){
  let s=esc(t).replace(/\s+/g,' ').trim();
  const letterMode=(s.match(/[АБВГД][.)]/g)||[]).length>=3;
  if(letterMode){
    s=s.replace(/\s*([АБВГД][.)])\s*/g,'</div><div class="epoint">$1 ');
  }else{
    s=s.replace(/(^|[\s.;:»)\]])(\d{1,2}[.)])\s+/g,'$1</div><div class="epoint">$2 ');
  }
  s='<div class="epoint">'+s+'</div>';
  s=s.replace(/<div class="epoint">\s*<\/div>/g,'');
  return s;
}

/* ---- home / library ---- */
function home(){
  $('#bars').style.display='none';
  $('#foot').textContent='';
  app.className='panel fade';
  const cards=tests.map(t=>`
    <div class="tcard" onclick="openTest('${t.id}')">
      <div class="tinfo">
        <div class="tname">${esc(t.name)}${t.builtin?'<span class="tbadge">встроенный</span>':''}</div>
        <div class="tmeta">${plural(t.questions.length)}</div>
      </div>
      ${t.builtin?'':`<button class="trm" title="Удалить" onclick="event.stopPropagation();removeTest('${t.id}')">✕</button>`}
      <span class="tgo">→</span>
    </div>`).join('');
  app.innerHTML=`
    <div class="home">
      <h1>Тесты</h1>
      <p class="sub">Выбери тест или добавь свой. Имя теста = имя файла.</p>
      <div class="tlist">${cards}</div>
      <button class="btn ghost" onclick="document.getElementById('file').click()">+ Добавить тесты (CSV)</button>
      <div class="note">Можно выбрать сразу несколько файлов. Формат CSV: «Номер задания», «Текст вопроса и варианты ответа», «Правильный ответ», «Пояснение».</div>
    </div>`;
}

function openTest(id){
  const t=tests.find(x=>x.id===id); if(!t)return;
  bank=t.questions; curName=t.name; begin();
}
function removeTest(id){
  tests=tests.filter(t=>t.id!==id); saveTests(); home();
}

function begin(){idx=0;score=0;results=[];render()}

function bars(){
  $('#bars').style.display='block';
  $('#tot').textContent=bank.length;
  $('#cur').textContent=Math.min(idx+1,bank.length);
  $('#scr').textContent=score;
  $('#pbar').style.width=(idx/bank.length*100)+'%';
}

function render(){
  if(idx>=bank.length) return finish();
  answered=false;
  const q=bank[idx];
  bars();
  $('#foot').textContent=curName;
  app.className='panel fade';
  app.innerHTML=`
    <div class="qhead">
      <span class="qnum">${esc(q.n||('Задание '+(idx+1)))}</span>
      <span class="qtype">${qType(q.text)}</span>
    </div>
    <div class="qtext">${fmtQ(q.text)}</div>
    <div class="az">
      <label class="lab" for="inp">Твой ответ — только цифры</label>
      <input id="inp" class="field" inputmode="numeric" autocomplete="off" placeholder="Ты точно знаешь правильный ответ">
      <button class="btn" id="check" onclick="check()">Проверить</button>
      <button class="linkfin" onclick="finishEarly()">Завершить тест</button>
    </div>
    <div class="verdict" id="verdict"></div>`;
  const inp=$('#inp'); inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answered?next():check()}});
}

function check(){
  if(answered) return;
  const q=bank[idx], inp=$('#inp'), user=norm(inp.value);
  if(!user){inp.classList.add('wrong');setTimeout(()=>inp.classList.remove('wrong'),360);toast('Введи ответ');return}
  answered=true;
  const ok=user===norm(q.answer);
  if(ok) score++;
  results.push({n:q.n,user,answer:norm(q.answer),ok});
  inp.classList.add(ok?'good':'wrong'); inp.readOnly=true;
  $('#scr').textContent=score;
  $('#check').outerHTML=`<button class="btn" onclick="next()">${idx+1<bank.length?'Дальше':'Результат'}</button>`;
  const v=$('#verdict');
  v.className='verdict show '+(ok?'ok':'bad');
  v.innerHTML=`
    <div class="vrow"><span class="vdot">${ok?'✓':'✕'}</span>${ok?'Верно':'Неверно'}</div>
    ${ok?'':`<div class="cline">Правильный ответ:<b>${esc(q.answer)}</b></div>`}
    ${q.explanation?`<button class="etog" onclick="tog(this)">Скрыть разбор</button>
      <div class="expl open"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}`;
  setTimeout(()=>{if(v.scrollIntoView)v.scrollIntoView({behavior:'smooth',block:'nearest'})},120);
}
function tog(b){const e=b.nextElementSibling;e.classList.toggle('open');
  b.textContent=e.classList.contains('open')?'Скрыть разбор':'Показать разбор'}
function next(){idx++;render()}

/* ---- early finish: show every question + correct answer + explanation toggle ---- */
function finishEarly(){
  $('#bars').style.display='none';
  app.className='panel fade';
  const items=bank.map((q,i)=>`
    <div class="allitem">
      <div class="qhead">
        <span class="qnum">${esc(q.n||('Задание '+(i+1)))}</span>
        <span class="qtype">${qType(q.text)}</span>
      </div>
      <div class="qtext">${fmtQ(q.text)}</div>
      <div class="aans">Правильный ответ:<b>${esc(q.answer)}</b></div>
      ${q.explanation?`<button class="etog" onclick="tog2(this)">Пояснение</button>
        <div class="expl"><div class="expl-inner">${fmtExpl(q.explanation)}</div></div>`:''}
    </div>`).join('');
  app.innerHTML=`
    <div class="allhead"><h1>Все задания</h1></div>
    <p class="allsub">${esc(curName)} · ${plural(bank.length)} с правильными ответами</p>
    <div class="rrow" style="margin-bottom:6px">
      <button class="btn" onclick="begin()">Решать заново</button>
      <button class="btn ghost" onclick="home()">К тестам</button>
    </div>
    ${items}`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function tog2(b){const e=b.nextElementSibling;e.classList.toggle('open');
  b.textContent=e.classList.contains('open')?'Скрыть пояснение':'Пояснение'}

function grade(p){
  if(p>=90) return ['Отлично','Материал ты знаешь уверенно.'];
  if(p>=75) return ['Хорошо','Крепкий результат — почти идеал.'];
  if(p>=50) return ['Неплохо','База есть, слабые темы стоит повторить.'];
  return ['Нужно повторить','Пройди материал ещё раз и попробуй снова.'];
}
function finish(){
  $('#pbar').style.width='100%'; $('#cur').textContent=bank.length;
  const p=Math.round(score/bank.length*100), gr=grade(p), g=gr[0], gs=gr[1];
  const R=66, C=2*Math.PI*R, off=C*(1-p/100);
  const wrong=results.filter(r=>!r.ok);
  app.className='panel fade';
  app.innerHTML=`
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle class="bgc" cx="75" cy="75" r="66" fill="none" stroke-width="3"/>
        <circle class="fgc" cx="75" cy="75" r="66" fill="none" stroke-width="3"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" id="fgc"/>
      </svg>
      <div class="lab"><b>${score}<i>/${bank.length}</i></b><span>${p}% верно</span></div>
    </div>
    <div class="gtitle">${g}</div>
    <div class="gsub">${esc(curName)} · ${gs}</div>
    <div class="rrow">
      <button class="btn" onclick="begin()">Заново</button>
      <button class="btn ghost" onclick="home()">К тестам</button>
    </div>
    <button class="linkfin" onclick="finishEarly()">Показать все задания с ответами</button>
    ${wrong.length?`<div class="review"><h3>Ошибки · ${wrong.length}</h3>${
      wrong.map(r=>`<div class="rev"><span class="rn">${esc(r.n)}</span>
        <span class="rd"><span class="y">${esc(r.user||'—')}</span><span class="g">${esc(r.answer)}</span></span></div>`).join('')
    }</div>`:`<div class="review"><h3>Все ответы верны</h3></div>`}`;
  setTimeout(()=>{$('#fgc').style.strokeDashoffset=off},150);
}

/* ---- add tests from files ---- */
function fileName(name){return name.replace(/\.[^.]+$/,'').trim()||'Без имени'}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
$('#file').addEventListener('change',ev=>{
  const files=[...ev.target.files]; ev.target.value='';
  if(!files.length) return;
  let added=0, pending=files.length;
  const done=()=>{ if(--pending===0){ saveTests(); home();
    toast(added?('Добавлено тестов: '+added):'Не удалось прочитать файлы'); } };
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ try{const qs=parseCSV(r.result);
      if(qs.length){tests.push({id:uid(),name:fileName(f.name),questions:qs}); added++;}}catch(e){} done(); };
    r.onerror=()=>done();
    r.readAsText(f,'utf-8');
  });
});
function parseCSV(text){
  text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}}
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<3)continue;
    const n=(r[0]||'').trim(),tx=(r[1]||'').trim(),an=(r[2]||'').trim();
    if(!tx||!an)continue;
    out.push({n:n||('Задание '+i),text:tx,answer:an,explanation:(r[3]||'').trim()})}
  return out;
}

loadTests();
home();
</script>
